# Chapter 9, Steadiness: Readings Over Time with its fitted levels, under
# the strip of the same two hours.
output = "steadiness-readings.png"

layout = ["column", [0.4, "Strip"], [0.6, "SteadyReadings"]]

[data]
corpus = "pepsi3235_DU_7h"
files = ["take_part01-006.flac", "take_part01-007.flac"]
start = 0
seconds = 7200
folder = "Pepsi 3235 DU"

[wait]
at_least = 20
at_most = 1200

[window]
size = [1800, 1000]

[settings]
show_readings = false
overlays = [false, true, false]
rate_line = false
rate_guides = false
steady_shown = [["Readings", [true, true, false]]]

[settings.strip]
half_width_ms = 250.0
span_s = 7200.0
horizontal = true

# The take has no session.toml; these are from its README.
[data.session]
watch = "Pepsi (Dandong 3235)"
calibre = "Dandong 3235"
bph = 28800
lift = 55
position = "DU"
