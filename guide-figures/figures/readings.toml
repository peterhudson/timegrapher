# Chapter 5, Readings: the cards across the top over a short recording of
# a steady watch, with the strip they come from.
output = "readings.png"

layout = "Strip"

[data]
corpus = "dd3235_DU_30min"
file = "take_part01-001.flac"
start = 300
seconds = 45

# The take names the calibre "3235", which the catalogue reads as Rolex's.
[data.session]
calibre = "Dandong 3235"

[window]
size = [1700, 800]

[settings]
overlays = [false, false, false]
rate_line = true
rate_guides = false

[settings.strip]
half_width_ms = 10.0
span_s = 30.0
horizontal = true
