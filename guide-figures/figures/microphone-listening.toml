# Chapter 3, The Microphone: the Microphone controls while listening, with
# the Peak meter moving, beside the strip they feed.
output = "microphone-listening.png"

layout = ["row", [0.3, "Watch"], [0.7, "Strip"]]

# The watch on the stand, then Start.
actions = [["sleep", 10], ["stand", "DU"], ["click", 80, 164], ["sleep", 2]]

[data]
corpus = "dd3235_DU_30min"
file = "take_part01-001.flac"
start = 300
seconds = 80
folder = "Dandong 3235 DU"
mode = "microphone"

[wait]
exact = 30

[window]
size = [1500, 900]

[settings]
show_readings = false
keep_awake = false
overlays = [false, false, false]
