# Chapter 13, Sessions and Recordings: the time slider moved back to a
# moment in the recording; the cards, strip and chart follow it.
output = "time-slider.png"

layout = ["column", [0.5, "Strip"], [0.5, "Rate"]]

# Drag the time slider back to halfway.
actions = [["sleep", 8], ["drag", 1584, 200, 821, 200], ["sleep", 2]]

[data]
corpus = "dd3235_DU_30min"
file = "take_part01-001.flac"
start = 300
seconds = 45

# The take names the calibre "3235", which the catalogue reads as Rolex's.
[data.session]
calibre = "Dandong 3235"

[window]
size = [1700, 900]

[settings]
overlays = [false, false, false]
rate_line = true

[settings.strip]
half_width_ms = 10.0
span_s = 30.0
horizontal = true
