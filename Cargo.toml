[workspace]
resolver = "2"
members = ["crates/timegrapher-core", "crates/timegrapher-cli", "crates/timegrapher-app", "crates/timegrapher-mcp"]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/peterhudson/timegrapher"
# Supported source-build floor, exercised by the Linux CI job (docs/building.md).
rust-version = "1.90"

[workspace.dependencies]
timegrapher-core = { path = "crates/timegrapher-core" }

[profile.release]
debug = 1

# Function limits (architecture guide, section 12): 100 lines and a
# cognitive complexity of 25, Clippy's defaults. A function over either
# today carries #[expect]; the mark comes off when it is split.
[workspace.lints.clippy]
too_many_lines = "warn"
cognitive_complexity = "warn"
