[package]
name = "timegrapher-mcp"
description = "MCP server: the timegrapher for chat apps without a command line"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# The MCP SDK (rmcp) needs a newer compiler than the rest of the workspace.
rust-version = "1.88"

[[bin]]
name = "timegrapher-mcp"
path = "src/main.rs"

[dependencies]
rmcp = { version = "3.5", default-features = false, features = ["server", "transport-io"] }
tokio = { version = "1", features = ["macros", "rt", "io-std", "process", "time", "sync", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The palette, shared with the app (no sound devices).
timegrapher-core.workspace = true
