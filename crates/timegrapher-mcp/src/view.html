    const overlap = rows[0].reduce((m, [a, b]) => Math.max(m, Math.min(b + NAME_GAP - at, at + w + NAME_GAP - a)), -Infinity);
    const outRow = (was[i] || 0) === 1 ? overlap > -HYSTERESIS : overlap > HYSTERESIS;
    let a = at, row = 0;
    if (outRow) {
      for (let hit; (hit = rows[1].find(([s, e]) => a < e + NAME_GAP && a + w + NAME_GAP > s));) a = hit[1] + NAME_GAP;
      a = Math.min(a, last);
      row = 1;
    }
    rows[row].push([a, a + w]);
    out[i] = [a, row];
  }
  return out;
}

// marks::place_row: each name's left edge in a lane of one row; one that
// would touch slides past, right where it fits, else left.
function markPlaceRow(names, left, right) {
  const { NAME_GAP } = MARKS;
  const taken = [], out = names.map(() => 0);
  for (const i of markOrder(names)) {
    const [x, w] = names[i];
    const last = Math.max(right - w, left);
    const centred = Math.min(Math.max(x - w / 2, left), last);
    const hit = (a) => taken.find(([s, e]) => a < e + NAME_GAP && a + w + NAME_GAP > s);
    let at = centred;
    for (let h; (h = hit(at));) at = h[1] + NAME_GAP;
    if (at > last) {
      at = centred;
      for (let h; (h = hit(at));) at = h[0] - NAME_GAP - w;
      at = Math.max(at, left);
    }
    taken.push([at, at + w]);
    out[i] = at;
  }
  return out;
}

// marks::inside: each name's left edge, or null, in one row along a short
// plot's top: clear of the facts box (the span `facts`), of names already
// placed, of other lines, and of the trace (`clear(a, b)` says whether a
// span is clear of it); a name with no room isn't named (its line's hover
// names it).
function markInside(names, left, right, facts, clear) {
  const { NAME_GAP } = MARKS;
  const placed = [];
  const near = (a, w) => placed.some(([s, e]) => a - 3 < e + NAME_GAP && a + w + 3 + NAME_GAP > s);
  const onFacts = (a, w) => a + w + 3 > facts[0] - 4 && a - 3 < facts[1] + 4;
  const onLine = (a, w, own) => names.some(([x]) => x !== own && x > a - 5 && x < a + w + 5);
  const out = names.map(() => null);
  for (const i of markOrder(names)) {
    const [x, w] = names[i];
    let at = Math.min(Math.max(x - w / 2, left + 4), Math.max(right - 4 - w, left + 4));
    if (onFacts(at, w)) {
      const a = [x + 4, x - w - 4].find((a) => !onFacts(a, w) && !onLine(a, w, x) && a - 3 >= left + 1 && a + w + 3 <= right - 1);
      if (a === undefined) continue;
      at = a;
    }
    if (!clear(at - 3, at + w + 3)) {
      const fits = (a) => a - 3 >= left + 1 && !near(a, w) && a + w + 3 <= right - 1 && !onFacts(a, w) && !onLine(a, w, x) && clear(a - 3, a + w + 3);
      const a = [x - w - 5, x + 5].find(fits);
      if (a === undefined) continue;
      at = a;
    }
    if (near(at, w)) continue;
    placed.push([at - 3, at + w + 3]);
    out[i] = at;
  }
  return out;
}

// marks::stack: names level with lines across a plot, in a column beside
// it: each centred on its line; names that would touch spread evenly about
// their lines' middle, within `top..bottom`. Each name's centre.
function markStack(ys, top, bottom) {
  const { ROW_H } = MARKS;
  const o = ys.map((_, i) => i).sort((a, b) => ys[a] - ys[b]);
  const first = ([s, n]) => {
    const mid = o.slice(s, s + n).reduce((t, i) => t + ys[i], 0) / n;
    return Math.max(Math.min(mid - (n - 1) * ROW_H / 2, bottom - ROW_H / 2 - (n - 1) * ROW_H), top + ROW_H / 2);
  };
  const runs = [];
  for (let k = 0; k < o.length; k++) {
    let run = [k, 1];
    while (runs.length) {
      const above = runs[runs.length - 1];
      if (first(run) < first(above) + above[1] * ROW_H) { runs.pop(); run = [above[0], above[1] + run[1]]; } else break;
    }
    runs.push(run);
  }
  const out = ys.map(() => 0);
  for (const run of runs) {
    const y0 = first(run);
    o.slice(run[0], run[0] + run[1]).forEach((i, j) => { out[i] = y0 + j * ROW_H; });
  }
  return out;
}

// marks::beside_spots: the places a note [w, h] big may take beside a point
// (`dot`, [x, y] screen), in the order they are tried: above right, above
// left, below right, below left, then up a row at a time, right and left,
// to the plot's `top`. Each place as [left, top, right, bottom].
function besideSpots(dot, size, top) {
  const { NOTE_OFF, ROW_H } = MARKS;
  const [w, h] = size;
  const at = (dx, dy) => [dot[0] + dx, dot[1] + dy, dot[0] + dx + w, dot[1] + dy + h];
  const right = NOTE_OFF, left = -NOTE_OFF - w, above = -NOTE_OFF - h, below = NOTE_OFF;
  const spots = [at(right, above), at(left, above), at(right, below), at(left, below)];
  for (let up = above - ROW_H; dot[1] + up >= top; up -= ROW_H) spots.push(at(right, up), at(left, up));
  return spots;
}

// marks::crosses: whether a trace (`pts`, screen) crosses the place `r`:
// any of its segments passes through it, clipped as Liang and Barsky do.
function crosses(r, pts) {
  const [x0, y0, x1, y1] = r;
  const through = (a, b) => {
    const dx = b[0] - a[0], dy = b[1] - a[1];
    let t0 = 0, t1 = 1;
    for (const [p, q] of [[-dx, a[0] - x0], [dx, x1 - a[0]], [-dy, a[1] - y0], [dy, y1 - a[1]]]) {
      if (p === 0) { if (q < 0) return false; } else if (p < 0) t0 = Math.max(t0, q / p); else t1 = Math.min(t1, q / p);
    }
    return t0 <= t1;
  };
  if (!pts.length) return false;
  if (pts.length === 1) return pts[0][0] >= x0 && pts[0][0] <= x1 && pts[0][1] >= y0 && pts[0][1] <= y1;
  return pts.slice(1).some((b, i) => through(pts[i], b));
}

// marks::beside_place: which of `spots` a note takes: the one it took
// before (`was`) while that is still `clear`, else the first that is; null
// where none is.
function besidePlace(spots, clear, was) {
  if (was !== null && was !== undefined && spots[was] && clear(spots[was])) return was;
  const i = spots.findIndex(clear);
  return i < 0 ? null : i;
}

// marks::room_above: the top of a plot's y range (from `lo`, at least
// `top`) that leaves a note's room clear above the trace's highest point
// (at `y`) on a plot `h` px tall.
function roomAbove(lo, y, top, h) {
  const r = MARKS.NOTE_ROOM / Math.max(h, 2 * MARKS.NOTE_ROOM);
  return Math.max(top, (y - lo * r) / (1 - r));
}

// A name's width on screen: the names' type is 11.5 px, a strong one
// semibold.
function markWidth(name, rank) {
  return String(name).length * CHAR_W * MARKS.NAME_SIZE / 11 * (rank === "strong" ? 1.06 : 1);
}
function markText(x, y, name, rank, extra = "") {
  const style = rank === "strong" ? "fill:var(--text);font-weight:600" : "fill:var(--text2)";
  return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" style="${style};font-size:${MARKS.NAME_SIZE}px"${extra}>${esc(name)}</text>`;
}

// marks::lane_above: lines down a plot (its frame from L, T, plotW wide),
// named in a lane of two rows above it, each name joined to its line by a
// short stroke of the line's colour, with an angled leader where it had
// to slide. Each line and its name say its hover.
function laneAbove(lines, sx, L, T, plotW) {
  const { ROW_H, LANE_GAP } = MARKS;
  const seen = lines.filter((l) => sx(l.x) >= L && sx(l.x) <= L + plotW);
  const names = seen.map((l) => [sx(l.x), markWidth(l.name, l.rank), l.rank]);
  const placed = markPlace(names, L + 2, L + plotW - 2, []);
  let strokes = "", boxes = "";
  seen.forEach((l, i) => {
    const [x, w] = names[i], [left, row] = placed[i];
    const off = LANE_GAP + row * ROW_H, top = T - off - ROW_H, centre = left + w / 2;
    const pts = [[centre, T - off - 1]];
    if (Math.abs(centre - x) > 1) pts.push([x, T - LANE_GAP / 2]);
    pts.push([x, T]);
    strokes += `<polyline points="${pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(${l.ink})"${l.opacity ? ` stroke-opacity="${l.opacity}"` : ""} stroke-width="1"/>`;
    boxes += `<g><title>${esc(l.hover)}</title><rect x="${(left - 2).toFixed(1)}" y="${(top - 2).toFixed(1)}" width="${(w + 4).toFixed(1)}" height="${ROW_H + 4}" rx="2" fill="var(--card)"/>${markText(left, top + 11.5, l.name, l.rank)}</g>`;
  });
  return strokes + boxes;
}

// marks::InsideNames: on a short plot, the names inside along its top, on
// boxes of 80% of the plot's colour, clear of the trace (`tops`, screen).
function namesInside(lines, sx, L, T, plotW, tops) {
  const { ROW_H, INSIDE_TOP } = MARKS;
  const seen = lines.filter((l) => sx(l.x) >= L && sx(l.x) <= L + plotW);
  const names = seen.map((l) => [sx(l.x), markWidth(l.name, l.rank), l.rank]);
  const foot = T + INSIDE_TOP + ROW_H;
  const clear = (a, b) => tops.every(([x, y]) => x < a || x > b || y > foot + 1);
  const at = markInside(names, L, L + plotW, [-Infinity, -Infinity], clear);
  let out = "";
  seen.forEach((l, i) => {
    if (at[i] === null) return;
    const a = at[i], w = names[i][1];
    out += `<g><title>${esc(l.hover)}</title><rect x="${(a - 3).toFixed(1)}" y="${T + INSIDE_TOP}" width="${(w + 6).toFixed(1)}" height="${ROW_H}" rx="3" fill="var(--card)" fill-opacity="0.8"/>${markText(a, T + INSIDE_TOP + 11.5, l.name, l.rank)}</g>`;
  });
  return out;
}

// marks::lane_right: lines across a plot, named in a column right of it
// (from `right`, between `top` and `bottom`), as markStack places them:
// each name joined to its line by a short tick of the line's colour, with
// an angled leader where it had to slide.
function laneRight(lines, right, top, bottom) {
  const { ROW_H, TICK, SIDE_GAP } = MARKS;
  const seen = lines.filter((l) => l.y >= top && l.y <= bottom);
  const at = markStack(seen.map((l) => l.y), top - ROW_H / 2, bottom + ROW_H / 2);
  let out = "";
  seen.forEach((l, i) => {
    const pts = [[right, l.y], [right + TICK, l.y], [right + SIDE_GAP - 2, at[i]]];
    out += `<polyline points="${pts.map((p) => p.map((v) => v.toFixed(1)).join(",")).join(" ")}" fill="none" stroke="var(${l.ink})"${l.opacity ? ` stroke-opacity="${l.opacity}"` : ""} stroke-width="1"/>`;
    out += markText(right + SIDE_GAP, at[i] + 4, l.name, l.rank);
  });
  return out;
}
// marks::side_width: the room the names take beside a plot, the tick and
// the widest name, whatever stretch it shows.
function sideWidth(lines) {
  const widest = Math.max(0, ...lines.map((l) => markWidth(l.name, l.rank)));
  return widest > 0 ? MARKS.SIDE_GAP + widest + 4 : 0;
}

// marks::wheel_short: a wheel's short name, for the narrow lane beside a
// map.
function wheelShort(name) {
  return { "centre wheel": "2nd Wheel", "third wheel": "3rd Wheel", "fourth wheel": "4th Wheel", "escape wheel": "Esc Wheel",
    "seconds wheel": "Sec Wheel", "intermediate wheel": "Int Wheel" }[name] || wheelTitle(name);
}

// steady::wheel_lines: the lines to mark on a period axis spanning `span`
// (log10 s): each wheel's turn, and half of it ("×2", where a wheel that is
// off centre shows twice a turn) unless another wheel turns there; with no
// wheel named, the reference periods; with Wheel Periods off, nothing.
// Each line's x, turn ("wheel", "twice" or "reference"), name, short name
// and hover.
function wheelLines(doc, span) {
  if (!showWheels) return [];
  const wheels = (doc.input && doc.input.settings && doc.input.settings.named_wheels) || [];
  const inside = (l) => l.x > span[0] && l.x < span[1];
  if (!wheels.length) {
    return referenceLines(doc).map((r) => ({ x: Math.log10(r.period_s), turn: "reference", name: r.label, short: r.label, hover: (REFERENCE_HOVER || {})[r.label] || r.label })).filter(inside);
  }
  const out = [];
  for (const w of wheels) {
    const title = wheelTitle(w.name), short = wheelShort(w.name);
    out.push({ x: Math.log10(w.period_s), turn: "wheel", name: title, short, hover: `${title}: ${secs(w.period_s)}` });
    const half = w.period_s / 2;
    if (!wheels.some((o) => Math.abs(o.period_s / half - 1) < 0.03)) {
      out.push({ x: Math.log10(half), turn: "twice", name: `${title} ×2`, short: `${short} ×2`, hover: `${title} ×2: ${secs(half)}` });
    }
  }
  return out.filter(inside);
}
// steady::WheelLine::rank and ink: a wheel's name is strong, a ×2's or a
// reference's faint; every line is a call-out, so the call-out grey, and
// its pattern tells a wheel, a ×2 and a reference apart.
function wheelRank(l) { return l.turn === "wheel" ? "strong" : "faint"; }
function wheelInk() { return { ink: "--callout" }; }
// steady::WheelLine::width: a wheel's a full call-out, a ×2 or a reference
// a fainter one.
function wheelWidth(l) { return l.turn === "wheel" ? CALL_OUT_W : FAINT_CALL_OUT_W; }

// steady::wheel_marks: the lines down a period plot, under its trace, all
// call-outs: a wheel's dotted, a ×2's looser, a reference's solid; named
// above the plot by the lane rules.
function wheelMarks(doc, span) {
  return wheelLines(doc, span).map((l) => {
    const { ink } = wheelInk(l);
    const style = l.turn === "wheel" ? { dash: "dense" } : l.turn === "twice" ? { dash: "sparse" } : {};
    return { x: l.x, color: ink, width: wheelWidth(l), ...style, name: l.name, rank: wheelRank(l), ink, hover: l.hover };
  });
}

// periodicity::reference_lines: with no wheel named, 1 min and 1 h, marked
// as periods alone and named after no wheel.
function referenceLines(doc) {
  const lines = (doc.input && doc.input.settings && doc.input.settings.reference_lines) || [];
  return lines.filter((r) => r.period_s > 0);
}

function steadyNote(text) { return `<p class="empty">${esc(text)}</p>`; }

// One series' plot under the chosen view.
function steadyPlot(s, view, doc) {
  const [, color, unit] = SERIES[s.series] || ["", "--text", ""];
  const time = (px) => (lo, hi, w) => linTicks(lo, hi, w, Math.max(Math.min(80, w / 4), px), (v) => v);
  const v = s.views || {};
  switch (view) {
    case "readings": {
      const r = v.readings;
      if (!r || !r.t_s || r.t_s.length < 2) return steadyNote("No readings to draw.");
      const pts = r.t_s.map((t, i) => [t, r.values[i]]).filter(([, y]) => Number.isFinite(y));
      // Each chunk's band, lowest to highest, as the app's bars (#1034).
      const half = (r.chunk_s || r.step_s) / 2;
      const bands = r.banded ? r.t_s.map((t, i) => ({ x0: t - half, x1: t + half, y0: r.lo[i], y1: r.hi[i], color, fill: BOX_OPACITY })) : [];
      const [lo, hi] = r.y_range || [0, 1];
      // Level lines only where the words name the levels (#1112): the
      // detail row says why stretches of one level are not named.
      const segs = s.changes && s.changes.named && s.changes.segments && s.changes.segments.length > 1 ? s.changes.segments : [];
      const ts = s.two_state && s.two_state.two_levels ? s.two_state : null;
      return xyChart({
        title: "Readings", x: [Math.min(...r.t_s), Math.max(...r.t_s)], y: [lo, hi],
        xTicks: (a, b, w) => linTicks(a, b, w, Math.min(80, w / 4), (t) => fmtTime(t), TIME_STEPS),
        yTicks: (a, b, h) => linTicks(a, b, h, 24, (y, st) => stepText(y, st, unit)),
        rects: bands, dots: [{ pts, color, r: 1.4 }], key: { color, text: r.key },
        lines: segs.map((g) => ({ pts: [[g.start_s, g.mean], [g.end_s, g.mean]], color: "--text", width: 1.8 })),
        hlines: ts ? [ts.low, ts.high].map((y) => ({ y, color: "--callout", width: CALL_OUT_W, dash: "loose" })) : [],
      });
    }
    case "periods": {
      const p = v.search;
      if (!p || !p.period_s || !p.period_s.length) return steadyNote("The period search needs a longer session.");
      const raw = p.period_s.map((t, i) => [t > 0 ? Math.log10(t) : NaN, p.score[i]]).filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));
      const span = doc.period_span || [Math.min(...raw.map((q) => q[0])), Math.max(...raw.map((q) => q[0]))];
      if (!(span[1] > span[0])) return steadyNote("The period search needs a longer session.");
      // A score is −log10 of a chance under the search's noise model, so
      // it is drawn as it is, in whole scores (core steady_views::score_ticks).
      const tallest = Math.max(p.threshold, ...raw.map((q) => q[1]));
      const pts = raw;
      const y = [0, tallest * 1.15];
      const marks = [], notes = [];
      if (s.period && s.period.period_s > 0) {
        const x = Math.log10(s.period.period_s);
        // The tallest drawn point within 3.5% of the period: the thinned
        // curve keeps each slice's low point too, which can sit nearest.
        const close = pts.filter((q) => Math.abs(q[0] - x) < 0.015);
        const near = close.length
          ? close.reduce((a, q) => (q[1] > a[1] ? q : a))
          : pts.reduce((a, q) => (Math.abs(q[0] - x) < Math.abs(a[0] - x) ? q : a), pts[0]);
        marks.push({ x, y: near[1], color });
        notes.push({ x, y: near[1], text: secs(s.period.period_s) + (s.period.wheel ? `, ${wheelTitle(s.period.wheel)}` : "") });
      }
      return xyChart({
        title: "Periods", x: span, y,
        xTicks: periodTicks,
        yTicks: (a, b, h) => scoreTicks(a, b, h, 24), yName: SCORE_WORDS && SCORE_WORDS.axis_name, yHover: SCORE_WORDS && SCORE_WORDS.axis_hover,
        vlines: wheelMarks(doc, span), names: showWheels,
        hlines: [{ y: p.threshold, color: "--callout", width: CALL_OUT_W, dash: "loose", name: SCORE_WORDS && SCORE_WORDS.threshold_name, hover: SCORE_WORDS && SCORE_WORDS.threshold_hover }],
        lines: [{ pts, color, width: 1.5 }], marks, beside: notes, noteRoom: true,
      });
    }
    case "cycle": {
      const f = v.fold;
      if (!f || !f.profile || !f.profile.length) return steadyNote("No cycle found to fold these readings at.");
      const bins = f.profile.length, at = (b) => (b + 0.5) / bins * f.period_s;
      // steady.rs: the dots in bands by when their cycle came, first to
      // last, so slow wander shows as a run of colour; the map's ends are
      // left off so both themes keep every dot seen.
      const rows = (f.raster || []).length, bands = Math.min(Math.max(rows, 1), TIME_BANDS);
      const byTime = Array.from({ length: bands }, () => []), dots = [];
      (f.raster || []).forEach((row, r) => row.forEach((y, b) => {
        if (!Number.isFinite(y)) return;
        byTime[Math.floor(r * bands / Math.max(rows, 1))].push([at(b), y]);
        dots.push([at(b), y]);
      }));
      const shape = f.profile.map((y, b) => [at(b), y]);
      const [lo, hi] = f.y_range || [0, 1];
      // Each phase's middle half, over every cycle folded (core's columns).
      const boxW = 0.3 * f.period_s / bins;
      const rects = (f.columns || []).map((q, b) => q && { x0: at(b) - boxW, x1: at(b) + boxW, y0: q[0], y1: q[2], color, opacity: BOX_OPACITY, width: 1.5 }).filter(Boolean);
      const n = f.cycles || rows;
      let label;
      if (f.from === "own") {
        const w = (s.cycle && s.cycle.wheel) || (s.period && s.period.wheel);
        label = `${secs(f.period_s)} cycle${w ? `, ${wheelTitle(w)}` : ""}, ${n} cycles folded`;
      } else if (SERIES[f.from]) {
        label = `Folded at the ${SERIES[f.from][0].toLowerCase()}'s ${secs(f.period_s)} cycle, ${n} cycles`;
      } else {
        label = `Folded at the ${String(f.wheel || "wheel").toLowerCase()}'s ${secs(f.period_s)} turn, ${n} cycles`;
      }
      if (Number.isFinite(f.swing) && Number.isFinite(f.middle_half)) {
        const st = Math.min(Math.abs(f.swing), Math.abs(f.middle_half)) / 10;
        label += `\nThe median line swings ${stepText(f.swing, st, unit)}; the boxes' median height is ${stepText(f.middle_half, st, unit)}`;
      }
      return xyChart({
        title: "Cycle", x: [0, f.period_s], y: [lo, hi],
        xTicks: (a, b, w) => linTicks(a, b, w, Math.min(80, w / 4), (t) => lagText(t), TIME_STEPS),
        yTicks: (a, b, h) => linTicks(a, b, h, 24, (y, st) => stepText(y, st, unit)),
        dots: byTime.map((pts, k) => ({ pts, rgb: `rgb(${timeRgb(bands > 1 ? k / (bands - 1) : 0.5).join(",")})`, r: 1.4 })),
        rects,
        lines: [{ pts: shape, color, width: 2 }],
        corner: { text: label },
      });
    }
    case "autocorrelation": {
      const a = s.autocorrelation;
      if (!a || !a.lag_s) return steadyNote("Too few readings for the autocorrelation.");
      const pts = a.lag_s.map((l, i) => [l, a.r[i]]).filter(([, r]) => Number.isFinite(r));
      const xHi = pts.length ? pts[pts.length - 1][0] : 1;
      const lo = Math.min(-0.2, -a.band, ...pts.map((q) => q[1]));
      const marks = [], notes = [];
      if (Number.isFinite(a.repeat_lag_s) && Number.isFinite(a.repeat_r)) {
        marks.push({ x: a.repeat_lag_s, y: a.repeat_r, color });
        notes.push({ x: a.repeat_lag_s, y: a.repeat_r, text: `repeats at ${secs(a.repeat_lag_s)}` });
      }
      return xyChart({
        title: "Autocorrelation", x: [0, xHi], y: [lo - 0.05, 1.35],
        xTicks: (p, q, w) => linTicks(p, q, w, Math.min(80, w / 4), (t) => lagText(t), TIME_STEPS),
        yTicks: (p, q, h) => linTicks(p, q, h, 24, (y, st) => stepText(y, st)),
        hlines: [{ y: 0, color: "--axis" }, { y: a.band, color: "--callout", width: CALL_OUT_W, dash: "loose" }, { y: -a.band, color: "--callout", width: CALL_OUT_W, dash: "loose" }],
        lines: [{ pts, color, width: 1.5 }], marks, beside: notes,
        corner: Number.isFinite(a.p_value) ? { text: `Ljung–Box p = ${pText(a.p_value)}`, top: true } : null,
      });
    }
    case "spectrum": {
      const sp = spectrumOf(doc, s);
      if (!sp) return steadyNote("The spectrum needs a longer session.");
      // Rate's spectrum is of the beat timing, in ms: drawn, unless Timing
      // asks for that, as the swing it makes in the rate readings, peak to
      // peak in s/d, over the periods those readings can show, as core
      // works it out (reading_swing).
      const swing = !fftTiming && sp.reading_swing && Array.isArray(sp.reading_swing.period_s) ? sp.reading_swing : null;
      const asRate = !!swing;
      const pts = (asRate ? swing.period_s.map((t, i) => [t, swing.swing_s_per_day[i]]) : sp.period_s.map((t, i) => [t, sp.amplitude[i]]))
        .filter(([t, a]) => t > 0 && a > 0 && Number.isFinite(a))
        .map(([t, a]) => [Math.log10(t), Math.log10(a)]);
      if (pts.length < 2) return steadyNote("The spectrum needs a longer session.");
      const x = [Math.min(...pts.map((q) => q[0])), Math.max(...pts.map((q) => q[0]))];
      const yLo = Math.min(...pts.map((q) => q[1])), yHi = Math.max(...pts.map((q) => q[1]));
      // A little room above the tallest line, as in the app; the wheels'
      // names are in the lane above the plot.
      const y = [yLo, yHi + Math.max(yHi - yLo, 0.5) * 0.05];
      const u = asRate ? " s/d" : sp.unit_text;
      // Core size text, shared with the map and checked by the parity fixture.
      const size = (v) => mapNumber(v) + u;
      const peak = pts.reduce((a, q) => (q[1] > a[1] ? q : a), pts[0]);
      return `<p class="note">${esc(spectrumSupportText(sp))}</p>` + xyChart({
        title: "FFT", x, y,
        xTicks: periodTicks,
        yTicks: (p, q) => logTicks(p, q, size),
        vlines: wheelMarks(doc, x), names: showWheels, lines: [{ pts, color, width: 1.5 }],
        marks: [{ x: peak[0], y: peak[1], color }],
        noteRoom: true, beside: [{ x: peak[0], y: peak[1], text: `tallest at ${secs(Math.pow(10, peak[0]))}: ${size(Math.pow(10, peak[1]))}${asRate ? " peak to peak" : ""}` }],
      });
    }
    case "stft":
    case "wavelet": {
      const m = mapOf(doc, s, view === "stft" ? "stft" : "sst");
      if (!m) {
        return steadyNote(view === "stft"
          ? "The STFT Map needs 20 minutes of readings with none missing."
          : "The wavelet map needs a longer stretch of unbroken readings.");
      }
      return mapChart(m, doc, mapsLog);
    }
    case "allan": {
      const a = s.allan;
      if (!a || !a.tau_s) return steadyNote("Too few readings for the Allan deviation.");
      const both = (vals) => a.tau_s.map((t, i) => [t, vals[i]]).filter(([t, d]) => t > 0 && d > 0 && Number.isFinite(d)).map(([t, d]) => [Math.log10(t), Math.log10(d)]);
      const dev = both(a.deviation), white = both(a.white || []);
      const all = dev.concat(white);
      if (!dev.length) return steadyNote("Too few readings for the Allan deviation.");
      const pad = (lo, hi) => { const p = Math.max((hi - lo) * 0.05, 0.05); return [lo - p, hi + p]; };
      const x = pad(Math.min(...all.map((q) => q[0])), Math.max(...all.map((q) => q[0])));
      const y = pad(Math.min(...all.map((q) => q[1])), Math.max(...all.map((q) => q[1])));
      const notes = [];
      if (a.best_tau_s > 0 && a.best_deviation > 0) {
        notes.push({ x: Math.log10(a.best_tau_s), y: Math.log10(a.best_deviation), text: `least scatter at ${secs(a.best_tau_s)}: ${sig(a.best_deviation)}${unit}` });
      }
      return xyChart({
        title: "Allan Deviation", x, y,
        xTicks: periodTicks,
        yTicks: (p, q) => logTicks(p, q, (d) => sig(d) + unit),
        lines: [{ pts: white, color: "--callout", width: CALL_OUT_W, dash: "loose" }, { pts: dev, color, width: 1.5 }],
        dots: [{ pts: dev, color, r: 2 }], notes,
      });
    }
    case "cusum": {
      const c = s.cusum;
      if (!c || !c.t_s) return steadyNote("Too few readings for the CUSUM.");
      const pts = c.t_s.map((t, i) => [t, c.s[i]]).filter(([, y]) => Number.isFinite(y));
      const m = Math.max(1.6, ...pts.map((q) => Math.abs(q[1]))) * 1.1;
      const marks = [], notes = [];
      if (c.shift && pts.length) {
        marks.push({ x: c.at_s, y: c.at, color });
        notes.push({ x: c.at_s, y: c.at, text: `level changes near ${fmtTime(c.at_s)}`, above: c.at >= 0 });
      }
      return xyChart({
        title: "CUSUM", x: [Math.min(...pts.map((q) => q[0])), Math.max(...pts.map((q) => q[0]))], y: [-m, m],
        xTicks: (p, q, w) => linTicks(p, q, w, Math.min(80, w / 4), (t) => fmtTime(t), TIME_STEPS),
        yTicks: (p, q, h) => linTicks(p, q, h, 24, (y, st) => stepText(y, st)),
        hlines: [{ y: 0, color: "--axis" }, { y: c.band, color: "--callout", width: CALL_OUT_W, dash: "loose" }, { y: -c.band, color: "--callout", width: CALL_OUT_W, dash: "loose" }],
        lines: [{ pts, color, width: 1.5 }], marks, notes,
      });
    }
  }
  return "";
}

function steadinessCard(doc) {
  const series = doc.series || [];
  if (!series.length) return "";
  const has = { readings: (s) => s.views && s.views.readings, periods: (s) => s.views && s.views.search, cycle: (s) => s.views && s.views.fold, spectrum: (s) => spectrumOf(doc, s), stft: () => !!doc.time_frequency, wavelet: () => !!doc.time_frequency };
  const offered = STEADY_VIEWS.filter(([key]) => !has[key] || series.some(has[key]));
  if (!offered.some(([k]) => k === steadyView)) switchView(offered[0][0]);
  // A series too short for the tests has no autocorrelation: no plot.
  const tested = (s) => !!s.autocorrelation;
  const drawn = series.some(tested);
  const [, , hint] = STEADY_VIEWS.find(([k]) => k === steadyView);
  const status = Number.isFinite(doc.duration_s) ? `Tested over ${fmtTime(doc.duration_s)} of beats` : "";
  // Each plot's title line: the series and its finding in a few words
  // (core's `summary`), the whole of it on hover.
  const name = (s) => (SERIES[s.series] || [s.series])[0];
  const titleLine = (s) => {
    const sum = s.screen_summary;
    const t = sum ? `${name(s)} · ${sum}` : name(s);
    return `<p class="series-name" title="${esc(t)}">${esc(name(s))}${sum ? `<span class="summary"> · ${esc(sum)}</span>` : ""}</p>`;
  };
  // The Info panel, as the app's: the view's description, then each
  // series' full headline and statistics, and how long was tested.
  const info = showInfo || !drawn
    ? `<div class="info">${drawn ? `<p class="hint">${esc(hint)}</p>` : ""}${series.map((s) => `<p class="series-name">${esc(name(s))}</p>
      <p class="headline">${esc(s.screen_headline || "")}</p>
      <p class="stats">${esc(s.screen_stats || "")}</p>`).join("")}<p class="sub off">${esc(status)}</p></div>`
    : "";
  // A series' own caveats, in the server's (core's) words, under its title.
  const caveats = (s) => s.limits && s.limits.length
    ? s.limits.map((t) => `<p class="series-caveat">${esc(t)}</p>`).join("") : "";
  const plots = drawn ? series.map((s) => `${titleLine(s)}${caveats(s)}${tested(s) ? steadyPlot(s, steadyView, doc) : `<p class="headline">${esc(s.screen_headline || "")}</p>`}`).join("") : "";
  return `<div class="card"><h2>Steadiness</h2><p class="hint">How the rate, amplitude and beat error each move over the session: what was detected in each (a cycle, two levels, level changes, a trend, or none), with the statistics behind it</p>
    ${drawn ? `<div class="seg" role="group" aria-label="View">${offered.map(([key, label]) => `<button data-steady="${key}" aria-pressed="${key === steadyView}">${esc(label)}</button>`).join("")}</div>
    <div class="seg" role="group" aria-label="Switches">${steadySwitch()}<button data-switch="info" aria-pressed="${showInfo}" title="${esc(INFO_HINT)}">Info</button></div>` : ""}${info}${plots}</div>`;
}

// The current view's switches, as in the app's toolbar: Timing for the
// FFT, Log Scale for the maps, and Wheel Periods on those and on Periods.
function steadySwitch() {
  // Each with the app's hover hint.
  // Periods has no scale switch: its score is already the log of a chance.
  const sw = steadyView === "spectrum"
    ? ["timing", "Timing", fftTiming, "Draw rate as the beat timing's spectrum, in ms, at every period, rather than the swing it makes in 10 s rate readings, in s/d"]
    : steadyView === "stft" || steadyView === "wavelet"
      ? ["mapslog", "Log Scale", mapsLog, "Colour the sizes on a log scale, over a range of 300 to 1, so weak lines beside strong ones still show"]
      : null;
  if (!sw && steadyView !== "periods") return "";
  const wheels = ["wheels", "Wheel Periods", showWheels, WHEELS_HINT];
  // Each a switch of its own, side by side.
  return [sw, wheels].filter(Boolean).map((b) => `<button data-switch="${b[0]}" aria-pressed="${b[2]}" title="${esc(b[3])}">${b[1]}</button>`).join("");
}

// The app's Info button hint.
const INFO_HINT = "Info: what this view shows, and each reading's findings and statistics, in full.";

// steady::WHEELS_HINT.
const WHEELS_HINT = "Mark the period each of the calibre's wheels turns in, in a grey dotted line named above the plot, and half of it more loosely dotted, where a wheel that is off centre shows twice a turn. With no calibre picked, or none of its wheels known, one minute and one hour are marked in grey instead: periods alone, named after no wheel.";

function wireSteadiness(root) {
  for (const b of root.querySelectorAll("button[data-steady]")) {
    b.addEventListener("click", () => { switchView(b.dataset.steady); redraw(); });
  }
  for (const b of root.querySelectorAll("button[data-switch]")) {
    b.addEventListener("click", () => {
      if (b.dataset.switch === "mapslog") mapsLog = !mapsLog;
      else if (b.dataset.switch === "wheels") showWheels = !showWheels;
      else if (b.dataset.switch === "info") showInfo = !showInfo;
      else fftTiming = !fftTiming;
      redraw();
    });
  }
}

// ---- The STFT and Wavelet Maps (the app's tfmap.rs) -----------------------
//
// A series' size at each period (up, log, longest at the top) and time
// (across), in viridis, on the colour scale the document gives each map
// (core timefreq::Scale, the app's). A cell nothing was read for is left
// empty: the card shows through.

// Core palette::VIRIDIS, put in by the server.
const VIRIDIS = /*VIRIDIS*/null;
// The maps drawn this time, painted once the page is in place.
const mapPaints = [];

// Core palette::time_colour (Hugh's M3: viridis lifted into each theme)
// read at evenly spaced points for each theme, put in by the server.
const TIME_MAP = /*TIME_MAP*/null;

// A colour table at t, 0 to 1, between its points.
function tableRgb(table, t) {
  const x = Math.min(Math.max(t, 0), 1) * (table.length - 1);
  const i = Math.min(Math.floor(x), table.length - 2), f = x - i;
  const a = table[i], b = table[i + 1];
  return [0, 1, 2].map((k) => Math.round(a[k] + (b[k] - a[k]) * f));
}
// palette::viridis: the maps' sizes.
function viridisRgb(t) { return tableRgb(VIRIDIS, t); }
// palette::time_colour: a time, in the page's theme (the Isochronism walk,
// its key and the Cycle view's dots).
function timeRgb(t) {
  return tableRgb(TIME_MAP[document.documentElement.dataset.theme === "dark" ? "dark" : "light"], t);
}
// A colour key's ramp: a map from 0 to 1 as gradient stops.
function rampStops(map) {
  return Array.from({ length: 9 }, (_, i) => `rgb(${map(i / 8).join(",")}) ${i * 12.5}%`).join(", ");
}
// timefreq::Scale::at: where size x falls, 0 to 1.
function scaleAt(sc, x) {
  const t = sc.log
    ? (Math.log(Math.max(x, sc.lo)) - Math.log(sc.lo)) / (Math.log(sc.hi) - Math.log(sc.lo))
    : (x - sc.lo) / (sc.hi - sc.lo);
  return Math.min(Math.max(t, 0), 1);
}
// The map's scale as the document gives it; null when nothing was read.
function mapScale(m, log) {
  const sc = m.scale && m.scale[log ? "log" : "linear"];
  return sc && sc.hi > 0 ? { lo: sc.lo, hi: sc.hi, log } : null;
}
function mapOf(doc, s, method) {
  return (doc.time_frequency || []).find((m) => m.series === s.series && m.method === method && m.period_s && m.period_s.length && m.t_s && m.t_s.length) || null;
}
// tfmap::slots: one column per step of time from the first column's.
function mapSlots(m) {
  const t = m.t_s;
  let dt = m.hop_s;
  if (!(dt > 0)) {
    const d = t.slice(1).map((v, i) => v - t[i]).filter((v) => v > 0);
    dt = d.length ? Math.min(...d) : 1;
  }
  return [t[0], dt, Math.round((t[t.length - 1] - t[0]) / dt) + 1];
}
// A size on the map's scale, bare: "0.12", "3.1".
function mapNumber(v) {
  const tiny = Number.isFinite(v) && v !== 0 && Math.abs(v) < 0.001;
  const d = v >= 10 ? 0 : v >= 1 ? 1 : v >= 0.1 ? 2 : tiny ? 1 - Math.floor(Math.log10(Math.abs(v))) : 3;
  if (d <= 100) return v.toFixed(d);
  // toFixed accepts at most 100 decimals; expand the same two significant
  // figures for smaller finite values, including subnormals.
  const [coefficient, exponent] = Math.abs(v).toExponential(1).split("e");
  const digits = coefficient.replace(".", "");
  const fraction = ("0".repeat(-Number(exponent) - 1) + digits).padEnd(d, "0");
  return (v < 0 ? "-0." : "0.") + fraction;
}
// tfmap::size_text: "0.12 ms", "3.1°", the unit as core writes it.
function mapSize(m, v) {
  return mapNumber(v) + m.unit_text;
}
// The key's title, the unit in it, as the app's: one colour scale carries
// one unit, so its numbers go bare. The rate map holds timing swing.
function mapKeyTitle(m) {
  const name = { rate: "Timing Swing", amplitude: "Amplitude Swing", beat_error: "Beat Error Swing" }[m.series] || "Swing";
  return `${name} (${m.unit_text.trim()})`;
}

function mapChart(m, doc, log) {
  const sc = mapScale(m, log);
  if (!sc) return steadyNote("Nothing in this stretch could be read for the map.");
  const [t0, dt, w] = mapSlots(m);
  const p = m.period_s, h = p.length;
  const half = h < 2 ? 0.05 : Math.abs(Math.log10(p[0]) - Math.log10(p[h - 1])) / (h - 1) / 2;
  const top = Math.log10(p[0]) + half, bottom = Math.log10(p[h - 1]) - half;
  const left = t0 - dt / 2, width = dt * w;
  const x0 = Math.min(0, left), x1 = Math.max(doc.duration_s || 0, left + width);
  // T leaves room for a name level with a line at the map's top.
  const W = chartWidth(), H = 170, T = 8, B = 20, R = 6, plotH = H - T - B;
  const yt = periodTicks(bottom, top, plotH);
  const L = Math.max(54, Math.ceil(10 + CHAR_W * Math.max(3, ...yt.map(([, t]) => t.length))));
  // tfmap: the wheels' lines, named by their short names in a narrow lane
  // right of the map, whose room is kept whatever stretch it shows; a
  // wheel's ×2 isn't marked on a map.
  const lines = wheelLines(doc, [bottom, top]).filter((l) => l.turn !== "twice")
    .map((l) => ({ ...l, ...wheelInk(l), name: l.short, rank: wheelRank(l) }));
  const side = sideWidth(lines);
  const plotW = W - L - (side || R);
  const xt = linTicks(x0, x1, plotW, Math.min(80, plotW / 4), (t) => fmtTime(t), TIME_STEPS);
  const sx = (x) => L + (x - x0) / (x1 - x0) * plotW;
  const sy = (y) => T + (top - y) / (top - bottom) * plotH;
  const area = plotArea(L, T, plotW, plotH);
  // The map fills the plot, so no grid is drawn and its axes go over it,
  // below (strength::Grid::draw_axes).
  let g = area.svg;
  for (const [v, t] of yt) {
    if (t) g += `<text x="${L - 5}" y="${sy(v) + 4}" text-anchor="end">${esc(t)}</text>`;
  }
  for (const [v, t] of xt) {
    const anchor = sx(v) - t.length * CHAR_W / 2 < L - 8 ? "start" : sx(v) + t.length * CHAR_W / 2 > W ? "end" : "middle";
    g += `<text x="${sx(v)}" y="${H - 5}" text-anchor="${anchor}">${esc(t)}</text>`;
  }
  // tfmap::wheel_rows: the wheels' turns across the map, dotted; their
  // names are in the lane beside it, so nothing else is drawn over the
  // colour.
  // The map fills the plot, so its axes are drawn over it.
  let over = `<path class="axis" fill="none" d="M${L} ${T}V${T + plotH}H${L + plotW}"/>`;
  for (const l of lines) {
    over += `<line x1="${L}" x2="${L + plotW}" y1="${sy(l.x)}" y2="${sy(l.x)}" stroke="var(${l.ink})" stroke-width="${wheelWidth(l)}" stroke-dasharray="${DASH.dense}" stroke-linecap="round"/>`;
  }
  over += laneRight(lines.map((l) => ({ ...l, y: sy(l.x) })), L + plotW, T, T + plotH);
  const k = mapPaints.length;
  const box = { left: sx(left), top: sy(top), width: sx(left + width) - sx(left), height: sy(bottom) - sy(top) };
  mapPaints.push({ m, sc, t0, dt, w });
  const keyHint = "The colour gives the size at each period and time; the brightest also stands for every size above it. Empty cells weren't read: a gap, a window with a reading missing, or the edges of a stretch, which the wavelet map can't reach.";
  return `<div class="chart" style="width:${W}px;height:${H}px">
    <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${m.method === "stft" ? "STFT Map" : "Wavelet Map"}">${g}</svg>
    <canvas class="map" data-map="${k}" width="${w}" height="${h}" style="left:${box.left}px;top:${box.top}px;width:${box.width}px;height:${box.height}px"></canvas>
    <svg class="map-layer" style="left:0;top:0" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">${over}</svg>
  </div>
  <div class="map-key" title="${esc(keyHint)}"><span>${esc(mapKeyTitle(m))}</span><span>${esc(mapNumber(sc.lo))}</span><span class="ramp" style="background:linear-gradient(to right, ${rampStops(viridisRgb)})"></span><span>${esc(mapNumber(sc.hi))} and above</span><span class="unread"></span><span>not read</span>${sc.log ? "<span>· log scale</span>" : ""}</div>
  <p class="sub caption" data-map-read="${k}">Point at the map to read a cell.</p>`;
}

// The cells of map `p`, as RGBA, a pixel a cell, the longest period on the
// top row; a cell not read is clear.
function mapPixels(p) {
  const { m, sc, t0, dt, w } = p, h = m.period_s.length;
  const px = new Uint8ClampedArray(w * h * 4);
  m.t_s.forEach((t, j) => {
    const x = Math.round((t - t0) / dt);
    if (x < 0 || x >= w) return;
    (m.values[j] || []).forEach((v, y) => {
      if (y >= h || typeof v !== "number" || !Number.isFinite(v)) return;
      const c = viridisRgb(scaleAt(sc, v)), o = (y * w + x) * 4;
      px[o] = c[0]; px[o + 1] = c[1]; px[o + 2] = c[2]; px[o + 3] = 255;
    });
  });
  return px;
}

// tfmap::cell: the column nearest `t` within half a step, and row `y`.
function mapCell(p, t, y) {
  const { m, dt } = p;
  let j = 0;
  m.t_s.forEach((v, i) => { if (Math.abs(v - t) < Math.abs(m.t_s[j] - t)) j = i; });
  if (Math.abs(m.t_s[j] - t) > dt / 2 + 1e-9 || y < 0 || y >= m.period_s.length) return null;
  const v = (m.values[j] || [])[y];
  return { t: m.t_s[j], period: m.period_s[y], v: typeof v === "number" && Number.isFinite(v) ? v : null };
}

function paintMaps(root) {
  for (const c of root.querySelectorAll("canvas[data-map]")) {
    const p = mapPaints[+c.dataset.map];
    if (!p || !c.getContext) continue;
    const ctx = c.getContext("2d");
    if (!ctx) continue;
    ctx.putImageData(new ImageData(mapPixels(p), c.width, c.height), 0, 0);
    const read = root.querySelector(`[data-map-read="${c.dataset.map}"]`);
    c.addEventListener("mousemove", (e) => {
      const r = c.getBoundingClientRect();
      const x = Math.floor((e.clientX - r.left) / r.width * p.w);
      const y = Math.floor((e.clientY - r.top) / r.height * c.height);
      const cell = mapCell(p, p.t0 + x * p.dt, y);
      if (read && cell) read.textContent = `${fmtTime(cell.t)}, period ${secs(cell.period)}: ${cell.v === null ? "not read" : mapSize(p.m, cell.v)}`;
    });
  }
}

// ---- Distributions on probability paper (the app's Distribution panes) ----

// The app's probability marks, lowest first, each [label, z] with z from
// core histogram::normal_quantile. The server fills the list in.
const PROBABILITY_MARKS = /*PROBABILITY_MARKS*/null;
const DISTRIBUTIONS = {
  rate: ["Rate Distribution", "--rate", " s/d",
    "The rate readings on probability paper: one steady rate falls on a straight line, two states bend it"],
  amplitude: ["Amplitude Distribution", "--amplitude", "°",
    "The amplitude readings on probability paper: a balance swinging between a high and a low state bends the line"],
  beat_error: ["Beat Error Distribution", "--beat-error", " ms",
    "The beat error readings, from the unlock, on probability paper"],
};

// A distribution as the app draws it: each value against the normal score of
// its rank, (rank + ½) / n (the document's points), with the dashed line one
// steady state would follow.
function probabilityChart(e, color, unit) {
  const W = chartWidth(), H = 190, T = 4, B = 20, R = 6;
  const n = e.n, x0 = e.edges[0], x1 = e.edges[e.edges.length - 1];
  if (!(n >= 2) || !(x1 > x0)) return `<p class="empty">Not enough readings yet.</p>`;
  // Core keeps the highest point, at the normal score of (n − ½) / n.
  const pts = e.points || [], zLast = pts.length ? pts[pts.length - 1][1] : NaN;
  const zTop = Math.min(Number.isFinite(zLast) ? zLast : 3.3, 3.3) + 0.25;
  const plotH = H - T - B;
  // From 50% outwards, leaving out a share whose label would crowd the one before it.
  const pxPerZ = plotH / (2 * zTop);
  const kept = [];
  for (const [label, z] of PROBABILITY_MARKS.slice(5)) {
    if (z <= zTop && (!kept.length || (z - kept[kept.length - 1][0]) * pxPerZ >= 16)) kept.push([z, label]);
  }
  const ylab = [];
  for (const [z, label] of kept) {
    ylab.push([z, label]);
    if (z !== 0) ylab.push([-z, PROBABILITY_MARKS[10 - PROBABILITY_MARKS.findIndex(([l]) => l === label)][0]]);
  }
  const L = Math.max(44, Math.ceil(10 + CHAR_W * Math.max(3, ...ylab.map(([, t]) => t.length))));
  const plotW = W - L - R;
  // Room between the value labels, which carry the unit.
  const wide = Math.max(...[x0, x1].map((v) => axisLabel(v, (x1 - x0) / 20, unit).length));
  const xg = gridFor(x0, x1, plotW, Math.max(Math.min(80, plotW / 4), wide * CHAR_W + 14));
  const sx = (x) => L + (x - x0) / (x1 - x0) * plotW;
  const sy = (z) => T + (zTop - z) / (2 * zTop) * plotH;
  const area = plotArea(L, T, plotW, plotH);
  let g = area.svg, inside = "";
  for (const [z, t] of ylab) {
    inside += `${gridAcross(sy(z), L, plotW, T + plotH)}`;
    g += `<text x="${L - 5}" y="${sy(z) + 4}" text-anchor="end">${esc(t)}</text>`;
  }
  for (const v of xg.ticks) {
    inside += `${gridDown(sx(v), L, T, plotH)}`;
    const t = axisLabel(v, xg.step, unit);
    const anchor = sx(v) - t.length * CHAR_W / 2 < L - 8 ? "start" : sx(v) + t.length * CHAR_W / 2 > W ? "end" : "middle";
    g += `<text x="${sx(v)}" y="${H - 5}" text-anchor="${anchor}">${esc(t)}</text>`;
  }
  const line = e.normal_line;
  if (line && Number.isFinite(line.centre) && Number.isFinite(line.spread)) {
    inside += `<line x1="${sx(line.centre - line.spread * zTop)}" y1="${sy(-zTop)}" x2="${sx(line.centre + line.spread * zTop)}" y2="${sy(zTop)}" stroke="var(--callout)" stroke-width="${CALL_OUT_W}" stroke-dasharray="${DASH.loose}"/>`;
  }
  let dots = "";
  for (const [x, z] of pts) {
    if (x < x0 || x > x1 || !Number.isFinite(z)) continue;
    dots += `<circle cx="${sx(x).toFixed(1)}" cy="${sy(z).toFixed(1)}" r="1.6"/>`;
  }
  inside += `<g fill="var(${color})">${dots}</g>`;
  g += `<g clip-path="url(#${area.id})">${inside}</g>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(e.series)} on probability paper">${g}</svg></div>`;
}

// The three Distribution panes, from the readings (the app's default).
function distributionCards(d) {
  const all = (d && d.overall) || [];
  return ["rate", "amplitude", "beat_error"].map((key) => {
    const e = all.find((x) => x.series === key && x.values === "readings");
    if (!e) return "";
    const [title, color, unit, hint] = DISTRIBUTIONS[key];
    return `<div class="card"><h2>${title}</h2><p class="hint">${hint}</p>
      <p class="sub caption">${esc(e.screen_summary || "")}</p>${probabilityChart(e, color, unit)}</div>`;
  }).join("");
}

// ---- The Isochronism card (#741) -----------------------------------------
//
// The rate against the amplitude as the take runs, one dot per stretch of
// time coloured by when on core's time colour map, joined in time order
// where core says they are next to each other (Hugh's look C).
// The server sends core steady_views::walk_view: the points core merged,
// each with its hover, the hour beads, the axes' round ends and the
// curve's headline in lines; nothing is merged or worded here.

// Core steady_views' walk words, put in by the server.
const WALK_WORDS = /*WALK_WORDS*/null;

// The walk's plot: as tall as it is wide, within these bounds (Hugh's F2).
const WALK_PLOT = { MIN: 280, MAX: 420 };

// An axis' ticks from the server's (core walk_axes) round ends and step,
// bare numbers with a true minus (Hugh's F1).
function walkTicks([lo, hi, step]) {
  const out = [];
  for (let k = Math.round(lo / step); k * step <= hi + step * 1e-9; k++) {
    out.push([+(k * step).toFixed(10), axisLabel(k * step, step)]);
  }
  return out;
}

// Where a bead's name goes: square to the trail at dot `i`, on the side
// with more room from the other dots, `off` px out, and how it is
// anchored there (the app's isochronism::bead_side).
function beadSide(P, i, off) {
  const a = P[Math.max(i - 1, 0)], b = P[Math.min(i + 1, P.length - 1)];
  let [nx, ny] = [-(b[1] - a[1]), b[0] - a[0]];
  const len = Math.hypot(nx, ny);
  [nx, ny] = len > 0 ? [nx / len, ny / len] : [0, -1];
  const room = (sgn) => Math.min(...P.map(([x, y]) => Math.hypot(x - (P[i][0] + 16 * sgn * nx), y - (P[i][1] + 16 * sgn * ny))));
  if (room(-1) > room(1)) [nx, ny] = [-nx, -ny];
  const anchor = nx > 0.5 ? "start" : nx < -0.5 ? "end" : "middle";
  const dy = ny > 0.5 ? 9 : ny < -0.5 ? 0 : 4;
  return { x: P[i][0] + off * nx, y: P[i][1] + off * ny + dy, anchor };
}

// The walk as Hugh's look C draws it (Peter, 11-05): a 2 px trail through
// the dots in time order, each step shading from its first dot's colour to
// its last's and lifted wherever core says a dot is not joined; the dots
// over it; a ring at each of core's hour beads; a ring at the start and a
// large dot at the end; then their names.
function walkMarks(w, sx, sy) {
  const dots = w.dots, rgb = (t) => `rgb(${timeRgb(t).join(",")})`;
  const P = dots.map((d) => [sx(d.amplitude_deg), sy(d.rate_s_per_day)]);
  const id = "walk" + (++clipCount), f = (v) => v.toFixed(1);
  let defs = `<filter id="${id}plate" x="-0.06" y="-0.1" width="1.12" height="1.2"><feFlood style="flood-color:var(--card);flood-opacity:0.85"/><feComposite in="SourceGraphic"/></filter>`;
  let trail = "", marks = "", names = "";
  dots.forEach((d, i) => {
    if (!i || !d.joined) return;
    const [a, b] = [P[i - 1], P[i]];
    defs += `<linearGradient id="${id}s${i}" gradientUnits="userSpaceOnUse" x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}"><stop offset="0" stop-color="${rgb(dots[i - 1].when)}"/><stop offset="1" stop-color="${rgb(d.when)}"/></linearGradient>`;
    trail += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" stroke="url(#${id}s${i})" stroke-width="2" stroke-linecap="round"/>`;
  });
  // Each dot says its own hover, over a target wider than the dot.
  dots.forEach((d, i) => {
    marks += `<g><title>${esc(d.hover)}</title><circle cx="${f(P[i][0])}" cy="${f(P[i][1])}" r="6" fill="transparent"/><circle cx="${f(P[i][0])}" cy="${f(P[i][1])}" r="2.5" fill="${rgb(d.when)}"/></g>`;
  });
  const ring = (i, r) => `<circle cx="${f(P[i][0])}" cy="${f(P[i][1])}" r="${r}" fill="var(--card)" stroke="${rgb(dots[i].when)}" stroke-width="2.5" pointer-events="none"/>`;
  // Each name on a plate of the card's colour at 85%, a little past the
  // text, as the app's (#1155), so a trail behind it never runs through it.
  const name = (x, y, anchor, text) => `<text x="${f(x)}" y="${f(y)}" text-anchor="${anchor}" filter="url(#${id}plate)" style="fill:var(--text);font-size:12px">${esc(text)}</text>`;
  for (const b of w.beads || []) {
    marks += ring(b.dot, 5);
    const at = beadSide(P, b.dot, 11);
    names += name(at.x, at.y, at.anchor, b.text);
  }
  const last = P.length - 1;
  marks += ring(0, 7);
  marks += `<circle cx="${f(P[last][0])}" cy="${f(P[last][1])}" r="6.5" fill="${rgb(dots[last].when)}" stroke="var(--card)" stroke-width="2" pointer-events="none"/>`;
  names += name(P[0][0] - 10, P[0][1] - 10, "end", WALK_WORDS.start);
  // The end's hour off the trail, as the beads' are, past its larger dot
  // (the app's: 14 px on the roomier side).
  const end = beadSide(P, last, 14);
  names += name(end.x, end.y, end.anchor, w.last_text);
  return `<defs>${defs}</defs><g>${trail}</g>${marks}${names}`;
}

function walkCard(w) {
  if (!w || !w.dots || !w.dots.length) return "";
  const W = WALK_WORDS, [amp, rate] = w.axes;
  // Square, within bounds, at the card's width less the rate axis.
  const side = Math.max(WALK_PLOT.MIN, Math.min(chartWidth() - 70, WALK_PLOT.MAX));
  const chart = xyChart({
    title: W.title, x: [amp[0], amp[1]], y: [rate[0], rate[1]], height: side + 38,
    xName: `${W.amp_name} ${W.amp_unit}`, yName: `${W.rate_name}\n${W.rate_unit}`,
    xTicks: () => walkTicks(amp), yTicks: () => walkTicks(rate),
    hlines: [{ y: 0, color: "--axis" }],
    over: (sx, sy) => walkMarks(w, sx, sy),
  });
  // The curve's headline, one fact a line, in core's words (Hugh's F4).
  const facts = (w.summary || []).map((t) => `<p>${esc(t)}</p>`).join("");
  return `<div class="card"><h2>${esc(W.title)}</h2>${facts ? `<div class="facts">${facts}</div>` : ""}<p class="hint">${esc(W.hint)}</p>${chart}
    <div class="map-key"><span>${esc(W.key_start)}</span><span class="ramp" style="background:linear-gradient(to right, ${rampStops(timeRgb)})"></span><span>${esc(w.last_text)}</span><span>${esc(W.since)}</span></div></div>`;
}

function seriesView(doc, extra, limits, seriesLimits) {
  // The server sends what only the charts draw beside the document, and
  // each series' caveats in core's words.
  if (extra || seriesLimits) doc = JSON.parse(JSON.stringify(doc));
  (doc.series || []).forEach((s, i) => { if (seriesLimits && seriesLimits[i]) s.limits = seriesLimits[i]; });
  if (extra) {
    (doc.series || []).forEach((s, i) => { if (extra.views && extra.views[i]) s.views = extra.views[i]; });
    if (extra.period_span) doc.period_span = extra.period_span;
    if (extra.spectra) doc.spectra = extra.spectra;
    if (extra.maps) doc.time_frequency = extra.maps;
    if (extra.walk) doc.walk_view = extra.walk;
    const all = (doc.distributions && doc.distributions.overall) || [];
    all.forEach((e, i) => { if (extra.points && extra.points[i]) e.points = extra.points[i]; });
  }
  const name = fileName(doc);
  const len = Number.isFinite(doc.duration_s) ? ` · ${timeLabel(doc.duration_s)}` : "";
  return `<h1>Long Recording</h1><p class="sub">${esc(name)}${len}</p>${steadinessCard(doc)}${walkCard(doc.walk_view)}${limits && limits.length ? limitsCard(limits) : ""}${distributionCards(doc.distributions)}`;
}

// ---- Live: a take as it is heard ------------------------------------------
//
// While record_position records, the view asks the server for the latest
// readings (recording_status, a tool for the view alone) about once a
// second, from when the chat app says the call has started (tool-input)
// until its result arrives. A chat app that does not pass the view's calls
// on leaves the progress messages in the chat to say how far it has got.

function positionName(p) { return ((POSITIONS || {})[p] || [p, p || ""])[1]; }

let live = null;

function toolInput(args) {
  // Only a recording has a live view; the other tools draw their result.
  if (typeof args.position !== "string" || typeof args.folder !== "string") return;
  if (live && live.timer) clearTimeout(live.timer);
  live = { position: args.position, seconds: Number.isFinite(args.seconds) ? args.seconds : 120, doc: null, failures: 0, seen: false };
  last = null;
  redraw();
  pollLive();
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))]);
}

function pollLive() {
  const mine = live;
  if (!mine) return;
  mine.timer = null;
  withTimeout(request("tools/call", { name: "recording_status", arguments: {} }), 5000).then((r) => {
    if (live !== mine || last) return;
    const d = r && r.structuredContent;
    mine.failures = 0;
    if (d && d.recording) {
      if (d.schema && d.recorded_s != null) {
        mine.doc = d;
        mine.pm = r._meta && r._meta["timegrapher/pm"];
        mine.limits = r._meta && r._meta["timegrapher/limits"];
      }
      mine.seen = true;
    }
    redraw();
    // Until the take has ended; before it starts, the call may still be on its way.
    if (!(d && d.recording === false && mine.seen)) mine.timer = setTimeout(pollLive, 1000);
  }).catch(() => {
    if (live !== mine || last) return;
    if (++mine.failures < 3) mine.timer = setTimeout(pollLive, 2000);
    else { mine.unavailable = true; redraw(); }
  });
}

// The trend a live file carries, as the charts over time take it.
function trendStrip(t) {
  if (!t || !t.t_s) return null;
  const pts = (ys) => (ys || []).map((y, i) => [t.t_s[i], y == null ? NaN : y]).filter(([, y]) => Number.isFinite(y));
  // The beat error as a size, as the take's check gives it: the live and
  // the whole-take measures do not agree on its sign.
  const sourced = (source) => {
    const values = (t.beat_error || []).map((y, i) => [t.t_s[i],
      ((t.beat_error_source || [])[i] ?? null) === source && Number.isFinite(y) ? Math.abs(y) : NaN]);
    return values.some(([, y]) => Number.isFinite(y)) ? values : [];
  };
  return { rate: pts(t.rate), amplitude: pts(t.amplitude),
    beat_error_unlock: sourced("unlock"), beat_error_drop: sourced("drop"), beat_error_unknown: sourced(null) };
}

// strip::wrap: fold into [-half, half).
function wrapMs(x, half) { return ((x + half) % (2 * half) + 2 * half) % (2 * half) - half; }

// The app's paper strip lying on its side (strip.rs, horizontal): time left
// to right with the newest beats on the right, early beats towards the top,
// one dot per beat, Tick blue and Tock orange, ±10 ms wide and wrapping as
// on a Witschi diagram. A watch on time draws a level line; one that gains
// rises to the right.
function liveStrip(d) {
  const s = (d && d.strip) || {};
  const beats = s.beats || [];
  const span = s.span_s || 30, half = 10;
  const end = Math.max((d && d.recorded_s) || 0, span), start = end - span;
  const W = chartWidth(), H = 170, T = 4, B = 20, R = 6, L = 50;
  const plotW = W - L - R, plotH = H - T - B;
  const sx = (t) => L + (t - start) / span * plotW;
  const sy = (ms) => T + (half - ms) / (2 * half) * plotH;
  const area = plotArea(L, T, plotW, plotH);
  let g = area.svg, inside = "";
  const yg = gridFor(-half, half, plotH, 26);
  for (const v of yg.ticks) {
    if (v > -half && v < half) inside += `${gridAcross(sy(v), L, plotW, T + plotH)}`;
    // The ends are left for "Early" and "Late".
    if (Math.min(sy(v) - T, T + plotH - sy(v)) > 14) g += `<text x="${L - 5}" y="${sy(v) + 4}" text-anchor="end">${esc(axisLabel(v, yg.step, " ms"))}</text>`;
  }
  g += `<text x="${L - 5}" y="${T + 10}" text-anchor="end">Early</text><text x="${L - 5}" y="${T + plotH}" text-anchor="end">Late</text>`;
  const xg = gridFor(start, end, plotW, Math.min(90, plotW / 4), TIME_STEPS);
  for (const t of xg.ticks) {
    if (t < -1e-9) continue;
    inside += `${gridDown(sx(t), L, T, plotH)}`;
    const label = fmtTime(t);
    const anchor = sx(t) - label.length * CHAR_W / 2 < L - 8 ? "start" : sx(t) + label.length * CHAR_W / 2 > W ? "end" : "middle";
    g += `<text x="${sx(t)}" y="${H - 5}" text-anchor="${anchor}">${label}</text>`;
  }
  const shown = beats.filter(([t]) => t >= start);
  const perPx = shown.length / Math.max(1, plotW);
  const radius = Math.min(2.2, Math.max(0.8, 2.2 / Math.sqrt(Math.max(perPx, 1))));
  for (const [t, lead, side] of shown) {
    inside += `<circle cx="${sx(t).toFixed(1)}" cy="${sy(wrapMs(lead, half)).toFixed(1)}" r="${radius}" fill="var(${side ? "--tock" : "--tick"})"/>`;
  }
  g += `<g clip-path="url(#${area.id})">${inside}</g>`;
  if (!shown.length) g += `<text x="${L + plotW / 2}" y="${T + plotH / 2 + 4}" text-anchor="middle">Listening…</text>`;
  const key = `<div class="legend above"><span><span class="swatch dot" style="background:var(--tick)"></span>Tick</span><span><span class="swatch dot" style="background:var(--tock)"></span>Tock</span></div>`;
  return `<div class="card"><h2>Paper Strip</h2><p class="hint">The last ${num(span, 0)} s of beats: a watch on time draws a level line, one that gains rises to the right</p>${key}<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Paper strip">${g}</svg></div></div>`;
}

function liveView(l) {
  const d = l.doc || {};
  const r = d.reading || {};
  const total = Number.isFinite(d.seconds) ? d.seconds : l.seconds;
  const at = Number.isFinite(d.recorded_s) ? d.recorded_s : 0;
  const line = d.done ? "Done: the watch can be moved" : `${fmtTime(at)} of ${fmtTime(total)} · keep the watch still`;
  let html = `<h1>Live</h1><p class="sub">${esc(positionName(d.position || l.position))} · ${esc(line)}</p>`;
  html += `<div class="bar"><div style="width:${Math.min(100, 100 * at / Math.max(1, total)).toFixed(1)}%"></div></div>`;
  if (l.unavailable) {
    html += `<div class="card notice"><b>No Live Readings Here</b>This chat app does not pass the view's requests on while it records. The chat says how far it has got, and the readings show here when the take is done.</div>`;
  }
  const heard = r.beats_used > 0;
  const wait = "Listening…";
  const chosen = chosenBeatError(r.beat_error_unlock_ms, r.beat_error_ms, r.beat_error_source);
  const be = chosen.value;
  const dg = { ...BASE_DIGITS, ...((l.pm || {}).digits || {}) };
  html += `<div class="tiles">
    ${tile("Rate", "--rate", heard ? signed(r.rate_s_per_day, dg.rate) : "–", "seconds per day", heard ? `${num(d.average_s, 0)} s average` : wait)}
    ${tile("Amplitude", "--amplitude", heard ? num(r.amplitude_deg, dg.amplitude) : "–", heard && typeof (l.pm || {}).amplitude === "string" ? `± ${esc(l.pm.amplitude)}°` : "", heard ? "" : wait, "°")}
    ${tile("Beat Error", "--beat-error", heard ? num(abs(be), dg.beat_error) : "–", "milliseconds", heard ? (chosen.source ? `from the ${chosen.source}` : "") : wait)}
    ${tile("Beats Heard", "", esc(d.beats_heard || 0), "", heard ? `${esc(r.beats_used)} in the last ${num(r.span_s, 0)} s` : wait)}
  </div>`;
  // Clipping, when core counts it, in the server's (core's) words (#808).
  if (l.limits && l.limits.length) html += limitsCard(l.limits);
  html += liveStrip(d);
  html += stripCards(trendStrip(d.trend));
  return html;
}

// record_position's result: the take's quick check, with the readings over
// time as they were heard when there was a live view.
function recordView(doc, heard, noBeat) {
  const c = doc.check || {};
  const name = positionName(doc.position);
  let html = `<h1>${esc(name)}</h1><p class="sub">${timeLabel(doc.seconds)} recorded · ${esc(c.bph)} beats per hour${Number.isFinite(doc.wind_h) ? ` · ${num(doc.wind_h, 0)} h after full wind` : ""}</p>`;
  // record/2 adds every take; its sound is stated as facts beside it.
  if (doc.session_file) {
    html += `<p class="hint">Added to the test in ${esc(String(doc.session_file).split(/[\\/]/).slice(-2, -1)[0] || doc.session_file)}. The watch can be moved.</p>`;
  }
  const clipped = c.clipping && c.clipping.beats > 0 ? `${num(c.clipping.beat_fraction * 100, 1)}% of beats were clipped.` : "";
  if (c.watch_heard === false) {
    html += `<div class="card notice"><b>${esc(NO_BEAT_TITLE)}</b>${esc(noBeat || "")}${clipped ? ` ${clipped}` : ""}</div>`;
    return html;
  }
  if (clipped) html += `<div class="card notice"><b>Clipping</b>${clipped}</div>`;
  html += `<div class="tiles">
    ${tile("Rate", "--rate", signed(c.rate_s_per_day, 1), "seconds per day", "a quick look; the test's report has the reading")}
    ${tile("Amplitude", "--amplitude", num(c.amplitude_deg, 0), "", "", "°")}
    ${tile("Beat Error", "--beat-error", num(abs(c.beat_error_ms), 2), "milliseconds", "from the unlock")}
    ${tile("Beats", "", esc(c.beats_found), "", `of ${esc(c.beats_expected)} expected`)}
  </div>`;
  html += stripCards(heard && trendStrip(heard.trend));
  return html;
}

// ---- Dispatch -------------------------------------------------------------

let last = null;

function render(result) {
  if (live && live.timer) { clearTimeout(live.timer); live.timer = null; }
  last = result;
  redraw();
}

function redraw() {
  const root = document.getElementById("root");
  if (!last && !live) return;
  charts.clear();
  mapPaints.length = 0;
  if (!last) {
    lastWidth = root.clientWidth;
    root.innerHTML = liveView(live);
    wireCharts(root);
    return;
  }
  const doc = last.structuredContent;
  const extra = last._meta && last._meta["timegrapher/charts"];
  const limits = last._meta && last._meta["timegrapher/limits"];
  // No regular beat, in the server's (core's) words.
  const noBeat = last._meta && last._meta["timegrapher/no_beat"];
  let html;
  if (last.isError || !doc || !doc.schema) {
    const text = (last.content || []).map((c) => c.text || "").join("\n");
    html = `<div class="card notice"><b>No Reading</b>${esc(text || "The tool returned nothing to draw.")}</div>`;
  } else if (doc.schema.startsWith("timegrapher.analyze/")) {
    html = recordingView(doc, extra, limits, noBeat, last._meta && last._meta["timegrapher/pm"]);
  } else if (doc.schema.startsWith("timegrapher.session/")) {
    html = sessionView(doc, limits);
  } else if (doc.schema.startsWith("timegrapher.profile/")) {
    html = profileView(doc, last._meta && last._meta["timegrapher/profile_facts"]);
  } else if (doc.schema.startsWith("timegrapher.series/")) {
    html = seriesView(doc, extra, limits, last._meta && last._meta["timegrapher/series_limits"]);
  } else if (doc.schema.startsWith("timegrapher.record/")) {
    html = recordView(doc, live && live.doc, noBeat);
  } else {
    html = `<p class="empty">Nothing to draw for ${esc(doc.schema)}.</p>`;
  }
  lastWidth = root.clientWidth;
  root.innerHTML = html;
  wireCharts(root);
  wireSteadiness(root);
  paintMaps(root);
}
</script>
</body>
</html>
