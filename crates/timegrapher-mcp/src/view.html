<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timegrapher</title>
<!--
  The MCP App view: the chat app shows this page next to a tool's result and
  hands it the result (docs/mcp.md). It draws the readings the way the
  desktop app does, from the tool's JSON alone: no scripts or fonts from
  elsewhere, no network.
-->
<style>
/* The palette (timegrapher_core::palette, the app's), filled in by views.rs:
   :root for light, :root[data-theme="dark"] for dark. */
/*PALETTE*/
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--window); color: var(--text);
  font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
  padding: 12px;
}
h1 { font-size: 17px; font-weight: 600; margin: 0 0 2px; }
h2 { font-size: 13px; font-weight: 600; margin: 0 0 6px; color: var(--text2); }
.sub { color: var(--text2); font-size: 12px; margin: 0 0 12px; overflow-wrap: anywhere; }
.card { background: var(--card); border-radius: 10px; padding: 12px; margin: 0 0 10px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; margin: 0 0 10px; }
.tile { background: var(--card); border-radius: 10px; padding: 10px 12px; }
.tile .label { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px; }
.tile .value { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.tile .unit { font-size: 13px; color: var(--text2); font-weight: 400; }
.tile .note { font-size: 12px; color: var(--text2); }
.swatch { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.notice { border-left: 4px solid var(--text3); }
.notice b { display: block; margin-bottom: 2px; }
.dot { border-radius: 50%; width: 8px; height: 8px; }
/* The legend sits inside the plot, top right, as the app's does. */
.legend {
  position: absolute; display: flex; flex-direction: column; align-items: flex-end; gap: 1px;
  font-size: 11px; color: var(--text); padding: 3px 6px; border-radius: 5px;
  background: color-mix(in srgb, var(--card) 85%, transparent); pointer-events: none;
}
.legend.above { position: static; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; gap: 2px 12px; padding: 0 0 4px; background: none; }
.legend > span { display: inline-flex; align-items: center; gap: 5px; }
svg.key { display: inline-block; }
.side { display: flex; align-items: center; gap: 6px; font-size: 12.5px; margin: 0 0 3px; min-width: 0; }
.side .sum { color: var(--text2); font-size: 11.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
svg { display: block; max-width: 100%; height: auto; }
svg text { fill: var(--text2); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .plot { fill: var(--card); stroke: var(--separator); stroke-width: 1; }
svg .grid { stroke: var(--grid); stroke-width: 1; }
svg .zero { stroke: var(--text3); stroke-width: 1; }
svg .cursor { stroke: var(--text3); stroke-width: 1; }
.chart { position: relative; }
.tip {
  position: absolute; pointer-events: none; background: var(--card); color: var(--text);
  border: 1px solid var(--separator); border-radius: 6px; padding: 4px 8px; font-size: 12px;
  white-space: nowrap; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15); display: none;
  font-variant-numeric: tabular-nums;
}
table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
th, td { text-align: right; padding: 4px 6px; border-bottom: 1px solid var(--separator); }
th:first-child, td:first-child { text-align: left; }
th { color: var(--text2); font-weight: 500; }
.sub.off { margin: 4px 0 0; }
.hint { color: var(--text2); font-size: 12px; margin: -2px 0 8px; }
.findings { list-style: none; margin: 0; padding: 0; }
.findings li { padding: 8px 0; border-bottom: 1px solid var(--separator); }
.findings li:last-child { border-bottom: none; }
.limits li { font-size: 13px; }
.seg { display: flex; flex-wrap: wrap; gap: 4px; margin: 0 0 6px; }
.seg button { font: inherit; font-size: 12px; color: var(--text); background: var(--control); border: 0; border-radius: 6px; padding: 3px 9px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--text); color: var(--card); }
.series-name { font-size: 12.5px; font-weight: 600; margin: 12px 0 2px; }
.headline { color: var(--text); font-size: 12.5px; margin: 0 0 2px; }
.stats { color: var(--text2); font-size: 11.5px; margin: 0 0 4px; font-variant-numeric: tabular-nums; }
.empty { color: var(--text2); padding: 24px 0; text-align: center; }
.bar { height: 4px; border-radius: 2px; background: var(--control); margin: -6px 0 12px; overflow: hidden; }
.bar > div { height: 100%; background: var(--text2); }
</style>
</head>
<body>
<div id="root"><p class="empty">Waiting for the reading…</p></div>
<script>
"use strict";

// ---- The host bridge (MCP Apps, JSON-RPC over postMessage) -------------

let nextId = 1;
const pending = new Map();

function send(msg) { window.parent.postMessage(msg, "*"); }

function request(method, params) {
  const id = nextId++;
  send({ jsonrpc: "2.0", id, method, params });
  return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
}

function notify(method, params) { send({ jsonrpc: "2.0", method, params: params || {} }); }

function applyContext(ctx) {
  if (!ctx) return;
  if (ctx.theme === "dark" || ctx.theme === "light") {
    document.documentElement.dataset.theme = ctx.theme;
  }
}

window.addEventListener("message", (event) => {
  if (event.source !== window.parent) return;
  const msg = event.data;
  if (!msg || msg.jsonrpc !== "2.0") return;
  if (msg.id != null && pending.has(msg.id) && !msg.method) {
    const { resolve, reject } = pending.get(msg.id);
    pending.delete(msg.id);
    msg.error ? reject(msg.error) : resolve(msg.result);
    return;
  }
  if (msg.method === "ui/notifications/tool-result") render(msg.params || {});
  else if (msg.method === "ui/notifications/tool-input") toolInput((msg.params || {}).arguments || {});
  else if (msg.method === "ui/notifications/host-context-changed") { applyContext(msg.params); redraw(); }
});

if (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) {
  document.documentElement.dataset.theme = "dark";
}

request("ui/initialize", {
  protocolVersion: "2026-01-26",
  clientInfo: { name: "timegrapher-charts", version: "1" },
  appCapabilities: { availableDisplayModes: ["inline", "fullscreen"] },
}).then((result) => {
  applyContext(result && result.hostContext);
  notify("ui/notifications/initialized");
}).catch(() => notify("ui/notifications/initialized"));

let lastWidth = 0;
window.addEventListener("resize", () => {
  const w = document.getElementById("root").clientWidth;
  if (Math.abs(w - lastWidth) > 4) { lastWidth = w; redraw(); }
});

let lastHeight = 0;
new ResizeObserver(() => {
  const height = Math.ceil(document.documentElement.scrollHeight);
  if (height !== lastHeight) {
    lastHeight = height;
    notify("ui/notifications/size-changed", { width: document.documentElement.scrollWidth, height });
  }
}).observe(document.body);

// ---- Formatting ---------------------------------------------------------

// The app's order: Dial Up, Dial Down, Crown Up, Crown Down, Crown Left, Crown Right.
const ORDER = ["CH", "CB", "3H", "9H", "6H", "12H"];
const POSITIONS = {
  CH: ["DU", "Dial Up"], CB: ["DD", "Dial Down"], "3H": ["CU", "Crown Up"],
  "6H": ["CL", "Crown Left"], "9H": ["CD", "Crown Down"], "12H": ["CR", "Crown Right"],
};

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, (c) => (
    { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function num(v, digits) { return Number.isFinite(v) ? v.toFixed(digits) : "–"; }
function signed(v, digits) { return Number.isFinite(v) ? (v > 0 ? "+" : "") + v.toFixed(digits) : "–"; }
function abs(v) { return Number.isFinite(v) ? Math.abs(v) : v; }
function css(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

// `note` is HTML: callers build it from numbers or escape it.
function tile(label, color, value, unit, note, suffix) {
  return `<div class="tile"><div class="label">${color ? `<span class="swatch" style="background:var(${color})"></span>` : ""}${esc(label)}</div>
    <div class="value">${value}${suffix ? esc(suffix) : ""}${unit && unit.length <= 4 ? `<span class="unit">${unit.startsWith("°") ? "" : " "}${esc(unit)}</span>` : ""}</div>${unit && unit.length > 4 ? `<div class="unit">${esc(unit)}</div>` : ""}${note ? `<div class="note">${note}</div>` : ""}</div>`;
}

// ---- Charts (inline SVG), drawn as the app's plots ------------------------
//
// As in the app (/mnt/project-files/app/chart-style.md on the project, and
// theme.rs): the plot is the card's colour with a faint grid, the units are on
// the value axis, time reads m:ss, and nothing is drawn outside the plot:
// marks are clipped to it and values off the scale are counted below it.

// Room for one character of the 11px axis text.
const CHAR_W = 6.6;
// The app's time steps (theme::TIME_STEPS), seconds.
const TIME_STEPS = [0.1, 0.2, 0.5, 1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 900, 1800,
  3600, 7200, 10800, 21600, 43200, 86400, 172800];
// The app's line styles.
const DASH = { dashed: "4 3", dotted: "1.2 2.4", loose: "6 5" };

// Charts are drawn at the width they are shown, so their text stays at its size.
function chartWidth() {
  return Math.max(300, (document.getElementById("root").clientWidth || 640) - 24);
}

// Grid values at least `minPx` apart, on steps of 1, 2 and 5 (or the ladder's).
function gridFor(lo, hi, px, minPx, ladder) {
  if (!(hi > lo)) return { step: 1, ticks: [] };
  const want = (hi - lo) / Math.max(1, px / minPx);
  let step;
  if (ladder) step = ladder.find((s) => s >= want) || ladder[ladder.length - 1];
  else {
    const p = Math.pow(10, Math.floor(Math.log10(want)));
    step = [1, 2, 5, 10].map((m) => m * p).find((s) => s >= want * (1 - 1e-9));
  }
  const ticks = [];
  for (let v = Math.ceil(lo / step - 1e-9) * step; v <= hi + step * 1e-9; v += step) ticks.push(+v.toFixed(10));
  return { step, ticks };
}

// An axis value as the app writes it: decimals from the step, the unit, no "-0".
function axisLabel(v, step, unit) {
  const d = step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
  if (Math.abs(v) < step * 1e-6) v = 0;
  return v.toFixed(d) + (unit || "");
}

// strip::fmt_time: m:ss, or h:mm:ss from an hour.
function fmtTime(t) {
  const s = Math.round(Math.max(0, t));
  const pad = (n) => String(n).padStart(2, "0");
  return s >= 3600 ? `${Math.floor(s / 3600)}:${pad(Math.floor(s / 60) % 60)}:${pad(s % 60)}`
    : `${Math.floor(s / 60)}:${pad(s % 60)}`;
}

// The app's scale for its charts: the 2nd to 98th percentile, padded, so one
// glitch doesn't flatten the line.
function percentileRange(values) {
  if (values.length < 2) return null;
  const ys = values.slice().sort((a, b) => a - b);
  const q = (f) => ys[Math.round((ys.length - 1) * f)];
  const lo = q(0.02), hi = q(0.98);
  const pad = Math.max((hi - lo) * 0.15, 0.05);
  return [lo - pad, hi + pad];
}

let clipCount = 0;

// The plot's background and the clip that keeps the marks inside it.
function plotArea(x, y, w, h) {
  const id = "clip" + (++clipCount);
  return {
    id,
    svg: `<defs><clipPath id="${id}"><rect x="${x}" y="${y}" width="${w}" height="${h}"/></clipPath></defs>
      <rect class="plot" x="${x}" y="${y}" width="${w}" height="${h}" rx="3"/>`,
  };
}

function lineSample(s) {
  return `<svg class="key" width="18" height="8" viewBox="0 0 18 8"><line x1="1" x2="17" y1="4" y2="4" stroke="var(${s.color})" stroke-width="${s.main === false ? 1.5 : 2}"${s.dash ? ` stroke-dasharray="${DASH[s.dash]}"` : ""}${s.opacity ? ` opacity="${s.opacity}"` : ""}/></svg>`;
}

// A line chart with one value axis.
//   series: [{name, color, key, dash, opacity, main, points: [[x, y]], band: [[x, lo, hi]]}]
//   unit, decimals: the value's; time: x is seconds, read m:ss; xUnit otherwise
//   robust: scale to the 2nd to 98th percentile; yRange: [lo, hi] instead
//   marks: [{x, color, label, width, dash, row}]; hlines: [{y, color, dash}]
//   hover: false for no readout (the sound plots have none, as in the app)
function lineChart(o) {
  const W = chartWidth(), H = o.height || 150, T = 4, B = 20, R = 6;
  const ys = [], xs = [];
  for (const s of o.series) {
    for (const [x, y] of s.points) if (Number.isFinite(y)) { xs.push(x); ys.push(y); }
    for (const [x, lo, hi] of s.band || []) { xs.push(x); ys.push(lo, hi); }
  }
  if (!ys.length) return `<p class="empty">No ${esc(o.title || "data")} to draw.</p>`;
  const lo = Math.min(...ys), hi = Math.max(...ys);
  let [y0, y1] = o.yRange || [lo - (hi - lo) * 0.08, hi + (hi - lo) * 0.08];
  if (o.robust && !o.yRange) {
    const r = percentileRange(ys);
    if (r) [y0, y1] = r;
  }
  if (y1 - y0 < (o.minSpan || 1e-9)) { const m = (y0 + y1) / 2, h = (o.minSpan || 1) / 2; y0 = m - h; y1 = m + h; }
  let [x0, x1] = o.xRange || [Math.min(...xs), Math.max(...xs)];
  if (!(x1 > x0)) x1 = x0 + 1;
  const plotH = H - T - B;
  const yg = gridFor(y0, y1, plotH, 30);
  const ylab = yg.ticks.map((v) => [v, axisLabel(v, yg.step, o.unit)]);
  const L = Math.ceil(10 + CHAR_W * Math.max(3, ...ylab.map(([, t]) => t.length)));
  const plotW = W - L - R;
  // At least three or four labels on a narrow chart.
  const xMin = Math.min(80, plotW / 4);
  const xg = o.time ? gridFor(x0, x1, plotW, xMin, TIME_STEPS) : gridFor(x0, x1, plotW, xMin);
  const sx = (x) => L + (x - x0) / (x1 - x0) * plotW;
  const sy = (y) => T + (y1 - y) / (y1 - y0) * plotH;
  const area = plotArea(L, T, plotW, plotH);
  let g = area.svg, inside = "";
  for (const [v, t] of ylab) {
    inside += `<line class="grid" x1="${L}" x2="${L + plotW}" y1="${sy(v)}" y2="${sy(v)}"/>`;
    g += `<text x="${L - 5}" y="${sy(v) + 4}" text-anchor="end">${esc(t)}</text>`;
  }
  for (const v of xg.ticks) {
    inside += `<line class="grid" x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${T + plotH}"/>`;
    const t = o.time ? fmtTime(v) : axisLabel(v, xg.step, o.xUnit);
    // The first and last labels stay inside the chart.
    const anchor = sx(v) - t.length * CHAR_W / 2 < L - 8 ? "start" : sx(v) + t.length * CHAR_W / 2 > W ? "end" : "middle";
    g += `<text x="${sx(v)}" y="${H - 5}" text-anchor="${anchor}">${esc(t)}</text>`;
  }
  for (const h of o.hlines || []) {
    inside += `<line x1="${L}" x2="${L + plotW}" y1="${sy(h.y)}" y2="${sy(h.y)}" stroke="var(${h.color})" stroke-width="1"${h.dash ? ` stroke-dasharray="${DASH[h.dash]}"` : ""}/>`;
  }
  for (const s of o.series) {
    if (s.band && s.band.length) {
      const top = s.band.map(([x, , hi]) => `${sx(x).toFixed(1)},${sy(hi).toFixed(1)}`);
      const bottom = s.band.slice().reverse().map(([x, lo]) => `${sx(x).toFixed(1)},${sy(lo).toFixed(1)}`);
      inside += `<polygon points="${top.concat(bottom).join(" ")}" fill="var(${s.color})" opacity="0.25"/>`;
    }
  }
  for (const m of o.marks || []) {
    inside += `<line x1="${sx(m.x)}" x2="${sx(m.x)}" y1="${T}" y2="${T + plotH}" stroke="var(${m.color})" stroke-width="${m.width || 1.5}"${m.dash ? ` stroke-dasharray="${DASH[m.dash]}"` : ""}/>`;
  }
  // Main lines last, so they are on top.
  for (const s of o.series.slice().sort((a, b) => (a.main !== false) - (b.main !== false))) {
    let d = "", pen = false;
    for (const [x, y] of s.points) {
      if (!Number.isFinite(y)) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`;
      pen = true;
    }
    inside += `<path d="${d}" fill="none" stroke="var(${s.color})" stroke-width="${s.main === false ? 1.2 : 1.8}"${s.dash ? ` stroke-dasharray="${DASH[s.dash]}"` : ""}${s.opacity ? ` opacity="${s.opacity}"` : ""} stroke-linejoin="round"/>`;
  }
  g += `<g clip-path="url(#${area.id})">${inside}</g>`;
  g += markLabels(o.marks || [], sx, L, L + plotW, T);
  const id = "c" + (++clipCount);
  charts.set(id, { o, sx, x0, x1, L, plotW, W, T, plotH });
  // Values off the scale are counted under the chart.
  let off = 0;
  for (const s of o.series) for (const [, y] of s.points) if (y < y0 || y > y1) off++;
  const offNote = off ? `<p class="sub off">${off} ${off === 1 ? "outlier" : "outliers"} off the scale</p>` : "";
  const legend = o.series.length > 1 || o.legend
    // Inside the plot, as in the app, where there is room; above it on a phone.
    ? `<div class="legend${W < 520 ? " above" : ""}" style="top:${T + 4}px;right:${R + 4}px">${o.series.map((s) =>
      `<span>${esc(s.name)}${lineSample(s)}${s.key && s.key !== s.color ? `<span class="swatch dot" style="background:var(${s.key})"></span>` : ""}</span>`).join("")}</div>` : "";
  const hover = o.hover === false ? "" : `<line class="cursor" x1="0" x2="0" y1="${T}" y2="${T + plotH}" style="display:none"/>
    <rect x="${L}" y="${T}" width="${plotW}" height="${plotH}" fill="transparent"/>`;
  const above = W < 520;
  return `${above ? legend : ""}<div class="chart"${o.hover === false ? "" : ` data-chart="${id}"`}><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.title || "")}">${g}${hover}</svg>${above ? "" : legend}<div class="tip"></div></div>${offNote}`;
}

// Each mark named along the top of the plot in its colour, just right of its
// line, moved down a row where it would run into another (profiles::label_marks).
function markLabels(marks, sx, left, right, top) {
  let out = "";
  const ends = [];
  const groups = [...new Set(marks.map((m) => m.group || 0))];
  for (const gname of groups) {
    const first = ends.length;
    const ms = marks.filter((m) => (m.group || 0) === gname && m.label && sx(m.x) >= left && sx(m.x) <= right)
      .sort((a, b) => a.x - b.x);
    for (const m of ms) {
      const x = sx(m.x), w = m.label.length * CHAR_W;
      // A label that would leave the plot sits left of its line instead.
      const flip = x + 3 + w > right;
      const from = flip ? x - 3 - w : x + 3;
      let row = -1;
      for (let r = first; r < ends.length; r++) if (ends[r] + 4 < from) { row = r; break; }
      if (row < 0) { row = ends.length; ends.push(0); }
      ends[row] = Math.max(ends[row], from + w);
      out += `<text x="${flip ? x - 3 : x + 3}" y="${top + 12 + row * 13}" text-anchor="${flip ? "end" : "start"}" style="fill:var(${m.color})">${esc(m.label)}</text>`;
    }
  }
  return out;
}

const charts = new Map();

function nearest(points, x) {
  let best = null, bd = Infinity;
  for (const p of points) { const d = Math.abs(p[0] - x); if (d < bd && Number.isFinite(p[1])) { bd = d; best = p; } }
  return best;
}

// Every line's value at the pointer, in one box, as the app does.
function wireCharts(root) {
  for (const el of root.querySelectorAll(".chart[data-chart]")) {
    const c = charts.get(el.dataset.chart);
    if (!c) continue;
    const svg = el.querySelector("svg"), tip = el.querySelector(".tip"), cursor = el.querySelector(".cursor");
    svg.addEventListener("pointermove", (ev) => {
      const box = svg.getBoundingClientRect();
      const px = (ev.clientX - box.left) / box.width * c.W;
      if (px < c.L || px > c.L + c.plotW) { tip.style.display = "none"; cursor.style.display = "none"; return; }
      const x = c.x0 + (px - c.L) / c.plotW * (c.x1 - c.x0);
      const rows = [];
      let at = x;
      for (const s of c.o.series) {
        const p = nearest(s.points, x);
        if (p) {
          at = p[0];
          rows.push(`<span class="swatch dot" style="display:inline-block;background:var(${s.key || s.color})"></span> ${esc(s.name)} ${esc(p[1].toFixed(c.o.decimals || 0) + (c.o.unit || ""))}`);
        }
      }
      if (!rows.length) return;
      cursor.setAttribute("x1", c.sx(at)); cursor.setAttribute("x2", c.sx(at)); cursor.style.display = "";
      tip.innerHTML = `<div style="color:var(--text2)">${esc(c.o.time ? fmtTime(at) : at.toFixed(2) + (c.o.xUnit || ""))}</div>${rows.join("<br>")}`;
      tip.style.display = "block";
      const left = (c.sx(at) / c.W) * box.width;
      tip.style.left = Math.min(Math.max(0, left + 10), box.width - tip.offsetWidth) + "px";
      tip.style.top = (c.T + 4) + "px";
    });
    svg.addEventListener("pointerleave", () => { tip.style.display = "none"; cursor.style.display = "none"; });
  }
}

function timeLabel(s) {
  if (!Number.isFinite(s)) return "";
  if (s < 120) return `${s.toFixed(0)} s`;
  if (s < 7200) return `${(s / 60).toFixed(1)} min`;
  return `${(s / 3600).toFixed(2)} h`;
}

// ---- Views ----------------------------------------------------------------

// The app's three charts over time: rate, amplitude and beat error, each in
// its reading's colour.
function stripCards(strip) {
  if (!strip) return "";
  const has = (k) => strip[k] && strip[k].length;
  const cards = [];
  if (has("rate")) {
    cards.push(["Rate", "The rate over the whole recording", lineChart({
      title: "Rate", time: true, robust: true, unit: " s/day", decimals: 1, minSpan: 1,
      series: [{ name: "Rate in seconds per day, 10 s average", color: "--rate", points: strip.rate }],
    })]);
  }
  if (has("amplitude")) {
    cards.push(["Amplitude", "The amplitude over the whole recording, from the ticks and tocks", lineChart({
      title: "Amplitude", time: true, legend: has("amplitude_tick") || has("amplitude_tock"), robust: true, unit: "°", decimals: 0, minSpan: 4,
      series: [
        { name: "Average Amplitude", color: "--amplitude", points: strip.amplitude },
        { name: "Amplitude from Tick", color: "--amplitude", key: "--tick", dash: "dashed", main: false, points: strip.amplitude_tick || [] },
        { name: "Amplitude from Tock", color: "--amplitude", key: "--tock", dash: "dotted", main: false, points: strip.amplitude_tock || [] },
      ].filter((s) => s.points.length),
    })]);
  }
  if (has("beat_error_unlock") || has("beat_error_drop")) {
    cards.push(["Beat Error", "The beat error over the whole recording", lineChart({
      title: "Beat Error", time: true, legend: has("beat_error_unlock") && has("beat_error_drop"), robust: true, unit: " ms", decimals: 2, minSpan: 0.1,
      series: [
        { name: "From the Unlock", color: "--beat-error", points: strip.beat_error_unlock || [] },
        { name: "From the Drop", color: "--beat-error", opacity: 0.6, dash: "dashed", main: false, points: strip.beat_error_drop || [] },
      ].filter((s) => s.points.length),
    })]);
  }
  return cards.map(([title, hint, chart]) => `<div class="card"><h2>${title}</h2><p class="hint">${hint}</p>${chart}</div>`).join("");
}

// profiles::summary
function profileSummary(p) {
  const ms = (v) => Number.isFinite(v) ? `${signed(v, 2)} ms` : "not found";
  let s = `${p.beats} beats · unlock ${ms(p.unlock_ms)} · drop ${ms(p.drop_ms)}`;
  if (Number.isFinite(p.unlock_ms) && Number.isFinite(p.drop_ms)) s += ` · unlock to drop ${num(p.drop_ms - p.unlock_ms, 2)} ms`;
  s += Number.isFinite(p.amplitude_deg) ? ` · amplitude ${num(p.amplitude_deg, 0)}°` : " · amplitude out of range";
  return s;
}

// The Tick and Tock sounds as the app's sound pane draws them: Tick above
// Tock on one scale and one clock, each with the band 80% of beats fall in,
// the noise floor, the engine's edges and the three sounds, and no readout.
// `dropBeatError` (ms) puts the two on the shared clock, as the app does.
function profileCard(p, title, dropBeatError) {
  if (!p || !p.a || !p.b) return "";
  const shift = Number.isFinite(dropBeatError) ? [dropBeatError / 2, -dropBeatError / 2] : [0, 0];
  const sides = [p.a, p.b];
  const top = Math.max(1e-6, ...sides.flatMap((s) => s.p90 || s.median || []));
  const xs = sides.flatMap((s, k) => (s.median || []).length ? [s.t0_ms + shift[k], s.t0_ms + shift[k] + (s.median.length - 1) * s.step_ms] : []);
  const xRange = [Math.min(...xs), Math.max(...xs)];
  const plot = (s, k) => {
    const dx = shift[k], color = k ? "--tock" : "--tick";
    const x = (i) => s.t0_ms + dx + i * s.step_ms;
    const pts = (s.median || []).map((v, i) => [x(i), v]);
    const band = s.p10 && s.p90 ? s.p10.map((lo, i) => [x(i), lo, s.p90[i]]) : [];
    const marks = [];
    for (const [label, at, c, w] of [["Unlock", s.unlock_ms, "--unlock", 1.5], ["Drop", s.drop_ms, "--drop", 1.5], ["Peak", s.peak_ms, "--peak", 1]]) {
      if (Number.isFinite(at)) marks.push({ x: at + dx, color: c, width: w, label, group: 0 });
    }
    for (const [label, at] of [["1 Unlock", s.sound1_ms], ["2 Impulse", s.sound2_ms], ["3 Drop", s.sound3_ms]]) {
      if (Number.isFinite(at)) marks.push({ x: at + dx, color: "--sound", width: 1.2, dash: "loose", label, group: 1 });
    }
    return `<div class="side"><span class="swatch dot" style="background:var(${color})"></span><b style="color:var(${color})">${k ? "Tock" : "Tick"}</b><span class="sum">${esc(profileSummary(s))}</span></div>${lineChart({
      title: k ? "Tock" : "Tick", height: 130, hover: false, xUnit: " ms", xRange, yRange: [0, top * 1.08],
      series: [{ name: k ? "Tock" : "Tick", color, points: pts, band }],
      hlines: Number.isFinite(s.floor) ? [{ y: s.floor, color: "--text3", dash: "dashed" }] : [],
      marks,
    })}`;
  };
  return `<div class="card"><h2>${esc(title || "Tick and Tock")}</h2><p class="hint">The typical tick and tock sound, with the edges the readings come from</p>${plot(p.a, 0)}<div style="height:6px"></div>${plot(p.b, 1)}</div>`;
}

function fileName(doc) {
  const f = doc.input && doc.input.files && doc.input.files[0];
  return f && f.path ? String(f.path).split(/[\\/]/).pop() : "";
}

function recordingView(doc, extra, limits) {
  const name = fileName(doc);
  const head = `<h1>Recording</h1><p class="sub">${esc(name)}${name ? " · " : ""}${timeLabel(doc.duration_s)} · ${esc(doc.bph)} beats per hour · lift angle ${esc(doc.lift_deg)}°</p>`;
  if (doc.watch_heard === false) {
    return head + `<div class="card notice"><b>No Regular Beat Found</b>${noRegularBeat(doc, doc.bph)}</div>`;
  }
  const o = doc.overall || {};
  // The headline beat error is the unlock's, with the drop's beside it, as
  // on the app's card. Both show the size only: which side is Tick can
  // change between runs of the same take, so a sign would mean nothing.
  const unlock = doc.beat_error_unlock_ms, drop = o.beat_error_ms;
  const be = Number.isFinite(unlock) ? unlock : drop;
  const beNote = Number.isFinite(unlock)
    ? `from the unlock${Number.isFinite(drop) ? ` · from the drop ${num(abs(drop), 2)} ms` : ""}` : "from the drop";
  const sides = Number.isFinite(doc.amplitude_even_deg) && Number.isFinite(doc.amplitude_odd_deg)
    ? `<span class="swatch dot" style="display:inline-block;background:var(--tick)"></span> Tick ${num(doc.amplitude_even_deg, 0)}° · <span class="swatch dot" style="display:inline-block;background:var(--tock)"></span> Tock ${num(doc.amplitude_odd_deg, 0)}°` : "";
  // The headline rate is corrected for the sound card's clock where the
  // recording tells it (rate_corrected_s_per_day), as in the CLI's text.
  const conf = doc.confidence || {};
  const rateSe = conf.rate && Number.isFinite(conf.rate.se) ? conf.rate.se : null;
  const jitter = Number.isFinite(doc.jitter_us) ? doc.jitter_us : o.jitter_us;
  const clipped = doc.clipping && doc.clipping.beat_fraction > 0.01;
  let html = head + `<div class="tiles">
    ${tile("Rate", "--rate", signed(Number.isFinite(doc.rate_corrected_s_per_day) ? doc.rate_corrected_s_per_day : o.rate_s_per_day, 1), rateSe != null ? `± ${num(rateSe, 1)} seconds per day` : "seconds per day", Number.isFinite(doc.rate_p05) ? `90% of windows ${signed(doc.rate_p05, 1)} to ${signed(doc.rate_p95, 1)}` : "")}
    ${tile("Amplitude", "--amplitude", num(doc.amplitude_deg, 0), Number.isFinite(doc.amplitude_se_deg) ? `± ${Math.max(1, Math.round(doc.amplitude_se_deg))}°` : "", sides, "°")}
    ${tile("Beat Error", "--beat-error", num(abs(be), 2), "milliseconds", beNote)}
    ${tile("Beats", "", esc(doc.beats_found), "", Number.isFinite(jitter) ? `jitter ${num(jitter, 0)} µs` : "")}
  </div>`;
  // The caveats say what limits the readings, clipping among them; a
  // server without them still gets the clipping notice.
  if (limits && limits.length) html += limitsCard(limits);
  else if (clipped) html += `<div class="card notice"><b>Clipping</b>${num(doc.clipping.beat_fraction * 100, 1)}% of beats were clipped.</div>`;
  html += stripCards(extra && extra.strip);
  html += profileCard(extra && extra.profile, "Tick and Tock", o.beat_error_ms);
  return html;
}

// The canonical sentence for no regular beat, with the timing scatter of
// the beats when the document gives it (as the server's caveats.rs says it).
function noRegularBeat(m, bph) {
  const j = m && m.jitter_us;
  const scatter = Number.isFinite(j) && bph > 0
    ? ` (timing scatter ${num(j / 1000, 1)} ms, ${num(j / (3.6e9 / bph) * 100, 1)}% of a beat)` : "";
  return `No regular beat found${scatter}. There are no rate, amplitude or beat error readings.`;
}

function sessionView(doc, limits) {
  const rep = doc.report || {};
  const readings = (doc.readings || []).map((r, i) => Object.assign({ index: i }, r));
  const rank = (r) => { const k = ORDER.indexOf(r.position); return k < 0 ? ORDER.length : k; };
  readings.sort((a, b) => rank(a) - rank(b) || (a.wind_h || 0) - (b.wind_h || 0) || a.index - b.index);
  const title = [doc.watch, doc.calibre].filter(Boolean).join(" · ");
  let html = `<h1>Multi-Position Test</h1><p class="sub">${esc(title || "")}${title ? " · " : ""}${esc(doc.bph)} beats per hour · lift angle ${esc(doc.lift_deg)}°</p>`;
  const state = (rep.states || [])[0];
  if (state) {
    html += `<div class="tiles">
      ${tile("Mean Rate", "--rate", signed(state.x, 1), "s/d", "")}
      ${tile("Largest Difference", "--rate", num(state.d_rate, 1), "s/d", "between positions")}
      ${tile("Mean Amplitude", "--amplitude", num(state.amplitude_mean, 0), "°", Number.isFinite(state.dvh_amplitude) ? `vertical minus horizontal ${signed(state.dvh_amplitude, 0)}°` : "")}
    </div>`;
  }
  const cell = (v, digits, sign) => `<td>${sign ? signed(v, digits) : num(v, digits)}</td>`;
  html += `<div class="card"><h2>Positions</h2><table><thead><tr><th>Position</th><th>Rate, s/d</th><th>Amplitude, °</th><th>Beat Error, ms</th><th>Wind, h</th></tr></thead><tbody>`;
  readings.forEach((r) => {
    const m = r.measurement || {};
    const pos = POSITIONS[r.position] || [r.position, r.position];
    const heard = m.watch_heard !== false;
    html += `<tr><td>${esc(pos[1])} <span style="color:var(--text3)">${esc(pos[0])}</span></td>` +
      (heard ? cell(m.rate_s_per_day, 1, true) + cell(m.amplitude_deg, 0) +
        cell(abs(Number.isFinite(m.beat_error_unlock_ms) ? m.beat_error_unlock_ms : m.beat_error_ms), 2)
        : `<td colspan="3" style="text-align:center;color:var(--text2)">No regular beat found</td>`) +
      `<td>${esc(r.wind_h == null ? 0 : r.wind_h)}</td></tr>`;
  });
  html += `</tbody></table></div>`;
  if (limits && limits.length) html += limitsCard(limits);
  const heard = readings.filter((r) => r.measurement && r.measurement.watch_heard !== false);
  if (heard.length) {
    const name = (r) => (POSITIONS[r.position] || [r.position, r.position])[1];
    const rate = heard.map((r) => ({ label: name(r), value: r.measurement.rate_s_per_day }));
    const amp = heard.map((r) => ({ label: name(r), value: r.measurement.amplitude_deg }));
    if (rate.every((r) => Number.isFinite(r.value))) html += `<div class="card"><h2>Rate by Position</h2><p class="hint">Each position's rate</p>${bars(rate, "--rate", " s/day", 1)}</div>`;
    if (amp.every((r) => Number.isFinite(r.value))) html += `<div class="card"><h2>Amplitude by Position</h2><p class="hint">Each position's amplitude</p>${bars(amp, "--amplitude", "°", 0)}</div>`;
  }
  return html;
}

// Horizontal bars from zero, one per position, on a plot area wide enough
// for every bar and its value.
//   rows: [{label, value}]
function bars(rows, color, unit, decimals) {
  const W = chartWidth(), rowH = 26, T = 4, B = 20, R = 6;
  const fmt = (v) => (v > 0 && unit !== "°" ? "+" : "") + v.toFixed(decimals) + unit;
  const L = Math.ceil(12 + 7 * Math.max(...rows.map((r) => r.label.length)));
  const plotW = W - L - R, plotH = rowH * rows.length;
  let lo = 0, hi = 0;
  for (const r of rows) {
    lo = Math.min(lo, r.value); hi = Math.max(hi, r.value);
  }
  if (!(hi > lo)) hi = lo + 1;
  // Room inside the plot for the values beside the bars' ends.
  const labelW = 10 + CHAR_W * Math.max(...rows.map((r) => fmt(r.value).length));
  const padL = rows.some((r) => r.value < 0) ? labelW : 8;
  const padR = rows.some((r) => r.value >= 0) ? labelW : 8;
  // The data plus 15% of its span on each side a bar ends, and room for
  // the values beside the bars' ends.
  const span = hi - lo, neg = lo < 0, pos = hi > 0;
  const fl = neg ? 0.15 : 0, fr = pos ? 0.15 : 0;
  const k = Math.min(
    (plotW - padL - padR) / span,
    (plotW - padR) / (span * (1 + fl)),
    (plotW - padL) / (span * (1 + fr)),
    plotW / (span * (1 + fl + fr)));
  const d0 = lo - Math.max(padL / k, fl * span), d1 = d0 + plotW / k;
  const sx = (v) => L + (v - d0) * k;
  const area = plotArea(L, T, plotW, plotH);
  let g = area.svg, inside = "";
  const grid = gridFor(d0, d1, plotW, 70);
  for (const v of grid.ticks) {
    inside += `<line class="grid" x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${T + plotH}"/>`;
    const t = axisLabel(v, grid.step, unit);
    const anchor = sx(v) + t.length * CHAR_W / 2 > W ? "end" : "middle";
    g += `<text x="${sx(v)}" y="${T + plotH + 15}" text-anchor="${anchor}">${esc(t)}</text>`;
  }
  inside += `<line class="zero" x1="${sx(0)}" x2="${sx(0)}" y1="${T}" y2="${T + plotH}"/>`;
  rows.forEach((r, i) => {
    const y = T + i * rowH, v = r.value;
    const x0 = Math.min(sx(0), sx(v)), w = Math.max(2, Math.abs(sx(v) - sx(0)));
    g += `<text x="${L - 8}" y="${y + rowH / 2 + 4}" text-anchor="end" style="fill:var(--text)">${esc(r.label)}</text>`;
    inside += `<rect x="${x0}" y="${y + 6}" width="${w}" height="${rowH - 12}" rx="3" fill="var(${color})"><title>${esc(r.label)}: ${esc(fmt(v))}</title></rect>`;
    const right = v >= 0;
    inside += `<text x="${right ? sx(v) + 5 : sx(v) - 5}" y="${y + rowH / 2 + 4}" text-anchor="${right ? "start" : "end"}" style="fill:var(--text)">${esc(fmt(v))}</text>`;
  });
  g += `<g clip-path="url(#${area.id})">${inside}</g>`;
  return `<svg viewBox="0 0 ${W} ${T + plotH + B}" width="${W}" height="${T + plotH + B}" role="img">${g}</svg>`;
}

// What limits the readings: the server's sentences from the caveats, each
// with the positions it is about when not every one.
function limitsCard(limits) {
  return `<div class="card"><h2>What Limits These Readings</h2><ul class="findings limits">${limits.map((l) => `<li>${l.where ? `<b>${esc(l.where)}</b> ` : ""}${esc(l.text)}</li>`).join("")}</ul></div>`;
}

function profileView(doc) {
  const name = fileName(doc);
  return `<h1>Tick and Tock</h1><p class="sub">${esc(name)}</p>${profileCard(doc, "Tick and Tock Profiles")}`;
}

// ---- Steadiness (the app's Steadiness pane, steady.rs) --------------------

const STEADY_VIEWS = [
  ["readings", "Readings", "Every reading in time order, with the stretches of constant level the change finder split them into, and the two levels when there are two states"],
  ["periods", "Periods", "How strongly the readings repeat at each period, from the period search: a peak above the dashed line is a real cycle, labelled with the wheel whose turn it matches"],
  ["cycle", "Cycle", "The readings folded at the cycle the tests found: every cycle's readings as dots, and their median shape as the line"],
  ["autocorrelation", "Autocorrelation", "How much each reading resembles the one a lag later: independent readings stay inside the dashed band; a rise back to a peak means they repeat"],
  ["allan", "Allan Deviation", "The scatter of averages over each averaging time, against the dashed line independent readings would follow: wander and drift lift the curve at long times, a cycle puts a bump near half its period. Both axes are logarithmic"],
  ["cusum", "CUSUM", "The running sum of each reading's distance from the mean: independent readings stay inside the dashed lines; a step in the level bends it into a V or a tent, with the corner at the step"],
  ["spectrum", "FFT", "The plain amplitude spectrum of each series, like Witschi's FFT: the size of the sine wave at each period, in the series' own units (the rate's in milliseconds of beat timing), with the wheels' periods marked. Both axes are logarithmic"],
];
// A series' amplitude spectrum from the document's spectra[], if any.
function spectrumOf(doc, s) {
  return (doc.spectra || []).find((x) => x.series === s.series && x.period_s && x.period_s.length > 1) || null;
}
const SERIES = {
  rate: ["Rate", "--rate", " s/d"],
  amplitude: ["Amplitude", "--amplitude", "°"],
  beat_error: ["Beat Error", "--beat-error", " ms"],
};
let steadyView = null;

// steady::secs: "45 s", "12 min", "2.5 h".
function secs(t) {
  return t < 120 ? `${t.toFixed(0)} s` : t < 7200 ? `${(t / 60).toFixed(0)} min` : `${(t / 3600).toFixed(1)} h`;
}
// steady::lag_text: "30 s" under a minute, then m:ss.
function lagText(t) { return Math.abs(t) < 59.5 ? `${t.toFixed(0)} s` : fmtTime(t); }
// steady::sig: about three significant figures.
function sig(v) {
  if (v === 0 || !Number.isFinite(v)) return "0";
  const d = Math.max(0, 2 - Math.floor(Math.log10(Math.abs(v))));
  const t = v.toFixed(d);
  return t.includes(".") ? t.replace(/0+$/, "").replace(/\.$/, "") : t;
}
function pText(p) { return p < 1e-300 ? "<1e-300" : p < 0.001 ? p.toExponential(0).replace("e-", "e-") : p.toFixed(3); }
function wheelTitle(name) { return String(name).split(" ").map((w) => w.charAt(0).toUpperCase() + w.slice(1)).join(" "); }
// steady::value_text and plain: decimals from the step, no "-0".
function stepText(v, step, unit) {
  const d = step >= 1 ? 0 : step >= 0.1 ? 1 : step >= 0.01 ? 2 : 3;
  if (Math.abs(v) < step * 1e-6) v = 0;
  return v.toFixed(d) + (unit || "");
}
// steady::log_grid and log_label: every decade, with 2 and 5 inside each
// (labelled only when less than two decades show) when fewer than three show.
function logTicks(lo, hi, fmt) {
  const fine = hi - lo < 3, ticks = [];
  for (let k = Math.floor(lo) - 1; k <= Math.ceil(hi); k++) {
    for (const m of [1, 2, 5]) {
      if (!fine && m !== 1) continue;
      const v = k + Math.log10(m);
      if (v >= lo - 1e-9 && v <= hi + 1e-9) ticks.push([v, m === 1 || hi - lo < 2 ? fmt(Math.pow(10, v)) : ""]);
    }
  }
  return ticks;
}
function linTicks(lo, hi, px, minPx, fmt, ladder) {
  const g = gridFor(lo, hi, px, minPx, ladder);
  return g.ticks.map((v) => [v, fmt(v, g.step)]);
}

// A plot as the steadiness views draw theirs: an x and a y scale with their
// own tick labels, and lines, dots, rules and notes, all inside the plot.
//   x, y: [lo, hi]; xTicks(lo, hi, plotW), yTicks(lo, hi, plotH): [[v, label]]
//   hlines: [{y, color, dash}]; vlines: [{x, color, label, left}]
//   lines: [{pts, color, width, dash}]; dots: [{pts, color, r}]
//   notes: [{x, y, text, above}] beside a point; corner: {text, top}
function xyChart(o) {
  const W = chartWidth(), H = o.height || 150, T = 4, B = 20, R = 6;
  const plotH = H - T - B;
  const [x0, x1] = o.x, [y0, y1] = o.y;
  const yt = o.yTicks(y0, y1, plotH);
  const L = Math.max(54, Math.ceil(10 + CHAR_W * Math.max(3, ...yt.map(([, t]) => t.length))));
  const plotW = W - L - R;
  const xt = o.xTicks(x0, x1, plotW);
  const sx = (x) => L + (x - x0) / (x1 - x0) * plotW;
  const sy = (y) => T + (y1 - y) / (y1 - y0) * plotH;
  const area = plotArea(L, T, plotW, plotH);
  let g = area.svg, inside = "";
  for (const [v, t] of yt) {
    inside += `<line class="grid" x1="${L}" x2="${L + plotW}" y1="${sy(v)}" y2="${sy(v)}"/>`;
    if (t) g += `<text x="${L - 5}" y="${sy(v) + 4}" text-anchor="end">${esc(t)}</text>`;
  }
  for (const [v, t] of xt) {
    inside += `<line class="grid" x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${T + plotH}"/>`;
    if (!t) continue;
    const anchor = sx(v) - t.length * CHAR_W / 2 < L - 8 ? "start" : sx(v) + t.length * CHAR_W / 2 > W ? "end" : "middle";
    g += `<text x="${sx(v)}" y="${H - 5}" text-anchor="${anchor}">${esc(t)}</text>`;
  }
  const dash = (d) => d ? ` stroke-dasharray="${DASH[d]}"` : "";
  for (const h of o.hlines || []) {
    inside += `<line x1="${L}" x2="${L + plotW}" y1="${sy(h.y)}" y2="${sy(h.y)}" stroke="var(${h.color})" stroke-width="1"${dash(h.dash)}/>`;
  }
  // Each rule's name beside it, on its left when asked, else its right;
  // a name with no room inside the plot, or over another, is left off.
  const taken = [];
  for (const v of o.vlines || []) {
    inside += `<line x1="${sx(v.x)}" x2="${sx(v.x)}" y1="${T}" y2="${T + plotH}" stroke="var(${v.color})" stroke-width="1"/>`;
    if (!v.label) continue;
    const w = v.label.length * CHAR_W;
    let a = v.left ? sx(v.x) - 3 - w : sx(v.x) + 3;
    if (a < L + 2 || a + w > L + plotW - 2) a = v.left ? sx(v.x) + 3 : sx(v.x) - 3 - w;
    if (a < L + 2 || a + w > L + plotW - 2 || taken.some(([p, q]) => a < q + 4 && a + w > p - 4)) continue;
    taken.push([a, a + w]);
    inside += `<text x="${a}" y="${T + 12}">${esc(v.label)}</text>`;
  }
  for (const d of o.dots || []) {
    inside += `<g fill="var(${d.color})">${d.pts.filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y))
      .map(([x, y]) => `<circle cx="${sx(x).toFixed(1)}" cy="${sy(y).toFixed(1)}" r="${d.r}"/>`).join("")}</g>`;
  }
  for (const l of o.lines || []) {
    let d = "", pen = false;
    for (const [x, y] of l.pts) {
      if (!Number.isFinite(x) || !Number.isFinite(y)) { pen = false; continue; }
      d += `${pen ? "L" : "M"}${sx(x).toFixed(1)},${sy(y).toFixed(1)}`;
      pen = true;
    }
    inside += `<path d="${d}" fill="none" stroke="var(${l.color})" stroke-width="${l.width || 1.5}"${dash(l.dash)} stroke-linejoin="round"/>`;
  }
  for (const m of o.marks || []) {
    inside += `<circle cx="${sx(m.x)}" cy="${sy(m.y)}" r="3.5" fill="var(${m.color})"/>`;
  }
  // steady::mark_label: beside the point, on the side that keeps it inside.
  for (const n of o.notes || []) {
    const right = n.x > (x0 + x1) / 2;
    inside += `<text x="${sx(n.x) + (right ? -8 : 8)}" y="${sy(n.y) + (n.above ? -6 : 14)}" text-anchor="${right ? "end" : "start"}" style="fill:var(--text)">${esc(n.text)}</text>`;
  }
  if (o.corner) {
    inside += `<text x="${L + plotW - 6}" y="${o.corner.top ? T + 13 : T + plotH - 6}" text-anchor="end">${esc(o.corner.text)}</text>`;
  }
  g += `<g clip-path="url(#${area.id})">${inside}</g>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(o.title || "")}">${g}</svg></div>`;
}

function steadyNote(text) { return `<p class="empty">${esc(text)}</p>`; }

// One series' plot under the chosen view.
function steadyPlot(s, view, doc) {
  const [, color, unit] = SERIES[s.series] || ["", "--text", ""];
  const time = (px) => (lo, hi, w) => linTicks(lo, hi, w, Math.max(Math.min(80, w / 4), px), (v) => v);
  const v = s.views || {};
  switch (view) {
    case "readings": {
      const r = v.readings;
      if (!r || !r.t_s || r.t_s.length < 2) return steadyNote("No readings to draw.");
      const pts = r.t_s.map((t, i) => [t, r.values[i]]).filter(([, y]) => Number.isFinite(y));
      const [lo, hi] = spreadRange(pts.map((p) => p[1]));
      const segs = s.changes && s.changes.segments && s.changes.segments.length > 1 ? s.changes.segments : [];
      const ts = s.two_state && s.two_state.two_levels ? s.two_state : null;
      return xyChart({
        title: "Readings", x: [Math.min(...r.t_s), Math.max(...r.t_s)], y: [lo, hi],
        xTicks: (a, b, w) => linTicks(a, b, w, Math.min(80, w / 4), (t) => fmtTime(t), TIME_STEPS),
        yTicks: (a, b, h) => linTicks(a, b, h, 24, (y, st) => stepText(y, st, unit)),
        dots: [{ pts, color, r: 1.4 }],
        lines: segs.map((g) => ({ pts: [[g.start_s, g.mean], [g.end_s, g.mean]], color: "--text", width: 1.8 })),
        hlines: ts ? [ts.low, ts.high].map((y) => ({ y, color: "--text", dash: "loose" })) : [],
      });
    }
    case "periods": {
      const p = v.search;
      if (!p || !p.period_s || !p.period_s.length) return steadyNote("The period search needs a longer session.");
      const pts = p.period_s.map((t, i) => [t > 0 ? Math.log10(t) : NaN, p.score[i]]).filter(([x, y]) => Number.isFinite(x) && Number.isFinite(y));
      const span = doc.period_span || [Math.min(...pts.map((q) => q[0])), Math.max(...pts.map((q) => q[0]))];
      if (!(span[1] > span[0])) return steadyNote("The period search needs a longer session.");
      const top = Math.max(p.threshold, ...pts.map((q) => q[1])) * 1.15;
      const wheels = (doc.input && doc.input.settings && doc.input.settings.named_wheels) || [];
      const vlines = wheels.filter((w) => w.period_s > 0).map((w) => {
        const x = Math.log10(w.period_s);
        const twin = wheels.some((o) => o !== w && o.name === w.name && o.period_s > w.period_s);
        return { x, color: "--text3", label: wheelTitle(w.name), left: twin };
      }).filter((l) => l.x > span[0] && l.x < span[1]);
      const marks = [], notes = [];
      if (s.period && s.period.period_s > 0) {
        const x = Math.log10(s.period.period_s);
        const near = pts.reduce((a, q) => Math.abs(q[0] - x) < Math.abs(a[0] - x) ? q : a, pts[0]);
        marks.push({ x, y: near[1], color });
        notes.push({ x, y: near[1], text: secs(s.period.period_s) + (s.period.wheel ? `, ${wheelTitle(s.period.wheel)}` : "") });
      }
      return xyChart({
        title: "Periods", x: span, y: [0, top],
        xTicks: (a, b) => logTicks(a, b, secs),
        yTicks: (a, b, h) => linTicks(a, b, h, 24, (y) => y.toFixed(0)),
        vlines, hlines: [{ y: p.threshold, color: "--text2", dash: "loose" }],
        lines: [{ pts, color, width: 1.5 }], marks, notes,
      });
    }
    case "cycle": {
      const f = v.fold;
      if (!f || !f.profile || !f.profile.length) return steadyNote("No cycle found: nothing repeats in these readings.");
      const bins = f.profile.length, at = (b) => (b + 0.5) / bins * f.period_s;
      const dots = [];
      for (const row of f.raster || []) row.forEach((y, b) => { if (Number.isFinite(y)) dots.push([at(b), y]); });
      const shape = f.profile.map((y, b) => [at(b), y]);
      const [lo, hi] = spreadRange(dots.length ? dots.map((q) => q[1]) : shape.map((q) => q[1]));
      const n = f.cycles || (f.raster || []).length;
      let label;
      if (f.from === "own") {
        const w = (s.cycle && s.cycle.wheel) || (s.period && s.period.wheel);
        label = `${secs(f.period_s)} cycle${w ? `, ${wheelTitle(w)}` : ""}, ${n} cycles folded`;
      } else if (SERIES[f.from]) {
        label = `Folded at the ${SERIES[f.from][0].toLowerCase()}'s ${secs(f.period_s)} cycle, ${n} cycles`;
      } else {
        label = `Folded at the ${String(f.wheel || "wheel").toLowerCase()}'s ${secs(f.period_s)} turn, ${n} cycles`;
      }
      return xyChart({
        title: "Cycle", x: [0, f.period_s], y: [lo, hi],
        xTicks: (a, b, w) => linTicks(a, b, w, Math.min(80, w / 4), (t) => lagText(t), TIME_STEPS),
        yTicks: (a, b, h) => linTicks(a, b, h, 24, (y, st) => stepText(y, st, unit)),
        dots: [{ pts: dots, color: "--text3", r: 1.2 }],
        lines: [{ pts: shape, color, width: 2 }],
        corner: { text: label },
      });
    }
    case "autocorrelation": {
      const a = s.autocorrelation;
      if (!a || !a.lag_s) return steadyNote("Too few readings for the autocorrelation.");
      const pts = a.lag_s.map((l, i) => [l, a.r[i]]).filter(([, r]) => Number.isFinite(r));
      const xHi = pts.length ? pts[pts.length - 1][0] : 1;
      const lo = Math.min(-0.2, -a.band, ...pts.map((q) => q[1]));
      const marks = [], notes = [];
      if (Number.isFinite(a.repeat_lag_s) && Number.isFinite(a.repeat_r)) {
        marks.push({ x: a.repeat_lag_s, y: a.repeat_r, color });
        notes.push({ x: a.repeat_lag_s, y: a.repeat_r, text: `repeats at ${secs(a.repeat_lag_s)}` });
      }
      return xyChart({
        title: "Autocorrelation", x: [0, xHi], y: [lo - 0.05, 1.35],
        xTicks: (p, q, w) => linTicks(p, q, w, Math.min(80, w / 4), (t) => lagText(t), TIME_STEPS),
        yTicks: (p, q, h) => linTicks(p, q, h, 24, (y, st) => stepText(y, st)),
        hlines: [{ y: 0, color: "--text3" }, { y: a.band, color: "--text2", dash: "loose" }, { y: -a.band, color: "--text2", dash: "loose" }],
        lines: [{ pts, color, width: 1.5 }], marks, notes,
        corner: Number.isFinite(a.p_value) ? { text: `Ljung–Box p = ${pText(a.p_value)}`, top: true } : null,
      });
    }
    case "spectrum": {
      const sp = spectrumOf(doc, s);
      if (!sp) return steadyNote("The spectrum needs a longer session.");
      const pts = sp.period_s.map((t, i) => [t, sp.amplitude[i]])
        .filter(([t, a]) => t > 0 && a > 0 && Number.isFinite(a))
        .map(([t, a]) => [Math.log10(t), Math.log10(a)]);
      if (pts.length < 2) return steadyNote("The spectrum needs a longer session.");
      const x = [Math.min(...pts.map((q) => q[0])), Math.max(...pts.map((q) => q[0]))];
      const yLo = Math.min(...pts.map((q) => q[1])), yHi = Math.max(...pts.map((q) => q[1]));
      // Room above the tallest line for the wheels' names, as in the app.
      const y = [yLo, yHi + Math.max(yHi - yLo, 0.5) * 0.25];
      const u = sp.unit === "deg" ? "°" : " ms";
      const size = (v) => sig(v) + u;
      const wheels = (doc.input && doc.input.settings && doc.input.settings.named_wheels) || [];
      const vlines = wheels.filter((w) => w.period_s > 0).map((w) => {
        const wx = Math.log10(w.period_s);
        const twin = wheels.some((o) => o !== w && o.name === w.name && o.period_s > w.period_s);
        return { x: wx, color: "--text3", label: wheelTitle(w.name), left: twin };
      }).filter((l) => l.x > x[0] && l.x < x[1]);
      const peak = pts.reduce((a, q) => (q[1] > a[1] ? q : a), pts[0]);
      return xyChart({
        title: "FFT", x, y,
        xTicks: (p, q) => logTicks(p, q, secs),
        yTicks: (p, q) => logTicks(p, q, size),
        vlines, lines: [{ pts, color, width: 1.5 }],
        marks: [{ x: peak[0], y: peak[1], color }],
        notes: [{ x: peak[0], y: peak[1], text: `tallest at ${secs(Math.pow(10, peak[0]))}: ${size(Math.pow(10, peak[1]))}` }],
      });
    }
    case "allan": {
      const a = s.allan;
      if (!a || !a.tau_s) return steadyNote("Too few readings for the Allan deviation.");
      const both = (vals) => a.tau_s.map((t, i) => [t, vals[i]]).filter(([t, d]) => t > 0 && d > 0 && Number.isFinite(d)).map(([t, d]) => [Math.log10(t), Math.log10(d)]);
      const dev = both(a.deviation), white = both(a.white || []);
      const all = dev.concat(white);
      if (!dev.length) return steadyNote("Too few readings for the Allan deviation.");
      const pad = (lo, hi) => { const p = Math.max((hi - lo) * 0.05, 0.05); return [lo - p, hi + p]; };
      const x = pad(Math.min(...all.map((q) => q[0])), Math.max(...all.map((q) => q[0])));
      const y = pad(Math.min(...all.map((q) => q[1])), Math.max(...all.map((q) => q[1])));
      const notes = [];
      if (a.best_tau_s > 0 && a.best_deviation > 0) {
        notes.push({ x: Math.log10(a.best_tau_s), y: Math.log10(a.best_deviation), text: `least scatter at ${secs(a.best_tau_s)}: ${sig(a.best_deviation)}${unit}` });
      }
      return xyChart({
        title: "Allan Deviation", x, y,
        xTicks: (p, q) => logTicks(p, q, secs),
        yTicks: (p, q) => logTicks(p, q, (d) => sig(d) + unit),
        lines: [{ pts: white, color: "--text2", width: 1, dash: "loose" }, { pts: dev, color, width: 1.5 }],
        dots: [{ pts: dev, color, r: 2 }], notes,
      });
    }
    case "cusum": {
      const c = s.cusum;
      if (!c || !c.t_s) return steadyNote("Too few readings for the CUSUM.");
      const pts = c.t_s.map((t, i) => [t, c.s[i]]).filter(([, y]) => Number.isFinite(y));
      const m = Math.max(1.6, ...pts.map((q) => Math.abs(q[1]))) * 1.1;
      const marks = [], notes = [];
      if (c.max > 1.36 && pts.length) {
        const near = pts.reduce((a, q) => Math.abs(q[0] - c.at_s) < Math.abs(a[0] - c.at_s) ? q : a, pts[0]);
        marks.push({ x: c.at_s, y: near[1], color });
        notes.push({ x: c.at_s, y: near[1], text: `level changes near ${fmtTime(c.at_s)}`, above: near[1] >= 0 });
      }
      return xyChart({
        title: "CUSUM", x: [Math.min(...pts.map((q) => q[0])), Math.max(...pts.map((q) => q[0]))], y: [-m, m],
        xTicks: (p, q, w) => linTicks(p, q, w, Math.min(80, w / 4), (t) => fmtTime(t), TIME_STEPS),
        yTicks: (p, q, h) => linTicks(p, q, h, 24, (y, st) => stepText(y, st)),
        hlines: [{ y: 0, color: "--text3" }, { y: 1.36, color: "--text2", dash: "loose" }, { y: -1.36, color: "--text2", dash: "loose" }],
        lines: [{ pts, color, width: 1.5 }], marks, notes,
      });
    }
  }
  return "";
}

// steady::spread: the 1st to 99th percentile, padded 12%.
function spreadRange(values) {
  const v = values.filter(Number.isFinite).sort((a, b) => a - b);
  if (v.length < 2) return v.length ? [v[0] - 1, v[0] + 1] : [0, 1];
  const q = (f) => v[Math.round((v.length - 1) * f)];
  const lo = q(0.01), hi = q(0.99), pad = Math.max((hi - lo) * 0.12, 1e-3);
  return [lo - pad, hi + pad];
}

// The statistics behind a series' headline, as the JSON gives them.
function steadyStats(s) {
  const u = s.unit === "deg" ? "°" : s.unit ? ` ${s.unit}` : "";
  const parts = [`${s.readings} readings of ${num(s.step_s, 0)} s`];
  if (Number.isFinite(s.median)) parts.push(`median ${num(s.median, 2)}${u}`);
  if (Number.isFinite(s.sd)) parts.push(`SD ${num(s.sd, 2)}${u}`);
  if (Number.isFinite(s.short_term_sd)) parts.push(`reading to reading ${num(s.short_term_sd, 2)}${u}`);
  const a = s.autocorrelation;
  if (a && Number.isFinite(a.p_value)) parts.push(`Ljung–Box p ${pText(a.p_value)}`);
  if (s.allan && Number.isFinite(s.allan.max_excess)) parts.push(`Allan up to ${num(s.allan.max_excess, 1)}× the independent line`);
  if (s.trend && Number.isFinite(s.trend.per_hour)) parts.push(`trend ${s.trend.per_hour >= 0 ? "+" : ""}${num(s.trend.per_hour, 2)}${u} per hour`);
  return parts.join(" · ");
}

function steadinessCard(doc) {
  const series = doc.series || [];
  if (!series.length) return "";
  const has = { readings: (s) => s.views && s.views.readings, periods: (s) => s.views && s.views.search, cycle: (s) => s.views && s.views.fold, spectrum: (s) => spectrumOf(doc, s) };
  const offered = STEADY_VIEWS.filter(([key]) => !has[key] || series.some(has[key]));
  if (!offered.some(([k]) => k === steadyView)) steadyView = offered[0][0];
  // A series too short for the tests has no autocorrelation: no plot.
  const tested = (s) => !!s.autocorrelation;
  const drawn = series.some(tested);
  const [, , hint] = STEADY_VIEWS.find(([k]) => k === steadyView);
  const status = Number.isFinite(doc.duration_s) ? `Tested over ${fmtTime(doc.duration_s)} of beats` : "";
  const rows = series.map((s) => {
    const [title] = SERIES[s.series] || [s.series];
    return `<p class="series-name">${esc(title)}</p>
      <p class="headline">${esc(s.headline || "")}</p>
      <p class="stats">${esc(steadyStats(s))}</p>
      ${tested(s) ? steadyPlot(s, steadyView, doc) : ""}`;
  }).join("");
  return `<div class="card"><h2>Steadiness</h2><p class="hint">How the rate, amplitude and beat error each move over the session: what was detected in each (a cycle, two levels, level changes, a trend, or none), with the statistics behind it</p>
    ${drawn ? `<div class="seg" role="group" aria-label="View">${offered.map(([key, label]) => `<button data-steady="${key}" aria-pressed="${key === steadyView}">${esc(label)}</button>`).join("")}</div>
    <p class="hint">${esc(hint)}</p>` : ""}<p class="sub off">${esc(status)}</p>${rows}</div>`;
}

function wireSteadiness(root) {
  for (const b of root.querySelectorAll("button[data-steady]")) {
    b.addEventListener("click", () => { steadyView = b.dataset.steady; redraw(); });
  }
}

// ---- Distributions on probability paper (the app's Distribution panes) ----

// histogram::normal_quantile (Acklam), the normal score of a share.
function normalQuantile(p) {
  if (!(p > 0 && p < 1)) return p <= 0 ? -Infinity : Infinity;
  const A = [-3.969683028665376e1, 2.209460984245205e2, -2.759285104469687e2, 1.38357751867269e2, -3.066479806614716e1, 2.506628277459239];
  const B = [-5.447609879822406e1, 1.615858368580409e2, -1.556989798598866e2, 6.680131188771972e1, -1.328068155288572e1];
  const C = [-7.784894002430293e-3, -3.223964580411365e-1, -2.400758277161838, -2.549732539343734, 4.374664141464968, 2.938163982698783];
  const D = [7.784695709041462e-3, 3.224671290700398e-1, 2.445134137142996, 3.754408661907416];
  const tail = (q) => (((((C[0] * q + C[1]) * q + C[2]) * q + C[3]) * q + C[4]) * q + C[5])
    / ((((D[0] * q + D[1]) * q + D[2]) * q + D[3]) * q + 1);
  if (p < 0.02425) return tail(Math.sqrt(-2 * Math.log(p)));
  if (p > 1 - 0.02425) return -tail(Math.sqrt(-2 * Math.log(1 - p)));
  const q = p - 0.5, r = q * q;
  return (((((A[0] * r + A[1]) * r + A[2]) * r + A[3]) * r + A[4]) * r + A[5]) * q
    / (((((B[0] * r + B[1]) * r + B[2]) * r + B[3]) * r + B[4]) * r + 1);
}

// The app's PROBABILITY_MARKS, percent.
const PROBABILITY_MARKS = [[0.1, "0.1%"], [1, "1%"], [5, "5%"], [10, "10%"], [25, "25%"],
  [50, "50%"], [75, "75%"], [90, "90%"], [95, "95%"], [99, "99%"], [99.9, "99.9%"]];
const DISTRIBUTIONS = {
  rate: ["Rate Distribution", "--rate", " s/day",
    "The rate readings on probability paper: one steady rate falls on a straight line, two states bend it"],
  amplitude: ["Amplitude Distribution", "--amplitude", "°",
    "The amplitude readings on probability paper: a balance swinging between a high and a low state bends the line"],
  beat_error: ["Beat Error Distribution", "--beat-error", " ms",
    "The beat error readings, from the unlock, on probability paper"],
};

// A distribution as the app draws it: each value against the normal score of
// its rank, (rank + ½) / n (the document's points), with the dashed line one
// steady state would follow.
function probabilityChart(e, color, unit) {
  const W = chartWidth(), H = 190, T = 4, B = 20, R = 6;
  const n = e.n, x0 = e.edges[0], x1 = e.edges[e.edges.length - 1];
  if (!(n >= 2) || !(x1 > x0)) return `<p class="empty">Not enough readings yet.</p>`;
  const zTop = Math.min(normalQuantile(1 - 0.5 / Math.max(n, 2)), 3.3) + 0.25;
  const plotH = H - T - B;
  // From 50% outwards, leaving out a share whose label would crowd the one before it.
  const pxPerZ = plotH / (2 * zTop);
  const kept = [];
  for (const [pc, label] of PROBABILITY_MARKS.slice(5)) {
    const z = normalQuantile(pc / 100);
    if (z <= zTop && (!kept.length || (z - kept[kept.length - 1][0]) * pxPerZ >= 16)) kept.push([z, label]);
  }
  const ylab = [];
  for (const [z, label] of kept) {
    ylab.push([z, label]);
    if (z !== 0) ylab.push([-z, PROBABILITY_MARKS[10 - PROBABILITY_MARKS.findIndex(([, l]) => l === label)][1]]);
  }
  const L = Math.max(44, Math.ceil(10 + CHAR_W * Math.max(3, ...ylab.map(([, t]) => t.length))));
  const plotW = W - L - R;
  // Room between the value labels, which carry the unit.
  const wide = Math.max(...[x0, x1].map((v) => axisLabel(v, (x1 - x0) / 20, unit).length));
  const xg = gridFor(x0, x1, plotW, Math.max(Math.min(80, plotW / 4), wide * CHAR_W + 14));
  const sx = (x) => L + (x - x0) / (x1 - x0) * plotW;
  const sy = (z) => T + (zTop - z) / (2 * zTop) * plotH;
  const area = plotArea(L, T, plotW, plotH);
  let g = area.svg, inside = "";
  for (const [z, t] of ylab) {
    inside += `<line class="grid" x1="${L}" x2="${L + plotW}" y1="${sy(z)}" y2="${sy(z)}"/>`;
    g += `<text x="${L - 5}" y="${sy(z) + 4}" text-anchor="end">${esc(t)}</text>`;
  }
  for (const v of xg.ticks) {
    inside += `<line class="grid" x1="${sx(v)}" x2="${sx(v)}" y1="${T}" y2="${T + plotH}"/>`;
    const t = axisLabel(v, xg.step, unit);
    const anchor = sx(v) - t.length * CHAR_W / 2 < L - 8 ? "start" : sx(v) + t.length * CHAR_W / 2 > W ? "end" : "middle";
    g += `<text x="${sx(v)}" y="${H - 5}" text-anchor="${anchor}">${esc(t)}</text>`;
  }
  const line = e.normal_line;
  if (line && Number.isFinite(line.centre) && Number.isFinite(line.spread)) {
    inside += `<line x1="${sx(line.centre - line.spread * zTop)}" y1="${sy(-zTop)}" x2="${sx(line.centre + line.spread * zTop)}" y2="${sy(zTop)}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="${DASH.loose}"/>`;
  }
  let dots = "";
  for (const [x, z] of e.points || []) {
    if (x < x0 || x > x1 || !Number.isFinite(z)) continue;
    dots += `<circle cx="${sx(x).toFixed(1)}" cy="${sy(z).toFixed(1)}" r="1.6"/>`;
  }
  inside += `<g fill="var(${color})">${dots}</g>`;
  g += `<g clip-path="url(#${area.id})">${inside}</g>`;
  return `<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="${esc(e.series)} on probability paper">${g}</svg></div>`;
}

// The three Distribution panes, from the readings (the app's default).
function distributionCards(d) {
  const all = (d && d.overall) || [];
  return ["rate", "amplitude", "beat_error"].map((key) => {
    const e = all.find((x) => x.series === key && x.values === "readings");
    if (!e) return "";
    const [title, color, unit, hint] = DISTRIBUTIONS[key];
    return `<div class="card"><h2>${title}</h2><p class="hint">${hint}</p>
      <p class="sub caption">${esc(e.summary || "")}</p>${probabilityChart(e, color, unit)}</div>`;
  }).join("");
}

function seriesView(doc, extra) {
  // The server sends what only the charts draw beside the document.
  if (extra) {
    doc = JSON.parse(JSON.stringify(doc));
    (doc.series || []).forEach((s, i) => { if (extra.views && extra.views[i]) s.views = extra.views[i]; });
    if (extra.period_span) doc.period_span = extra.period_span;
    if (extra.spectra) doc.spectra = extra.spectra;
    const all = (doc.distributions && doc.distributions.overall) || [];
    all.forEach((e, i) => { if (extra.points && extra.points[i]) e.points = extra.points[i]; });
  }
  const name = fileName(doc);
  const len = Number.isFinite(doc.duration_s) ? ` · ${timeLabel(doc.duration_s)}` : "";
  return `<h1>Long Recording</h1><p class="sub">${esc(name)}${len}</p>${steadinessCard(doc)}${distributionCards(doc.distributions)}`;
}

// ---- Live: a take as it is heard ------------------------------------------
//
// While record_position records, the view asks the server for the latest
// readings (recording_status, a tool for the view alone) about once a
// second, from when the chat app says the call has started (tool-input)
// until its result arrives. A chat app that does not pass the view's calls
// on leaves the progress messages in the chat to say how far it has got.

const COMMON = { DU: "Dial Up", DD: "Dial Down", CU: "Crown Up", CD: "Crown Down", CL: "Crown Left", CR: "Crown Right" };
function positionName(p) { return COMMON[p] || p || ""; }

let live = null;

function toolInput(args) {
  // Only a recording has a live view; the other tools draw their result.
  if (typeof args.position !== "string" || typeof args.folder !== "string") return;
  if (live && live.timer) clearTimeout(live.timer);
  live = { position: args.position, seconds: Number.isFinite(args.seconds) ? args.seconds : 120, doc: null, failures: 0, seen: false };
  last = null;
  redraw();
  pollLive();
}

function withTimeout(promise, ms) {
  return Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(new Error("timeout")), ms))]);
}

function pollLive() {
  const mine = live;
  if (!mine) return;
  mine.timer = null;
  withTimeout(request("tools/call", { name: "recording_status", arguments: {} }), 5000).then((r) => {
    if (live !== mine || last) return;
    const d = r && r.structuredContent;
    mine.failures = 0;
    if (d && d.recording) { mine.doc = d.schema && d.recorded_s != null ? d : mine.doc; mine.seen = true; }
    redraw();
    // Until the take has ended; before it starts, the call may still be on its way.
    if (!(d && d.recording === false && mine.seen)) mine.timer = setTimeout(pollLive, 1000);
  }).catch(() => {
    if (live !== mine || last) return;
    if (++mine.failures < 3) mine.timer = setTimeout(pollLive, 2000);
    else { mine.unavailable = true; redraw(); }
  });
}

// The trend a live file carries, as the charts over time take it.
function trendStrip(t) {
  if (!t || !t.t_s) return null;
  const pts = (ys) => (ys || []).map((y, i) => [t.t_s[i], y == null ? NaN : y]).filter(([, y]) => Number.isFinite(y));
  // The beat error as a size, as the take's check gives it: the live and
  // the whole-take measures do not agree on its sign.
  const size = (ys) => pts(ys).map(([x, y]) => [x, Math.abs(y)]);
  return { rate: pts(t.rate), amplitude: pts(t.amplitude), beat_error_unlock: size(t.beat_error) };
}

// strip::wrap: fold into [-half, half).
function wrapMs(x, half) { return ((x + half) % (2 * half) + 2 * half) % (2 * half) - half; }

// The app's paper strip lying on its side (strip.rs, horizontal): time left
// to right with the newest beats on the right, early beats towards the top,
// one dot per beat, Tick blue and Tock orange, ±10 ms wide and wrapping as
// on a Witschi diagram. A watch on time draws a level line; one that gains
// rises to the right.
function liveStrip(d) {
  const s = (d && d.strip) || {};
  const beats = s.beats || [];
  const span = s.span_s || 30, half = 10;
  const end = Math.max((d && d.recorded_s) || 0, span), start = end - span;
  const W = chartWidth(), H = 170, T = 4, B = 20, R = 6, L = 50;
  const plotW = W - L - R, plotH = H - T - B;
  const sx = (t) => L + (t - start) / span * plotW;
  const sy = (ms) => T + (half - ms) / (2 * half) * plotH;
  const area = plotArea(L, T, plotW, plotH);
  let g = area.svg, inside = "";
  const yg = gridFor(-half, half, plotH, 26);
  for (const v of yg.ticks) {
    if (v > -half && v < half) inside += `<line class="grid" x1="${L}" x2="${L + plotW}" y1="${sy(v)}" y2="${sy(v)}"/>`;
    // The ends are left for "Early" and "Late".
    if (Math.min(sy(v) - T, T + plotH - sy(v)) > 14) g += `<text x="${L - 5}" y="${sy(v) + 4}" text-anchor="end">${esc(axisLabel(v, yg.step, " ms"))}</text>`;
  }
  g += `<text x="${L - 5}" y="${T + 10}" text-anchor="end">Early</text><text x="${L - 5}" y="${T + plotH}" text-anchor="end">Late</text>`;
  const xg = gridFor(start, end, plotW, Math.min(90, plotW / 4), TIME_STEPS);
  for (const t of xg.ticks) {
    if (t < -1e-9) continue;
    inside += `<line class="grid" x1="${sx(t)}" x2="${sx(t)}" y1="${T}" y2="${T + plotH}"/>`;
    const label = fmtTime(t);
    const anchor = sx(t) - label.length * CHAR_W / 2 < L - 8 ? "start" : sx(t) + label.length * CHAR_W / 2 > W ? "end" : "middle";
    g += `<text x="${sx(t)}" y="${H - 5}" text-anchor="${anchor}">${label}</text>`;
  }
  const shown = beats.filter(([t]) => t >= start);
  const perPx = shown.length / Math.max(1, plotW);
  const radius = Math.min(2.2, Math.max(0.8, 2.2 / Math.sqrt(Math.max(perPx, 1))));
  for (const [t, lead, side] of shown) {
    inside += `<circle cx="${sx(t).toFixed(1)}" cy="${sy(wrapMs(lead, half)).toFixed(1)}" r="${radius}" fill="var(${side ? "--tock" : "--tick"})"/>`;
  }
  g += `<g clip-path="url(#${area.id})">${inside}</g>`;
  if (!shown.length) g += `<text x="${L + plotW / 2}" y="${T + plotH / 2 + 4}" text-anchor="middle">Listening…</text>`;
  const key = `<div class="legend above"><span><span class="swatch dot" style="background:var(--tick)"></span>Tick</span><span><span class="swatch dot" style="background:var(--tock)"></span>Tock</span></div>`;
  return `<div class="card"><h2>Paper Strip</h2><p class="hint">The last ${num(span, 0)} s of beats: a watch on time draws a level line, one that gains rises to the right</p>${key}<div class="chart"><svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Paper strip">${g}</svg></div></div>`;
}

function liveView(l) {
  const d = l.doc || {};
  const r = d.reading || {};
  const total = Number.isFinite(d.seconds) ? d.seconds : l.seconds;
  const at = Number.isFinite(d.recorded_s) ? d.recorded_s : 0;
  const line = d.done ? "Done: the watch can be moved" : `${fmtTime(at)} of ${fmtTime(total)} · keep the watch still`;
  let html = `<h1>Live</h1><p class="sub">${esc(positionName(d.position || l.position))} · ${esc(line)}</p>`;
  html += `<div class="bar"><div style="width:${Math.min(100, 100 * at / Math.max(1, total)).toFixed(1)}%"></div></div>`;
  if (l.unavailable) {
    html += `<div class="card notice"><b>No Live Readings Here</b>This chat app does not pass the view's requests on while it records. The chat says how far it has got, and the readings show here when the take is done.</div>`;
  }
  const heard = r.beats_used > 0;
  const wait = "Listening…";
  const be = Number.isFinite(r.beat_error_unlock_ms) ? r.beat_error_unlock_ms : r.beat_error_ms;
  html += `<div class="tiles">
    ${tile("Rate", "--rate", heard ? signed(r.rate_s_per_day, 1) : "–", "seconds per day", heard ? `${num(d.average_s, 0)} s average` : wait)}
    ${tile("Amplitude", "--amplitude", heard ? num(r.amplitude_deg, 0) : "–", heard && Number.isFinite(r.amplitude_error_deg) ? `± ${Math.max(1, Math.round(r.amplitude_error_deg))}°` : "", heard ? "" : wait, "°")}
    ${tile("Beat Error", "--beat-error", heard ? num(abs(be), 2) : "–", "milliseconds", heard ? (Number.isFinite(r.beat_error_unlock_ms) ? "from the unlock" : "from the drop") : wait)}
    ${tile("Beats Heard", "", esc(d.beats_heard || 0), "", heard ? `${esc(r.beats_used)} in the last ${num(r.span_s, 0)} s` : wait)}
  </div>`;
  if (r.clipped_fraction > 0.01) html += `<div class="card notice"><b>Clipping</b>${num(r.clipped_fraction * 100, 0)}% of beats are clipped.</div>`;
  html += liveStrip(d);
  html += stripCards(trendStrip(d.trend));
  return html;
}

// record_position's result: the take's quick check, with the readings over
// time as they were heard when there was a live view.
function recordView(doc, heard) {
  const c = doc.check || {};
  const name = positionName(doc.position);
  let html = `<h1>${esc(name)}</h1><p class="sub">${timeLabel(doc.seconds)} recorded · ${esc(c.bph)} beats per hour${Number.isFinite(doc.wind_h) ? ` · ${num(doc.wind_h, 0)} h after full wind` : ""}</p>`;
  // record/2 adds every take; its sound is stated as facts beside it.
  if (doc.session_file) {
    html += `<p class="hint">Added to the test in ${esc(String(doc.session_file).split(/[\\/]/).slice(-2, -1)[0] || doc.session_file)}. The watch can be moved.</p>`;
  }
  const clipped = c.clipping && c.clipping.beats > 0 ? `${num(c.clipping.beat_fraction * 100, 1)}% of beats were clipped.` : "";
  if (c.watch_heard === false) {
    html += `<div class="card notice"><b>No Regular Beat</b>${esc(noRegularBeat({ jitter_us: Number.isFinite(c.timing_scatter_ms) ? c.timing_scatter_ms * 1000 : null }, c.bph))}${clipped ? ` ${clipped}` : ""}</div>`;
    return html;
  }
  if (clipped) html += `<div class="card notice"><b>Clipping</b>${clipped}</div>`;
  html += `<div class="tiles">
    ${tile("Rate", "--rate", signed(c.rate_s_per_day, 1), "seconds per day", "a quick look; the test's report has the reading")}
    ${tile("Amplitude", "--amplitude", num(c.amplitude_deg, 0), "", "", "°")}
    ${tile("Beat Error", "--beat-error", num(abs(c.beat_error_ms), 2), "milliseconds", "from the unlock")}
    ${tile("Beats", "", esc(c.beats_found), "", `of ${esc(c.beats_expected)} expected`)}
  </div>`;
  html += stripCards(heard && trendStrip(heard.trend));
  return html;
}

// ---- Dispatch -------------------------------------------------------------

let last = null;

function render(result) {
  if (live && live.timer) { clearTimeout(live.timer); live.timer = null; }
  last = result;
  redraw();
}

function redraw() {
  const root = document.getElementById("root");
  if (!last && !live) return;
  charts.clear();
  if (!last) {
    lastWidth = root.clientWidth;
    root.innerHTML = liveView(live);
    wireCharts(root);
    return;
  }
  const doc = last.structuredContent;
  const extra = last._meta && last._meta["timegrapher/charts"];
  const limits = last._meta && last._meta["timegrapher/limits"];
  let html;
  if (last.isError || !doc || !doc.schema) {
    const text = (last.content || []).map((c) => c.text || "").join("\n");
    html = `<div class="card notice"><b>No Reading</b>${esc(text || "The tool returned nothing to draw.")}</div>`;
  } else if (doc.schema.startsWith("timegrapher.analyze/")) {
    html = recordingView(doc, extra, limits);
  } else if (doc.schema.startsWith("timegrapher.session/")) {
    html = sessionView(doc, limits);
  } else if (doc.schema.startsWith("timegrapher.profile/")) {
    html = profileView(doc);
  } else if (doc.schema.startsWith("timegrapher.series/")) {
    html = seriesView(doc, extra);
  } else if (doc.schema.startsWith("timegrapher.record/")) {
    html = recordView(doc, live && live.doc);
  } else {
    html = `<p class="empty">Nothing to draw for ${esc(doc.schema)}.</p>`;
  }
  lastWidth = root.clientWidth;
  root.innerHTML = html;
  wireCharts(root);
  wireSteadiness(root);
}
</script>
</body>
</html>
