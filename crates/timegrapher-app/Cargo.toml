[package]
name = "timegrapher-app"
description = "Desktop timegrapher: live trace, rate, amplitude and beat error"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "timegrapher-app"
path = "src/main.rs"

[dependencies]
timegrapher-core = { workspace = true, features = ["capture", "update-check"] }
eframe = { version = "0.33", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
egui_tiles = "0.14"
egui_plot = "0.34"
rfd = "0.15"
claxon = "0.4"
hound = "3.5"
