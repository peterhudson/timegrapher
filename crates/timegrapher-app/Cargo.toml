[package]
name = "timegrapher-app"
description = "Desktop timegrapher: live trace, rate, amplitude and beat error"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "timegrapher-app"
path = "src/main.rs"

[dependencies]
timegrapher-core = { workspace = true, features = ["capture", "update-check"] }
eframe = { version = "0.33", features = ["persistence", "wgpu"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
toml_edit = "0.22"
egui_tiles = "0.14"
egui_plot = "0.34"
rfd = "0.15"
claxon = "0.4"
hound = "3.5"
png = "0.18"
# Watch photos, as thumbnails: JPEG, PNG and TIFF (the last two already
# in eframe's copy), and HEIC, as an iPhone takes them, in pure Rust.
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff"] }
heic-rs = { version = "0.1.4", default-features = false, features = ["std"] }
# Take folders are named by the local time a take started.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Keeping the computer awake during a take (see src/awake.rs), with
# crates the lock already holds.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSProcessInfo", "NSString", "NSObject"] }

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }
