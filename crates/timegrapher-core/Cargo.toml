[package]
name = "timegrapher-core"
description = "Per-beat signal processing for mechanical watch timing"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
claxon = "0.4"
hound = "3.5"
realfft = "3.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The gzip of an analysis-only take's files.
flate2 = "1"
# The FLAC encoder for excerpts, single-threaded (excerpts are short).
flacenc = { version = "0.5", default-features = false }
sha2 = "0.10"
# A library's library.toml and each watch's watch.toml.
toml = "0.8"
# Stored and deflated entries only: what a report bundle is written as, or
# becomes when someone unpacks it and zips it again.
zip = { version = "2.4", default-features = false, features = ["deflate"] }
cpal = { version = "0.17", optional = true }
ureq = { version = "3", optional = true, features = ["platform-verifier"] }

[features]
# Sound input devices (links ALSA on Linux, CoreAudio, WASAPI).
capture = ["dep:cpal"]
# The update check (`update::check`): one HTTPS request to GitHub.
update-check = ["dep:ureq"]
