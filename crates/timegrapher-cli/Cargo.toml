[package]
name = "timegrapher-cli"
description = "Command-line analysis of watch recordings"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "timegrapher"
path = "src/main.rs"

[dependencies]
timegrapher-core.workspace = true
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
toml = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

[features]
default = ["live", "update-check"]
# Sound input (the `devices` command and live `doctor`). Needs the ALSA
# development package on Linux (libasound2-dev).
live = ["timegrapher-core/capture"]
# `timegrapher update`: one HTTPS request to GitHub for the latest release.
update-check = ["timegrapher-core/update-check"]

[lints]
workspace = true
