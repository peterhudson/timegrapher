<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="840" height="330" font-family="Helvetica, Arial, sans-serif" font-size="13">
<title>The six test positions</title>
<rect x="0.5" y="0.5" width="839" height="329" rx="10" fill="#ffffff" stroke="#dcdce1"/>
<text x="24" y="32" font-size="16" font-weight="bold" fill="#1d1d1f">The six positions, in the order the Positions Test uses them</text>
