name: CI

# Every push to main and every pull request runs every job and reports the
# eight required checks. A pull
# request that only edits or adds Markdown nothing compiles in or tests read,
# user-guide screenshots or guide figure descriptions
# is a light run (.github/ci/changes.py): every job still runs and reports,
# the test jobs run only their offline Python tests, the three regress jobs
# skip their corpus and engine steps, and mcp-renderer runs as usual. The
# watchmaker skill and the docs the MCP server compiles in always run in full. A pull request that
# changes a page the downloads carry also runs Release's render and link
# check of those pages, in the ubuntu test job. A pull request whose other
# changes are all inside the app's crate or the MCP server's is a narrow
# run (#2443): every job still runs and reports, the test jobs build and
# test only that crate's packages (clippy too, and no doc tests, which only
# core's library has), and only that crate's corpus check runs; the other
# two regress jobs skip their steps, as in a light run. Core, the CLI, build
# files, ci.yml and anything outside the crates test everything
# (.github/ci/changes.py). Pushes to main always run everything.
#
# A draft pull request runs none of that: each push to a draft runs one
# quick Linux job, `quick (ubuntu-24.04)` (fmt, clippy and the core crate's
# tests). None of the eight required checks passes there: mcp-renderer
# reports "skipped", and the other seven are matrix jobs, which GitHub
# never makes when skipped, so it shows them as expected. GitHub never merges a draft, so that lets no merge through. The
# whole suite runs when the pull request is marked ready for review, and on
# each push while it is ready (#2444). Turning a ready pull request back
# into a draft starts no run: a run there would put "skipped" over the
# head's real results, which read as passing once it is ready again. Its
# next push cancels any full run still going. A pull request opened ready,
# as outside contributors' are, runs the whole suite on every push.
#
# Whether a run is a draft's is read live, by the first job, `mode`, not
# from the event: an event can carry the pull request as it was a few
# seconds before. Marking a PR ready 3 s after a push (#2368, 27 Nov) gave a
# ready_for_review event still naming the old head, which this run's
# concurrency then cancelled, and a synchronize event for the new head that
# still said draft, so the new head ran only `quick` and no required check
# ever reported.
on:
  push:
    branches: [main]
  pull_request:
    # The default three, plus marking a draft ready, which starts the full
    # suite. Not converted_to_draft (the comment above).
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

# A newer push to a PR cancels that PR's run still in progress, so runners go
# to the PR's newest head only. Main's push run is never cancelled: it
# finishes, the newest merge waits behind it, and GitHub drops any older run
# still waiting in the group (#2528; cancelling it left 7 of 8 main runs
# unfinished). A run started by hand (workflow_dispatch) has a group of its own
# and is never cancelled. The Release gate needs a green run on the exact
# commit it builds, which is main's newest commit when a release starts
# (docs/reference/install.md).
concurrency:
  group: ci-${{ github.event.pull_request.number || (github.event_name == 'push' && 'main') || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Draft or ready, read live (the comment at the top and
  # .github/ci/pr_mode.sh). Off a pull request everything runs.
  mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      full: ${{ steps.mode.outputs.full }}
      quick: ${{ steps.mode.outputs.quick }}
      linux: ${{ steps.runner.outputs.linux }}
    steps:
      # Only the scripts: release.yml's mode job runs pr_mode.sh too.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: |
            .github/ci/pr_mode.sh
            .github/ci/linux_runner.sh
          sparse-checkout-cone-mode: false
      - name: Draft or ready
        id: mode
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          EVENT_DRAFT: ${{ github.event.pull_request.draft }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash .github/ci/pr_mode.sh
      # The runner for the heavy Linux jobs (test-linux, quick, regress):
      # Peter's workstation when the code is ours and one of its runners is
      # online, else GitHub's (.github/ci/linux_runner.sh, agents#48). A
      # fork's pull request runs on GitHub's runners. A fork could still
      # name the workstation in its own copy of this file, so the runners'
      # job-started hook (.github/self-hosted/job-started.sh) refuses its
      # jobs there too. The jobs' names, and so the required checks, are
      # the same on either.
      - name: Linux runner
        id: runner
        env:
          # The token only for our own code (the same test as TRUSTED).
          GH_TOKEN: ${{ (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]')) && secrets.RUNNER_STATUS_TOKEN || '' }}
          TRUSTED: ${{ github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.head.repo.fork && github.event.pull_request.user.login != 'dependabot[bot]') }}
          SWITCH: ${{ vars.SELF_HOSTED_LINUX }}
          REPO: ${{ github.repository }}
        run: bash .github/ci/linux_runner.sh

  test:
    name: test (${{ matrix.os }}${{ matrix.part && format(' {0}', matrix.part) || '' }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        # Linux's and macOS's tests run in test-linux and test-macos
        # below, with these same steps.
        # Windows runs its tests as two halves on two runners (nextest's
        # --partition), as `test (windows-latest 1/2)` and `2/2`: its job
        # finished last in 17 of 33 green PR runs on 2-3 Nov, about 13
        # minutes, 5 of them a CPU-bound test run (#907). Each half builds
        # the tests (about 4 minutes) and runs half of them. Only 1/2 runs
        # fmt, clippy and the doc tests, and saves the rust cache.
        part: ['']
        exclude:
          - os: windows-latest
            part: ''
        include:
          - os: windows-latest
            part: 1/2
          - os: windows-latest
            part: 2/2
    # Every job below but `quick` runs only off a draft (the comment at the
    # top), and this anchor names the rule for all of them.
    needs: mode
    if: &full-suite ${{ needs.mode.outputs.full == 'true' }}
    runs-on: ${{ matrix.os }}
    # Time limits count from when a runner starts the job, not the queue, and
    # sit above the slowest recent run so a hung job fails within the hour
    # instead of GitHub's six. The CI watchdog does not re-run a job that
    # hits one.
    timeout-minutes: 45
    # No debug info in CI's release builds, as release.yml already builds the
    # downloads (Cargo.toml's [profile.release] keeps debug = 1 for local
    # builds). Measured locally, a warm build of the tests was about 9%
    # faster and the target folder under half the size.
    # rust-cache keys on CARGO_* variables, so this gets a cache of its own.
    # The Linux job also checks integer overflow, which release builds
    # otherwise skip, so an overflow a test reaches panics here as it would
    # in a debug build (usbclock.rs at a low sample rate went unseen). It
    # costs no extra job; the other platforms keep plain release builds.
    env: &test-env
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: ${{ matrix.os == 'ubuntu-24.04' && 'true' || 'false' }}
    # test-linux and test-macos run these same steps (a YAML alias of this list).
    steps: &test-steps
      # Two commits: on a pull request, GitHub's merge commit and its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # On the workstation's runners (agents#48): keep the build folder,
      # and the corpus audio, outside the cleaned workspace.
      - name: Warm build folder (self-hosted)
        if: runner.environment == 'self-hosted'
        run: bash .github/ci/self_hosted_prep.sh
      - name: Full or light run
        id: changes
        shell: bash
        run: python3 .github/ci/changes.py "${{ github.event_name }}" HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
      # Offline tests of the publishing gate; keep its eight-job/step contract
      # in .github/scripts/release_ci_gate.py synchronized with this workflow.
      - name: Release CI gate tests (offline)
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_ci_gate.py' -v
      - name: CI watchdog tests (offline)
        run: python3 -m unittest discover -s .github/watchdog -p 'test_ci_watchdog.py' -v
      - name: Packaging script tests (offline)
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Light-run rule tests (offline)
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v
      # A pull request that changes README, LICENSE, docs/ or the watchmaker
      # skill runs release.yml's render and link check of the downloads'
      # pages, so what would fail there fails here, not at the next draft.
      - name: Documentation pages
        if: runner.os == 'Linux' && matrix.part != '2/2' && steps.changes.outputs.pages == 'true'
        env:
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          command -v pandoc >/dev/null || .github/ci/apt-install.sh pandoc
          pandoc --version | head -1
          for p in linux macos windows; do
            python3 packaging/docs_html.py render "$RUNNER_TEMP/docs-html/$p" "$p" --ref "$REF"
            python3 packaging/docs_html.py check "$RUNNER_TEMP/docs-html/$p"
          done
      # Exercise the supported compiler floor without another build/job.
      # Keep this version aligned with workspace.package.rust-version and
      # docs/developer/building.md. Other hosts continue checking current stable.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.full != 'false'
        with:
          toolchain: ${{ matrix.os == 'ubuntu-24.04' && '1.90.0' || 'stable' }}
          components: rustfmt, clippy
      # One cache key for each OS, as before Linux and macOS had jobs of
      # their own: the key otherwise names the job, and a new key would add a
      # cache while the repository's sit near GitHub's 10 GB limit.
      # Not on the workstation, whose build folder stays warm on its own.
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.full != 'false' && runner.environment == 'github-hosted'
        with:
          shared-key: test
          save-if: ${{ matrix.part != '2/2' }}
      - name: ALSA headers for sound input
        if: runner.os == 'Linux' && steps.changes.outputs.full != 'false'
        run: .github/ci/apt-install.sh libasound2-dev
      - run: cargo fmt --check
        if: matrix.part != '2/2' && steps.changes.outputs.full != 'false'
      - run: cargo clippy --locked --all-targets ${{ steps.changes.outputs.packages }} -- -D warnings
        if: matrix.part != '2/2' && steps.changes.outputs.full != 'false'
      # nextest runs the tests of every test program side by side, one to
      # a core, where cargo test runs the programs one after another (about
      # 7 of the job's 12 minutes on 1 Nov). Each test runs in a process
      # of its own. It does not run doc tests, so cargo test runs those.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.changes.outputs.full != 'false'
        with:
          tool: cargo-nextest@0.9.148
      - name: Tests
        if: steps.changes.outputs.full != 'false'
        # The MCP server's end-to-end tests run the `timegrapher` program
        # this build makes, not each building it again with cargo in a
        # folder of its own: nextest starts every test in a process of its
        # own, so each of them ran that build, about 80 s apiece on Windows
        # (#804). Not TIMEGRAPHER_CLI, which also turns on the corpus and
        # edge-take comparisons the regress checks run.
        env:
          TIMEGRAPHER_MCP_TEST_CLI: ${{ github.workspace }}/target/release/timegrapher${{ runner.os == 'Windows' && '.exe' || '' }}
        # On a pull request, macOS and Windows leave out the heaviest
        # pure-maths tests, which Linux runs (.config/nextest.toml, #1755).
        # Pushes to main run every test on all three.
        # The halves are nextest's slice partition: the whole list of tests,
        # in order, taken alternately. count shares out each test program on
        # its own, so every program with one test or an odd number put its
        # extra test in 1/2: on #2344's run (45883121136) Linux's 1/2 had
        # 4,737 test-seconds to 2/2's 2,665, and Linux's 1/2 ran its tests
        # longer than 2/2 in 92 of 111 green full runs of 25-26 Nov. Sliced,
        # that run's tests share out 4,084 to 3,318 on Linux and 2,909 to
        # 2,800 on Windows (#2441).
        # A narrow run (the comment at the top) names its packages here.
        run: cargo nextest run --locked --release --no-fail-fast ${{ steps.changes.outputs.packages }} ${{ matrix.part && format('--partition slice:{0}', matrix.part) || '' }} ${{ github.event_name == 'pull_request' && runner.os != 'Linux' && '--profile pr-off-linux' || '' }}
      # Test times: nextest's JUnit report (.config/nextest.toml), kept for
      # 7 days, failed tests included, so each test's time on each platform
      # can be read later (#2490, for #2442). One artifact per job, named
      # by its OS and half (1 or 2).
      - name: Test times
        if: ${{ !cancelled() && steps.changes.outputs.full != 'false' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-times-${{ matrix.os }}-${{ matrix.part == '2/2' && '2' || '1' }}
          path: target/nextest/*/junit.xml
          retention-days: 7
          if-no-files-found: warn
          # A re-run job (by hand or the CI watchdog) replaces its report.
          overwrite: true
      # Only core's library has doc tests, and a narrow run never tests core.
      - name: Doc tests
        if: matrix.part != '2/2' && steps.changes.outputs.full != 'false' && steps.changes.outputs.packages == ''
        run: cargo test --locked --release --doc
      # Unused dependencies and libraries' licences (architecture guide,
      # section 12; deny.toml). Each takes seconds.
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: runner.os == 'Linux' && matrix.part != '2/2' && steps.changes.outputs.full != 'false'
        with:
          tool: cargo-machete@0.9.2,cargo-deny@0.20.2
      - name: Unused dependencies
        if: runner.os == 'Linux' && matrix.part != '2/2' && steps.changes.outputs.full != 'false'
        run: cargo machete
      - name: Licences and bans
        if: runner.os == 'Linux' && matrix.part != '2/2' && steps.changes.outputs.full != 'false'
        run: cargo deny --all-features check licenses bans

  # Linux's tests as two halves on two runners, like Windows's, as
  # `test (ubuntu-24.04 1/2)` and `2/2`. The whole set had grown to about
  # 37 minutes of a CPU-bound test run on one runner (main at 0c63103: a
  # 45-minute job; #2207), near the 45-minute limit. Each half builds the
  # tests and runs half of them; only 1/2 runs fmt, clippy, the doc tests
  # and the Linux-only checks, and saves the rust cache.
  test-linux:
    name: test (${{ matrix.os }} ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        part: [1/2, 2/2]
    needs: mode
    if: *full-suite
    # The workstation or ubuntu-24.04 (the mode job); the name stays
    # `test (ubuntu-24.04 1/2)` on either.
    runs-on: ${{ fromJSON(needs.mode.outputs.linux) }}
    permissions:
      contents: read
    timeout-minutes: 45
    env: *test-env
    steps: *test-steps

  # The required check `test (ubuntu-24.04)` (branch protection, and the
  # Release gate's .github/scripts/release_ci_gate.py): green only when
  # both of Linux's halves are. `!cancelled()` runs it after a failed half
  # too, so it fails then. When the run is cancelled it never runs, and
  # GitHub marks it cancelled, not skipped (a skipped required check would
  # count as a pass), so the cancelled head still shows no green check.
  # It used to run on a pull request even then; it waited for a runner,
  # and the PR's next run waited for it in the same concurrency group for
  # 7 to 40 minutes (#2455). Main stopped that on 25 Nov (6bedbea).
  # On a draft it is skipped with its halves (the comment at the top): run,
  # it would fail on their "skipped". It is a one-entry matrix so that a
  # skipped run of it is never named `test (ubuntu-24.04)`: GitHub names a
  # skipped matrix job by its unexpanded name. Once the PR is ready, this
  # check is only made when both halves end, about 30 minutes in, and until
  # then a draft run's "skipped" under the required name would read as
  # passing.
  test-linux-result:
    name: test (${{ matrix.os }})
    needs: test-linux
    if: ${{ !cancelled() && needs.test-linux.result != 'skipped' }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both halves passed
        env:
          RESULT: ${{ needs.test-linux.result }}
        run: |
          echo "Linux tests, both halves: $RESULT"
          test "$RESULT" = success

  # macOS's tests as two halves, as Linux's are, as `test (macos-latest
  # 1/2)` and `2/2`. Once Linux's were split it was the slowest job: on
  # 25 Nov a pull request's test run took 25 to 27 minutes after a 7-minute
  # build (35 minutes of 45), and main, which runs every test on macOS,
  # took 39 at 0c63103. Only 1/2 runs fmt, clippy and the doc tests, and
  # saves the rust cache.
  test-macos:
    name: test (${{ matrix.os }} ${{ matrix.part }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        part: [1/2, 2/2]
    needs: mode
    if: *full-suite
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env: *test-env
    steps: *test-steps

  # The required check `test (macos-latest)`, as test-linux-result is
  # Linux's, and runs when that does: it passes only when both halves did.
  # A one-entry matrix for the same reason as test-linux-result.
  test-macos-result:
    name: test (${{ matrix.os }})
    needs: test-macos
    if: ${{ !cancelled() && needs.test-macos.result != 'skipped' }}
    strategy:
      matrix:
        os: [macos-latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both halves passed
        env:
          RESULT: ${{ needs.test-macos.result }}
        run: |
          echo "macOS tests, both halves: $RESULT"
          test "$RESULT" = success

  # A one-entry matrix, as the test summaries are: made after `mode`, it
  # must not be skipped under its required name on a draft.
  mcp-renderer:
    name: ${{ matrix.job }}
    strategy:
      matrix:
        job: [mcp-renderer]
    needs: mode
    if: *full-suite
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # Main's full history for the silent-revert check below: commits and
      # trees only, file contents just for the checked-out commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          filter: blob:none
      # A pull request may not put a file back to an older version on main
      # unless its body names the revert (`Reverts #N`); .github/ci/reverts.py.
      # Seconds. The body is read live, so a re-run after adding the line
      # sees it (a re-run reuses the event, whose body is the old one); if
      # the API can't be reached, the event's body is used.
      - name: Silent reverts
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}
          EVENT_BODY: ${{ github.event.pull_request.body }}
        run: |
          if ! body="$(gh api "$PR_URL" --jq '.body // ""')"; then
            echo "Could not read the PR body live; using the event's."
            body="$EVENT_BODY"
          fi
          PR_BODY="$body" python3 .github/ci/reverts.py HEAD^1 HEAD
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - run: node --test crates/timegrapher-mcp/tests/*.test.cjs
      # Copied product blocks must match the baseline (.github/ci/literal_ratchet.py;
      # architecture guide, section 12). Uses this job's Node for jscpd.
      - name: Copied code
        run: python3 .github/ci/literal_ratchet.py copies

  # The one job a draft pull request runs on each push (the comment at the
  # top): what most often fails first, on one Linux runner, while the
  # reviews go on. It tests core, or a narrow run's packages. Not a
  # required check, and never run off a draft.
  # It builds as Linux's test halves do (same toolchain and CARGO_*
  # settings), so it restores their rust cache; it saves none, as the
  # repository's caches sit near GitHub's 10 GB limit.
  quick:
    name: quick (ubuntu-24.04)
    needs: mode
    if: ${{ needs.mode.outputs.quick == 'true' }}
    runs-on: ${{ fromJSON(needs.mode.outputs.linux) }}
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      CARGO_PROFILE_RELEASE_OVERFLOW_CHECKS: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # On the workstation's runners (agents#48): keep the build folder,
      # and the corpus audio, outside the cleaned workspace.
      - name: Warm build folder (self-hosted)
        if: runner.environment == 'self-hosted'
        run: bash .github/ci/self_hosted_prep.sh
      - name: Full or light run
        id: changes
        shell: bash
        run: python3 .github/ci/changes.py "${{ github.event_name }}" HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
      - name: Release CI gate tests (offline)
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_ci_gate.py' -v
      - name: CI watchdog tests (offline)
        run: python3 -m unittest discover -s .github/watchdog -p 'test_ci_watchdog.py' -v
      - name: Packaging script tests (offline)
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Light-run rule tests (offline)
        run: python3 -m unittest discover -s .github/ci -p 'test_*.py' -v
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.full != 'false'
        with:
          toolchain: '1.90.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.full != 'false' && runner.environment == 'github-hosted'
        with:
          shared-key: test
          save-if: false
      - name: ALSA headers for sound input
        if: steps.changes.outputs.full != 'false'
        run: .github/ci/apt-install.sh libasound2-dev
      - run: cargo fmt --check
        if: steps.changes.outputs.full != 'false'
      - run: cargo clippy --locked --all-targets ${{ steps.changes.outputs.packages }} -- -D warnings
        if: steps.changes.outputs.full != 'false'
      - uses: taiki-e/install-action@86f7a0ffb25f40114606501a311ebcfaf882ea32 # v2.88.0
        if: steps.changes.outputs.full != 'false'
        with:
          tool: cargo-nextest@0.9.148
      # Core's tests, or a narrow run's packages (the comment at the top).
      - name: Core tests
        if: steps.changes.outputs.full != 'false'
        run: cargo nextest run --locked --release --no-fail-fast ${{ steps.changes.outputs.packages || '-p timegrapher-core' }}

  # The public corpus's takes (docs/developer/regress.md), read three ways side by
  # side, each in its own job so none waits for another:
  #   engine: the engine against tg and the baseline, plus its smoke takes,
  #           and the analyze/session equivalence on real takes.
  #   app:    each take opened as the app opens it reads what
  #           `timegrapher session` reads (#514).
  #   mcp:    each sound file read through the MCP server's
  #           analyze_recording reads what `timegrapher session` reads.
  # The audio is downloaded from the corpus's releases, checked by SHA-256
  # and cached between runs.
  regress:
    name: regress (${{ matrix.check }})
    strategy:
      fail-fast: false
      matrix:
        check: [engine, app, mcp]
    needs: mode
    if: *full-suite
    runs-on: ${{ fromJSON(needs.mode.outputs.linux) }}
    permissions:
      contents: read
    # Above the longest step's own limit plus about 6 minutes of setup,
    # so a hung job still fails within the hour (#2028).
    timeout-minutes: 60
    env:
      # As in the test job: no debug info in CI's release builds.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      # Reviewed with the engine baseline; update through docs/developer/regress.md.
      CORPUS_REVISION: 14b5e38d0aa954bf2c2c5ebb9f374a1f97ab6af1
      TIMEGRAPHER_CORPUS: ${{ github.workspace }}/corpus
      TIMEGRAPHER_REQUIRE_CORPUS: "1"
      TIMEGRAPHER_CLI: ${{ github.workspace }}/target/release/timegrapher
    steps:
      # Two commits: on a pull request, GitHub's merge commit and its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      # On the workstation's runners (agents#48): keep the build folder,
      # and the corpus audio, outside the cleaned workspace.
      - name: Warm build folder (self-hosted)
        if: runner.environment == 'self-hosted'
        run: bash .github/ci/self_hosted_prep.sh
      # full=false also when a narrow run (the comment at the top) does not
      # need this check.
      - name: Full or light run
        id: changes
        shell: bash
        run: python3 .github/ci/changes.py "${{ github.event_name }}" HEAD^1 HEAD --regress "${{ matrix.check }}" | tee -a "$GITHUB_OUTPUT"
      # Metadata in git, audio in releases: no secret, so this also runs on
      # pull requests from forks.
      - name: Check out the corpus
        if: steps.changes.outputs.full != 'false'
        uses: actions/checkout@v7
        with:
          repository: peterhudson/timegrapher-corpus
          ref: ${{ env.CORPUS_REVISION }}
          path: corpus
          fetch-depth: 1
          persist-credentials: false
      - name: Record corpus inputs
        if: steps.changes.outputs.full != 'false'
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          actual = subprocess.check_output(["git", "-C", "corpus", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["CORPUS_REVISION"]:
              raise SystemExit(f"corpus checkout {actual} differs from the reviewed revision")
          manifest = hashlib.sha256(pathlib.Path("corpus/corpus.json").read_bytes()).hexdigest()
          report = (f"Engine revision: `{os.environ['GITHUB_SHA']}`\n\n"
                    f"Corpus revision: `{actual}`\n\n"
                    f"corpus.json SHA-256: `{manifest}`\n\n")
          print(report, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report)
          PY
      # The audio cache is a 7.1 GB archive at f85f586 and is unpacked
      # beside itself, which a runner's free disk (about 14 GB) no longer
      # always holds: a regress job at 9d89326 failed restoring it with "No
      # space left on device". The runner image's Android SDK, .NET and
      # CodeQL bundle, which these jobs never use, make room.
      - name: Make disk room for the corpus audio
        if: steps.changes.outputs.full != 'false' && runner.environment == 'github-hosted'
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
      # The workstation keeps its own copy of the audio instead
      # (.github/ci/self_hosted_audio.py), so the next step's links are free.
      - name: Corpus audio cache
        id: audio
        if: steps.changes.outputs.full != 'false' && runner.environment == 'github-hosted'
        uses: actions/cache@v6
        with:
          path: |
            corpus/takes/**/*.flac
          key: corpus-audio-${{ hashFiles('corpus/corpus.json') }}
          restore-keys: corpus-audio-
      - name: Corpus audio kept on the workstation
        if: steps.changes.outputs.full != 'false' && runner.environment == 'self-hosted'
        run: python3 .github/ci/self_hosted_audio.py restore "$TG_CACHE/corpus-audio" corpus/takes
      # A cache from an older corpus.json can hold files the corpus has
      # since renamed; a take read as a whole folder would read them too.
      - name: Drop cached audio the corpus no longer lists
        if: steps.changes.outputs.full != 'false'
        run: |
          python3 - <<'PY'
          import json, pathlib
          c = json.load(open("corpus/corpus.json"))
          keep = {f"{t['id']}/{f['name']}" for t in c["takes"] for f in t["files"]}
          for p in pathlib.Path("corpus/takes").glob("*/*.flac"):
              if f"{p.parent.name}/{p.name}" not in keep:
                  print(f"removing stale {p}")
                  p.unlink()
          PY
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.full != 'false'
      # The three checks share one cache, the one the single regress job
      # kept before they were split (the repository's caches are near
      # GitHub's 10 GB limit with the corpus audio). Only the app check,
      # which builds the most, saves it.
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.full != 'false' && runner.environment == 'github-hosted'
        with:
          shared-key: regress
          save-if: ${{ matrix.check == 'app' }}
      - name: Build
        if: steps.changes.outputs.full != 'false'
        run: cargo build --locked --release -p timegrapher-cli --no-default-features
      - name: Engine against tg and the baseline
        if: matrix.check == 'engine' && steps.changes.outputs.full != 'false'
        run: |
          set -o pipefail
          ./target/release/timegrapher regress corpus --fetch --smoke --baseline regress/baseline.json --quiet | tee regress.txt
      # The engine check fetches any audio the cache did not hold. On a cache
      # miss (a new corpus revision) the app and MCP checks fetch it the same
      # way, by running the engine check with its report discarded, so this
      # step fails there too if the engine check does.
      - name: Fetch the corpus audio
        if: matrix.check != 'engine' && steps.changes.outputs.full != 'false' && steps.audio.outputs.cache-hit != 'true'
        run: ./target/release/timegrapher regress corpus --fetch --smoke --baseline regress/baseline.json --quiet > /dev/null
      # On a pull request the app and MCP checks read a cut of the corpus:
      # each take's first three sound files and its last (about 8 h of
      # audio in all, not 31). Every push to main reads every file, and the CI
      # watchdog flags a failure there on an issue. The engine check always
      # reads the whole corpus.
      - name: Cut the corpus for a pull request
        if: github.event_name == 'pull_request' && matrix.check != 'engine' && steps.changes.outputs.full != 'false'
        run: |
          python3 .github/ci/cut_corpus.py corpus "$RUNNER_TEMP/corpus-cut" --files 3
          echo "TIMEGRAPHER_CORPUS=$RUNNER_TEMP/corpus-cut" >> "$GITHUB_ENV"
      # take_context's a_corpus_take_read_at_once_reads_as_each_entry_alone
      # (#1958) reads the example take datejust41_3235_multipos_105min,
      # which regress neither fetches nor reads: its audio, its poise30.toml
      # and poise60.toml, and its positions from raw/session.toml. The corpus
      # keeps that file as raw/app_session.toml.txt, since regress would read
      # a raw/session.toml as a session of raw/; it is copied to the test's
      # name here, after regress has run. A corpus revision without the take
      # has nothing to fetch, and the test skips there.
      - name: Fetch the multi-position example take for take_context
        if: matrix.check == 'engine' && steps.changes.outputs.full != 'false'
        run: |
          take=datejust41_3235_multipos_105min
          if [ -d "corpus/takes/$take" ]; then
            python3 corpus/scripts/fetch.py "$RUNNER_TEMP/example" "$take"
            mv "$RUNNER_TEMP/example/$take"/*.flac "corpus/takes/$take/"
            cp "corpus/takes/$take/raw/app_session.toml.txt" "corpus/takes/$take/raw/session.toml"
          else
            echo "corpus $CORPUS_REVISION has no $take"
          fi
      # wheel_lines and take_context also read corpus takes, and skip
      # without the corpus, so they run here where it is whole (#1362).
      - name: Required real-recording analyze/session equivalence
        if: matrix.check == 'engine' && steps.changes.outputs.full != 'false'
        # 5.3 minutes at 7b311d7 (run 45669855332). The test binaries run one
        # after another, so the multi-position take's test adds about 400 s.
        timeout-minutes: 20
        run: |
          set -o pipefail
          cargo test --locked --release -p timegrapher-core --test equivalence --test wheel_lines --test take_context -- --nocapture 2>&1 | tee equivalence.txt
      # The example take's audio stays out of the corpus audio cache, which
      # this job may save, so the cache and the other checks read as before.
      - name: Leave the example take's audio out of the cache
        if: always() && matrix.check == 'engine'
        run: rm -f corpus/takes/datejust41_3235_multipos_105min/*.flac
      # #514: each take opened as the app opens it reads what
      # `timegrapher session` reads, to the bit.
      - name: ALSA headers for the app
        if: matrix.check == 'app' && steps.changes.outputs.full != 'false'
        run: .github/ci/apt-install.sh libasound2-dev
      - name: App against session on every corpus take
        if: matrix.check == 'app' && steps.changes.outputs.full != 'false'
        # Each take is also opened whole, for its panes against series and
        # session (#514): about 3 minutes on a pull request's cut, and 20.5
        # on the whole corpus (run 41989178413, against 14.6 before). Main's
        # whole-corpus runs took 21 to 27 minutes on 11-18 and 11-19; a slow
        # runner with a cold build cache needed just over 35 (#2028).
        timeout-minutes: 50
        run: |
          set -o pipefail
          cargo test --locked --release -p timegrapher-app corpus_tests -- --nocapture 2>&1 | tee app-corpus.txt
      # Each sound file a take lists, read through the MCP server's
      # analyze_recording, reads what `timegrapher session` reads.
      - name: MCP server against session on every corpus recording
        if: matrix.check == 'mcp' && steps.changes.outputs.full != 'false'
        # Main's whole-corpus runs took 17 to 21 minutes on 11-18 and 11-19;
        # a runner about 1.7 times slow ran out 30 (#2028).
        timeout-minutes: 45
        run: |
          set -o pipefail
          cargo test --locked --release -p timegrapher-mcp --bins corpus_tests -- --nocapture 2>&1 | tee mcp-corpus.txt
      # After the example take's audio is gone, as from the Actions cache. Only
      # after a passing job, so a cut-off fetch is never kept.
      - name: Keep the corpus audio on the workstation
        if: success() && steps.changes.outputs.full != 'false' && runner.environment == 'self-hosted'
        run: python3 .github/ci/self_hosted_audio.py keep "$TG_CACHE/corpus-audio" corpus/takes
      - name: Summary
        if: always()
        run: |
          for result in regress.txt equivalence.txt app-corpus.txt mcp-corpus.txt; do
            if [ -f "$result" ]; then
              { echo "### $result"; echo '```'; cat "$result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
