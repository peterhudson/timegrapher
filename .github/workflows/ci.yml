name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    paths-ignore: ["**.md"]
  workflow_dispatch:

# A newer push to a PR cancels that PR's run still in progress; runs on main
# are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: ALSA headers for sound input
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --release

  # The engine against tg on the stored takes (docs/regress.md). The audio
  # lives in the private recordings repo, read with the RECORDINGS_TOKEN
  # secret (a read-only token for that repo alone). Without the secret, as
  # on pull requests from forks, the job says so and passes. The log shows
  # take names and numbers only: no audio, file names or take notes.
  regress:
    runs-on: ubuntu-latest
    env:
      RECORDINGS_TOKEN: ${{ secrets.RECORDINGS_TOKEN }}
    steps:
      - name: Skip without the recordings
        if: env.RECORDINGS_TOKEN == ''
        run: echo "::notice::No RECORDINGS_TOKEN secret here, so the tg regression check is skipped."
      - uses: actions/checkout@v4
        if: env.RECORDINGS_TOKEN != ''
      - name: Check out the recordings
        if: env.RECORDINGS_TOKEN != ''
        uses: actions/checkout@v4
        with:
          repository: peterhudson/timegrapher-recordings
          token: ${{ secrets.RECORDINGS_TOKEN }}
          path: recordings
          fetch-depth: 1
          persist-credentials: false
      # Takes too big for git keep their audio in a release named after
      # the take's folder.
      - name: Fetch audio kept in releases
        if: env.RECORDINGS_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.RECORDINGS_TOKEN }}
        run: |
          repo=peterhudson/timegrapher-recordings
          for tag in $(gh api "repos/$repo/releases" --paginate -q '.[].tag_name'); do
            if [ -d "recordings/$tag" ]; then
              gh release download "$tag" -R "$repo" -D "recordings/$tag" -p '*.flac' --skip-existing
            fi
          done
      - uses: dtolnay/rust-toolchain@stable
        if: env.RECORDINGS_TOKEN != ''
      - uses: Swatinem/rust-cache@v2
        if: env.RECORDINGS_TOKEN != ''
      - name: Build
        if: env.RECORDINGS_TOKEN != ''
        run: cargo build --locked --release -p timegrapher-cli --no-default-features
      - name: Engine against tg and the baseline
        if: env.RECORDINGS_TOKEN != ''
        run: |
          set -o pipefail
          ./target/release/timegrapher regress recordings --baseline regress/baseline.json --quiet | tee regress.txt
      - name: Summary
        if: always() && env.RECORDINGS_TOKEN != ''
        run: |
          if [ -f regress.txt ]; then
            { echo '```'; cat regress.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
