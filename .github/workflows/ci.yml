name: CI

# Every push to main and every pull request runs all five jobs. A pull
# request that only edits or adds Markdown nothing compiles in or tests read
# is a light run (.github/ci/changes.py): all five jobs still run and report,
# the test jobs run only their offline Python tests, regress skips its corpus
# and engine steps, and mcp-renderer runs as usual. The watchmaker skill and
# the docs the MCP server compiles in always run in full. A pull request that
# changes a page the downloads carry also runs Release's render and link
# check of those pages, in the ubuntu test job.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to a PR cancels that PR's run still in progress; runs on main
# are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Time limits count from when a runner starts the job, not the queue, and
    # sit well above the slowest recent run (test 18 minutes, regress 7) so a
    # hung job fails within the hour instead of GitHub's six. The CI watchdog
    # does not re-run a job that hits one.
    timeout-minutes: 45
    # No debug info in CI's release builds, as release.yml already builds the
    # downloads (Cargo.toml's [profile.release] keeps debug = 1 for local
    # builds). Measured locally, a warm build of the tests was about 9%
    # faster and the target folder under half the size.
    # rust-cache keys on CARGO_* variables, so this gets a cache of its own.
    env:
      CARGO_PROFILE_RELEASE_DEBUG: "0"
    steps:
      # Two commits: on a pull request, GitHub's merge commit and its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Full or light run
        id: changes
        shell: bash
        run: python3 .github/ci/changes.py "${{ github.event_name }}" HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
      # Offline tests of the publishing gate; keep its five-job/step contract
      # in .github/scripts/release_ci_gate.py synchronized with this workflow.
      - name: Release CI gate tests (offline)
        run: python3 -m unittest discover -s .github/scripts -p 'test_release_ci_gate.py' -v
      - name: CI watchdog tests (offline)
        run: python3 -m unittest discover -s .github/watchdog -p 'test_ci_watchdog.py' -v
      - name: Packaging script tests (offline)
        run: python3 -m unittest discover -s packaging -p 'test_*.py' -v
      - name: Light-run rule tests (offline)
        run: python3 -m unittest discover -s .github/ci -p 'test_changes.py' -v
      # A pull request that changes README, LICENSE, docs/ or the watchmaker
      # skill runs release.yml's render and link check of the downloads'
      # pages, so what would fail there fails here, not at the next draft.
      - name: Documentation pages
        if: runner.os == 'Linux' && steps.changes.outputs.pages == 'true'
        env:
          REF: ${{ github.event.pull_request.head.sha }}
        run: |
          command -v pandoc >/dev/null || { sudo apt-get update && sudo apt-get install -y pandoc; }
          pandoc --version | head -1
          for p in linux macos windows; do
            python3 packaging/docs_html.py render "$RUNNER_TEMP/docs-html/$p" "$p" --ref "$REF"
            python3 packaging/docs_html.py check "$RUNNER_TEMP/docs-html/$p"
          done
      # Exercise the supported compiler floor without another build/job.
      # Keep this version aligned with workspace.package.rust-version and
      # docs/building.md. Other hosts continue checking current stable.
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.full != 'false'
        with:
          toolchain: ${{ matrix.os == 'ubuntu-24.04' && '1.90.0' || 'stable' }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.full != 'false'
      - name: ALSA headers for sound input
        if: runner.os == 'Linux' && steps.changes.outputs.full != 'false'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - run: cargo fmt --check
        if: steps.changes.outputs.full != 'false'
      - run: cargo clippy --locked --all-targets -- -D warnings
        if: steps.changes.outputs.full != 'false'
      - run: cargo test --locked --release
        if: steps.changes.outputs.full != 'false'

  mcp-renderer:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.22.1'
      - run: node --test crates/timegrapher-mcp/tests/*.test.cjs

  # The engine against tg on the public corpus's takes (docs/regress.md),
  # plus its smoke takes. The audio is downloaded from the corpus's
  # releases, checked by SHA-256 and cached between runs.
  regress:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      # As in the test job: no debug info in CI's release builds.
      CARGO_PROFILE_RELEASE_DEBUG: "0"
      # Reviewed with the engine baseline; update through docs/regress.md.
      CORPUS_REVISION: 692c7bcaa2c072d4075f4a85ce75564df962ab60
    steps:
      # Two commits: on a pull request, GitHub's merge commit and its base.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Full or light run
        id: changes
        shell: bash
        run: python3 .github/ci/changes.py "${{ github.event_name }}" HEAD^1 HEAD | tee -a "$GITHUB_OUTPUT"
      # Metadata in git, audio in releases: no secret, so this also runs on
      # pull requests from forks.
      - name: Check out the corpus
        if: steps.changes.outputs.full != 'false'
        uses: actions/checkout@v7
        with:
          repository: peterhudson/timegrapher-corpus
          ref: ${{ env.CORPUS_REVISION }}
          path: corpus
          fetch-depth: 1
          persist-credentials: false
      - name: Record corpus inputs
        if: steps.changes.outputs.full != 'false'
        run: |
          python3 - <<'PY'
          import hashlib, os, pathlib, subprocess
          actual = subprocess.check_output(["git", "-C", "corpus", "rev-parse", "HEAD"], text=True).strip()
          if actual != os.environ["CORPUS_REVISION"]:
              raise SystemExit(f"corpus checkout {actual} differs from the reviewed revision")
          manifest = hashlib.sha256(pathlib.Path("corpus/corpus.json").read_bytes()).hexdigest()
          report = (f"Engine revision: `{os.environ['GITHUB_SHA']}`\n\n"
                    f"Corpus revision: `{actual}`\n\n"
                    f"corpus.json SHA-256: `{manifest}`\n\n")
          print(report, end="")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(report)
          PY
      - name: Corpus audio cache
        if: steps.changes.outputs.full != 'false'
        uses: actions/cache@v6
        with:
          path: |
            corpus/takes/**/*.flac
          key: corpus-audio-${{ hashFiles('corpus/corpus.json') }}
          restore-keys: corpus-audio-
      # A cache from an older corpus.json can hold files the corpus has
      # since renamed; a take read as a whole folder would read them too.
      - name: Drop cached audio the corpus no longer lists
        if: steps.changes.outputs.full != 'false'
        run: |
          python3 - <<'PY'
          import json, pathlib
          c = json.load(open("corpus/corpus.json"))
          keep = {f"{t['id']}/{f['name']}" for t in c["takes"] for f in t["files"]}
          for p in pathlib.Path("corpus/takes").glob("*/*.flac"):
              if f"{p.parent.name}/{p.name}" not in keep:
                  print(f"removing stale {p}")
                  p.unlink()
          PY
      - uses: dtolnay/rust-toolchain@stable
        if: steps.changes.outputs.full != 'false'
      - uses: Swatinem/rust-cache@v2
        if: steps.changes.outputs.full != 'false'
      - name: Build
        if: steps.changes.outputs.full != 'false'
        run: cargo build --locked --release -p timegrapher-cli --no-default-features
      - name: Engine against tg and the baseline
        if: steps.changes.outputs.full != 'false'
        run: |
          set -o pipefail
          ./target/release/timegrapher regress corpus --fetch --smoke --baseline regress/baseline.json --quiet | tee regress.txt
      - name: Required real-recording analyze/session equivalence
        if: steps.changes.outputs.full != 'false'
        timeout-minutes: 10
        env:
          TIMEGRAPHER_CORPUS: ${{ github.workspace }}/corpus
          TIMEGRAPHER_REQUIRE_CORPUS: "1"
        run: |
          set -o pipefail
          cargo test --locked --release -p timegrapher-core --test equivalence analyze_and_session_agree_on_real_takes -- --exact --nocapture 2>&1 | tee equivalence.txt
      - name: Summary
        if: always()
        run: |
          for result in regress.txt equivalence.txt; do
            if [ -f "$result" ]; then
              { echo "### $result"; echo '```'; cat "$result"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
          done
