name: Release

# Builds every platform's files and creates a draft release holding them; a
# maintainer reads the draft and publishes it. Two ways to start a release:
# run this workflow on main from the Actions tab with "Draft a release"
# ticked (it takes the next version, see the version job; the tag vX.Y.Z is
# made when the draft is published), or push a tag vX.Y.Z. Run by hand
# without the tick, or on a pull request touching the packaging, it builds the same files as workflow
# artifacts and releases nothing.
# Steps for cutting a release: docs/reference/install.md, "Making a release".
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - ".cargo/config.toml"
      - ".github/workflows/release.yml"
      - ".github/scripts/release_ci_gate.py"
      - ".github/scripts/test_release_ci_gate.py"
      - "packaging/**"
      - "crates/timegrapher-mcp/packaging/**"
  workflow_dispatch:
    inputs:
      release:
        description: Draft a release of main from this run (it takes the next version; see docs/reference/install.md)
        type: boolean
        default: false

permissions:
  contents: read

# One release-capable run at a time, so two drafts never pick the same
# version; pull request runs only build and may overlap.
concurrency:
  group: release-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

env:
  # Smaller programs: no debug information in the downloads (crash records
  # still name the functions).
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_PROFILE_RELEASE_STRIP: debuginfo

jobs:
  ci-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require exact-candidate CI before release-capable builds
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUESTED: ${{ toJSON(inputs.release || false) }}
        run: python3 .github/scripts/release_ci_gate.py

  # The version every file of this run carries. Cargo.toml holds the base
  # X.Y.Z; a draft takes one more than the highest patch any remaining
  # release (drafts included) or tag uses for that X.Y, never less than the
  # base, so a draft can be made at any time without a version bump; X or Y
  # is raised by hand in Cargo.toml. A tag build takes the tag's version.
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # Draft releases are listed only to a token that can write.
      contents: write
    outputs:
      version: ${{ steps.pick.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REQUESTED: ${{ toJSON(inputs.release || false) }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = tag ]; then
            version="$(packaging/version.sh "${GITHUB_REF_NAME}")"
          elif [ "${RELEASE_REQUESTED}" = true ] && [ "${GITHUB_REF}" = refs/heads/main ]; then
            # A failed listing must stop the run, not drop names.
            set -o pipefail
            used="$RUNNER_TEMP/used-versions"
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" --jq '.[].tag_name' > "$used"
            git ls-remote --tags origin | sed -e 's#.*refs/tags/##' -e 's#\^{}$##' >> "$used"
            version="$(python3 packaging/release_version.py next "$used")"
          else
            version="$(packaging/version.sh)"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version" | tee -a "$GITHUB_STEP_SUMMARY"

  # The documentation every download carries, as offline web pages, with
  # a Start Here page for each platform (packaging/docs_html.py).
  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Render
        env:
          # Links to source files go to GitHub at the commit built.
          REF: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          command -v pandoc >/dev/null || .github/ci/apt-install.sh pandoc
          pandoc --version | head -1
          for p in linux macos windows; do
            python3 packaging/docs_html.py render "docs-html/$p" "$p" --ref "$REF"
            python3 packaging/docs_html.py check "docs-html/$p"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-html
          path: docs-html
          if-no-files-found: error

  build:
    needs: [ci-gate, version, docs]
    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04 so the Linux builds run on distributions from 2022 on.
          # `name` keeps each build's information file apart; `arch` is
          # the AppImage tool and runtime each Linux build fetches.
          - { platform: linux, name: linux-x86_64, arch: x86_64, os: ubuntu-22.04 }
          # 64-bit ARM: Raspberry Pi 4 and 5, CM4 handhelds, ARM laptops
          # and boards. Built natively on GitHub's ARM runner.
          - { platform: linux, name: linux-aarch64, arch: aarch64, os: ubuntu-22.04-arm }
          - { platform: macos, name: macos, os: macos-latest }
          - { platform: windows, name: windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Only this checkout changes: Cargo.toml and Cargo.lock take the
          # version the programs, file names and MCP bundle then carry.
          py=python3; [ "$RUNNER_OS" = Windows ] && py=python
          "$py" packaging/release_version.py set "$VERSION"
          [ "$(packaging/version.sh)" = "$VERSION" ]
          echo "PY=$py" >> "$GITHUB_ENV"
          # The build date in --version is the commit's, not the runner's.
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
          # Help > User Guide's online fallback opens the manual at the
          # commit built (crates/timegrapher-app/src/guide.rs).
          echo "TIMEGRAPHER_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          # The programs released; the MCP server once the workspace has it.
          pkgs="-p timegrapher-cli -p timegrapher-app"
          [ -d crates/timegrapher-mcp ] && pkgs="$pkgs -p timegrapher-mcp"
          echo "PKGS=$pkgs" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-html
          path: ${{ runner.temp }}/docs-html
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # Pinned by commit, the action no longer reads the toolchain from
          # the branch name.
          toolchain: stable
          targets: ${{ matrix.platform == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: release

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          .github/ci/apt-install.sh libasound2-dev
          cargo build --release --locked $PKGS
          # Fixed releases of the AppImage tool and the runtime it puts at
          # the front of the AppImage, checked by hash; without a runtime
          # file the tool fetches its newest one.
          # The runner's own architecture is the one built.
          [ "$(uname -m)" = "$ARCH" ]
          case "$ARCH" in
            x86_64)
              tool_sha=ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0
              runtime_sha=2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d ;;
            aarch64)
              tool_sha=f0837e7448a0c1e4e650a93bb3e85802546e60654ef287576f46c71c126a9158
              runtime_sha=00cbdfcf917cc6c0ff6d3347d59e0ca1f7f45a6df1a428a0d6d8a78664d87444 ;;
            *) echo "no AppImage tool listed for $ARCH" >&2; exit 1 ;;
          esac
          curl -sSfL -o "$RUNNER_TEMP/appimagetool" \
            "https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-$ARCH.AppImage"
          curl -sSfL -o "$RUNNER_TEMP/appimage-runtime" \
            "https://github.com/AppImage/type2-runtime/releases/download/20251108/runtime-$ARCH"
          echo "$tool_sha  $RUNNER_TEMP/appimagetool" | sha256sum -c -
          echo "$runtime_sha  $RUNNER_TEMP/appimage-runtime" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/appimagetool"
          APPIMAGE_EXTRACT_AND_RUN=1 APPIMAGETOOL="$RUNNER_TEMP/appimagetool" \
            APPIMAGE_RUNTIME="$RUNNER_TEMP/appimage-runtime" \
            packaging/linux.sh dist "$RUNNER_TEMP/docs-html/linux"
      - name: Build (macOS)
        if: matrix.platform == 'macos'
        run: |
          for t in aarch64-apple-darwin x86_64-apple-darwin; do
            cargo build --release --locked $PKGS --target "$t"
          done
          packaging/macos.sh dist "$RUNNER_TEMP/docs-html/macos"
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        run: |
          cargo build --release --locked $PKGS
          packaging/windows.sh dist "$RUNNER_TEMP/docs-html/windows"

      # One file per platform (a disk image on macOS, a zip holding one
      # folder elsewhere): its documentation must have no broken links, and
      # every program in it must start.
      - name: Check the download
        run: |
          files=(dist/*)
          [ "${#files[@]}" -eq 1 ]
          echo "ZIP=${files[0]}" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = macOS ]; then
            [[ "${files[0]}" == *.dmg ]]
            # Copied out so the image is detached before the upload.
            hdiutil attach "${files[0]}" -mountpoint "$RUNNER_TEMP/dmg" -nobrowse -readonly
            mkdir check && cp -R "$RUNNER_TEMP/dmg" "check/volume"
            hdiutil detach "$RUNNER_TEMP/dmg"
            [ -L check/volume/Applications ]
          else
            [[ "${files[0]}" == *.zip ]]
            mkdir check && 7z x -bso0 -ocheck "${files[0]}"
          fi
          folders=(check/*)
          # One line per test: bash -e ignores a failed test in an && list
          # unless it is the list's last command.
          [ "${#folders[@]}" -eq 1 ]
          [ -d "${folders[0]}" ]
          echo "PKG=${folders[0]}" >> "$GITHUB_ENV"
          find "${folders[0]}" -maxdepth 2 | sort
          "$PY" packaging/docs_html.py check "${folders[0]}"
          [ -f "${folders[0]}/Start Here.html" ]
          [ -f "${folders[0]}/LICENSE.txt" ]
      - name: Check the programs (Linux)
        if: matrix.platform == 'linux'
        run: |
          cli="$PKG/Command Line"
          "$cli/timegrapher" --version
          "$cli/timegrapher-mcp" --version
          python3 packaging/artifact_smoke.py "$cli" --label linux-cli
          # Unzipped with 7-Zip above; unzip must also keep the AppImage
          # executable, as file managers do.
          mkdir unzip-check && unzip -q "$ZIP" -d unzip-check
          app=(unzip-check/*/Timegrapher.AppImage)
          [ -x "${app[0]}" ]
          [ -x "$(dirname "${app[0]}")/Command Line/timegrapher" ]
          APPIMAGE_EXTRACT_AND_RUN=1 "${app[0]}" cli --version
          APPIMAGE_EXTRACT_AND_RUN=1 "${app[0]}" --help
          mkdir appimage-check
          (cd appimage-check && "../${app[0]}" --appimage-extract >/dev/null)
          python3 packaging/artifact_smoke.py appimage-check/squashfs-root/usr/bin --label linux-appimage
      - name: Check the programs (macOS)
        if: matrix.platform == 'macos'
        run: |
          app="$PKG/Timegrapher.app"
          lipo -archs "$app/Contents/MacOS/timegrapher-app"
          codesign --verify --verbose "$app"
          "$app/Contents/MacOS/timegrapher" --version
          "$app/Contents/MacOS/timegrapher-app" --help
          python3 packaging/artifact_smoke.py "$app/Contents/MacOS" --label macos-app
          cli="$PKG/Command Line"
          "$cli/timegrapher" --version
          "$cli/timegrapher-mcp" --version
          python3 packaging/artifact_smoke.py "$cli" --label macos-cli
          # The Claude Desktop extension is required on this platform.
          b="$PKG/Claude Desktop/Timegrapher.mcpb"
          mkdir mcpb && unzip -q "$b" -d mcpb
          python3 -c "import json,sys; json.load(open('mcpb/manifest.json'))"
          lipo -archs mcpb/server/timegrapher-mcp
          mcpb/server/timegrapher-mcp --version
          mcpb/server/timegrapher --version
          python3 packaging/artifact_smoke.py mcpb/server --label macos-mcpb
      - name: Check the programs (Windows)
        if: matrix.platform == 'windows'
        run: |
          "$PKG/Timegrapher.exe" --help
          cli="$PKG/Command Line"
          "$cli/timegrapher.exe" --version
          "$cli/timegrapher-mcp.exe" --version
          # Only DLLs every Windows has (the C runtime is built in).
          python packaging/windows_imports.py "$PKG" "$cli"
          python packaging/artifact_smoke.py "$cli" --label windows-cli
          # The Claude Desktop extension is required on this platform.
          7z x -bso0 -omcpb "$PKG/Claude Desktop/Timegrapher.mcpb"
          python -c "import json; json.load(open('mcpb/manifest.json'))"
          mcpb/server/timegrapher-mcp.exe --version
          mcpb/server/timegrapher.exe --version
          python packaging/windows_imports.py mcpb/server
          python packaging/artifact_smoke.py mcpb/server --label windows-mcpb

      # Uploaded as the file itself, so a download from the run's page is
      # the same file the release gets, not a zip around it.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ env.ZIP }}
          archive: false
          if-no-files-found: error
      # The compiler and runner image, for the draft's notes.
      - name: Build information
        env:
          NAME: ${{ matrix.name }}
        run: |
          echo "- $NAME: $(rustc -V), runner $ImageOS $ImageVersion" > "buildinfo-$NAME.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: buildinfo-${{ matrix.name }}.txt
          archive: false
          if-no-files-found: error

  release:
    if: >-
      (github.event_name == 'push' && github.ref_type == 'tag') ||
      (github.event_name == 'workflow_dispatch' && inputs.release && github.ref == 'refs/heads/main')
    needs: [version, build]
    runs-on: ubuntu-24.04
    permissions:
      # Creating the release and uploading its files.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The history the notes list pull requests from.
          fetch-depth: 0
      - name: Tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          tag="v$VERSION"
          # The version job picked a free number; this only guards against a
          # release made by hand since.
          if [ "${GITHUB_REF_TYPE}" != tag ] && gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "a release $tag already exists: run the workflow again" >&2
            exit 1
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: timegrapher-*
          path: dist
          merge-multiple: true
          # The zips and the disk image are the release files: keep them whole.
          skip-decompress: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: buildinfo-*
          path: buildinfo
          merge-multiple: true
          skip-decompress: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # From the Actions tab the tag does not exist yet: --target names
          # the commit built, and GitHub makes the tag when the draft is
          # published.
          # The notes for testers and users come from
          # packaging/release-notes/X.Y.Z.md when there is one; otherwise
          # they list every change on main since the newest published
          # release (drafts are skipped): merge commits and squash merges
          # alike (#1655). Either way they end with the commit built and
          # each platform's compiler and runner image. Links point at the
          # commit built, not main, so they still say what this release says.
          body="$RUNNER_TEMP/notes.md"
          notes="packaging/release-notes/${TAG#v}.md"
          if [ -f "$notes" ]; then
            cat "$notes" > "$body"
          else
            echo "Downloads and first-launch steps for each platform: [docs/reference/install.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/reference/install.md)." > "$body"
            read -r prev_name prev_tag < <(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq '.[] | select(.draft | not) | "\(.name | gsub(" "; "_")) \(.tag_name)"' | head -n 1 || true) || true
            # The release's tag names its commit; target_commitish can be a
            # branch name.
            prev_sha="$(git rev-parse --verify --quiet "refs/tags/${prev_tag:-none}^{commit}" || true)"
            if [ -n "${prev_sha:-}" ] && git merge-base --is-ancestor "$prev_sha" "$GITHUB_SHA" 2>/dev/null; then
              {
                echo
                echo "## Merged since ${prev_name//_/ }"
                echo
                python3 packaging/release_version.py notes "$prev_sha" "$GITHUB_SHA"
              } >> "$body"
            fi
          fi
          printf '\nBuilt from %s with:\n\n' "$GITHUB_SHA" >> "$body"
          cat buildinfo/buildinfo-*.txt >> "$body"
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft --target "$GITHUB_SHA" \
            --title "Timegrapher ${TAG#v}" \
            --notes-file "$body"
