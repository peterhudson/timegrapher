name: An idea
description: Something the timegrapher should do, show or explain.
title: "Idea: "
labels: ["idea"]
body:
  - type: textarea
    id: need
    attributes:
      label: What you are trying to do
      description: The job at the bench, not the feature. "I regulate after a service and need to see all six positions at once" helps more than "add a table".
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: With this tool, another timegrapher, or by hand.
  - type: textarea
    id: idea
    attributes:
      label: What would help
  - type: dropdown
    id: who
    attributes:
      label: You are
      options: ["A hobbyist", "A watchmaker", "A collector checking a watch", "A developer", "Other"]
